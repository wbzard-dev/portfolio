content: |
  Starting an online store has never been easier technically: you can build one in a weekend. Making it profitable is the hard part. Most new e-commerce founders in Bangalore lose money on the same things: too many products, the wrong platform, expensive ads before the store converts, and returns they didn't plan for.

  ## Step 1: Choose a product and customer

  Good first products are:

  - **Specific**: "millet snacks for diabetic adults" beats "healthy food"
  - **Shippable**: not too heavy, fragile or perishable
  - **Repeat-purchase**: consumables beat one-time buys
  - **Margin-friendly**: enough margin to pay for ads, shipping and returns

  Check demand on marketplaces, Google searches and Instagram before buying stock.

  ## Step 2: Source or make

  Manufacture yourself, work with a contract manufacturer, buy wholesale, or start with print-on-demand. Bangalore and nearby clusters (Tiruppur for apparel, Channapatna for toys, plus large food-processing and cosmetics manufacturers) give many options. Start with small batches.

  ## Step 3: Register

  - Business entity (proprietorship to start; private limited if you plan to raise money)
  - **GST registration**: generally required for selling goods through e-commerce platforms, with some exceptions for small sellers; confirm with your CA
  - **Trademark** application for your brand name
  - **FSSAI** for food, and category-specific licences (cosmetics, ayurveda, electronics)
  - Current account and payment gateway

  ## Step 4: Marketplace or own store?

  | Option | Good for | Downsides |
  |---|---|---|
  | **Amazon, Flipkart, Meesho** | Early volume and trust | Commissions, price wars, no customer data |
  | **Own store (Shopify, WooCommerce, custom)** | Margin, brand, data, repeat buyers | You must bring all traffic |
  | **Instagram + WhatsApp** | Testing, small catalogues | Hard to scale |

  Most brands do both: marketplaces for discovery, own store for profit and repeat customers. Our comparison of [Shopify vs WooCommerce vs custom](/blog/shopify-vs-woocommerce-vs-custom-d2c-india) helps you choose.

  ## Step 5: Payments, shipping and returns

  - **Payment gateway** with UPI, cards and wallets
  - **Shipping aggregator** to compare couriers and print labels
  - **Cash on delivery**: increases orders but also returns; consider partial advance or COD limits
  - **Clear return and refund policy** on every product page

  ## Step 6: First 100 orders

  1. **Your network** and a launch offer to friends, family and colleagues; ask for reviews
  2. **Instagram** with Reels showing the product in use
  3. **Meta ads** with small daily budgets to test audiences and creatives
  4. **Google Shopping** once your product feed is ready
  5. **Influencer seeding** with micro-creators in your niche
  6. **Email and WhatsApp** to bring first buyers back

  Measure cost per order against margin from day one. Read [Meta ads vs Google ads for startups](/blog/meta-ads-vs-google-ads-for-startups).

