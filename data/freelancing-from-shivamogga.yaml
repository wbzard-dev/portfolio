content: |
  Not everyone wants to, or can, move to Bangalore after college. The good news: software is one of the few careers where where you live matters less every year. Developers in Shivamogga can build websites for local businesses, work for clients in Bangalore, and take projects from abroad, all from home.

  Freelancing is a real business, though. Here's how to start it properly.

  ## Skills that clients pay for

  | Skill | Who pays | Time to learn (with practice) |
  |---|---|---|
  | **Business websites** (HTML, CSS, JavaScript, React) | Local shops, clinics, coaching centres | A few months |
  | **WordPress sites** | Small businesses, bloggers | Weeks to months |
  | **Landing pages for ads** | Marketers, startups | After you know web basics |
  | **Full-stack web apps** (MERN) | Startups, agencies | Several months |
  | **Fixes and maintenance** | Existing site owners | Ongoing |
  | **Automation** (Google Sheets, Zapier, scripts) | Offices, small teams | Weeks |
  | **Deployment and cloud setup** | Startups, agencies | After DevOps basics |

  Pick one, get good at it, then expand. See [what is the MERN stack](/blog/what-is-mern-stack) and [the DevOps roadmap](/blog/devops-roadmap-for-beginners).

  ## Step 1: Build a portfolio

  Clients buy proof. Build 3–5 projects that look like real client work:

  - A website for a local clinic or café (with permission, or a realistic concept)
  - A landing page with a working form
  - A small web app: booking system, inventory tracker, quiz app
  - Each with a **live link**, screenshots and a short case study: problem, what you built, result

  Put the code on GitHub ([Git and GitHub for beginners](/blog/git-and-github-for-beginners)) and build a simple portfolio site. Ideas: [portfolio projects that get freshers hired](/blog/developer-portfolio-projects-get-hired).

  ## Step 2: Find your first clients

  **Start local.** Shivamogga has many businesses with no website or an outdated one. Your advantage: you can meet them, speak Kannada and visit the shop. Good first clients:

  - Family and friends' businesses
  - Coaching centres, clinics, salons, shops and homestays
  - College events, clubs and alumni associations

  **Then online:**

  - **LinkedIn:** post about what you build; connect with founders and agency owners
  - **Freelance platforms** (Upwork, Fiverr, Freelancer and others): competitive at first; a niche helps
  - **Agencies in Bangalore** often hire freelancers for overflow work
  - **Developer communities** on Discord, X and local meetups

  ## Step 3: Price and scope properly

  - **Write the scope:** pages, features, revisions, timeline, what's not included
  - **Charge per project** rather than per hour when starting
  - **Take an advance** (for example 40–50%) before starting, and the balance before handing over
  - **Recurring income:** offer hosting setup, maintenance and small monthly updates
  - **Don't undercharge forever.** Raise prices as your portfolio grows

  Look at how agencies itemise quotes in [website design cost in Shivamogga](/blog/website-design-cost-shivamogga).

  ## Step 4: Payments, contracts and taxes

  - **Indian clients:** UPI or bank transfer with a simple invoice
  - **International clients:** platform payouts or services such as PayPal, Payoneer or Wise; compare fees and conversion rates
  - **Contracts:** even a one-page agreement or a clear email confirming scope, price and timeline
  - **Taxes:** freelance income is taxable. Keep records of income and expenses. GST may apply above certain turnover thresholds, and exporting services has its own rules. Speak to a CA once income is regular.

  ## Step 5: Work like a professional

  - Reply within a day, even if it's "I'll get back to you by Friday"
  - Share progress weekly with a live preview link
  - Use Git, back up everything, keep client accounts in the client's name
  - Ask happy clients for a testimonial and referrals

  ## Freelance, job or both?

  Many developers do both: a full-time remote or Bangalore job for stable income and learning, plus freelance work on weekends. Others freelance first to build experience. See [IT jobs for freshers from Shivamogga](/blog/it-jobs-for-freshers-shivamogga) and [becoming a full stack developer from Shivamogga](/blog/full-stack-developer-from-shivamogga).

