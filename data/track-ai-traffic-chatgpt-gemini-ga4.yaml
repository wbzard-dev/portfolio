content: |
  *Updated 24 October 2026.*

  A founder in Bangalore asks ChatGPT for "the best way to build an MVP on a budget". A student in Shivamogga asks Gemini "which DevOps course is good for beginners". Both get an answer with links, and some of them click.

  That's real, high-intent traffic. The problem: Google Analytics 4 often can't tell you it happened.

  ## Why AI traffic hides in "Direct"

  When someone clicks a link, the browser usually sends a **referrer** telling your site where the visitor came from. AI traffic often loses it:

  - **Mobile apps** (ChatGPT, Gemini) open links in in-app browsers that may not pass a referrer
  - **Assistants built into phones** can strip it entirely
  - **Copy-pasted links** arrive with no source at all

  GA4 then files the visit as **Direct**, which looks like someone typed your URL. Your "Direct" traffic growing for no obvious reason is often a sign of AI referrals.

  ## The October 2026 change: Gemini adds UTM tags

  From around **30 September 2026**, people noticed **Gemini adding UTM parameters** to some outbound links. A Reddit user spotted it and Google's John Mueller acknowledged seeing the tags too. Unlike a referrer, a UTM tag survives in-app browsers and server logs, so these visits can be attributed even when the referrer is lost.

  The caveats:

  - Google **hasn't documented** which links get tags or the full set of values
  - Coverage appears **partial**; not every Gemini link is tagged
  - One early sample found **AI Overviews and AI Mode links largely untagged**; those clicks usually show as Google organic traffic anyway

  So: helpful, but not a complete solution.

  ## Step 1: See what you already get

  In GA4, go to **Reports → Acquisition → Traffic acquisition**, change the dimension to **Session source / medium**, and look for:

  - `chatgpt.com` / `chat.openai.com`
  - `gemini.google.com`
  - `perplexity.ai`
  - `copilot.microsoft.com`
  - `claude.ai`

  Also search for `gemini` in **Session source** and **Session campaign** to spot UTM-tagged Gemini visits.

  ## Step 2: Create an "AI assistants" channel

  GA4's default channel groups may or may not separate AI traffic in your property. To be sure, create your own:

  1. **Admin → Data display → Channel groups → Create new channel group**
  2. Copy the default group, then **add a new channel** called "AI assistants"
  3. Condition: **Session source** *matches regex*:

  ```
  .*(chatgpt|openai|gemini\.google|bard\.google|perplexity|copilot\.microsoft|claude\.ai|you\.com|meta\.ai).*
  ```

  4. Also add a condition for **Session source contains "gemini"** to catch UTM-tagged visits
  5. **Move "AI assistants" above "Referral"** in the list, so it's matched first
  6. Save, then use this channel group in your reports and explorations

  Channel groups apply to historical data too, so you'll see past AI visits immediately.

  ## Step 3: Tag your own links in AI-friendly places

  You can't control how ChatGPT links to you, but you can tag links you place yourself:

  - Links in your **llms.txt**, press kits and partner pages
  - Links you share in communities that AI tools learn from
  - Paid placements, such as [ChatGPT ads](/blog/chatgpt-ads-india-guide), with `utm_source=chatgpt&utm_medium=cpc`

  Keep naming consistent. Our [GA4 conversion tracking guide](/blog/ga4-conversion-tracking-setup) covers UTM conventions.

  ## Step 4: Measure what matters

  Sessions from AI assistants are interesting. Enquiries are what count. Build a simple exploration:

  - **Rows:** your AI assistants channel, by session source
  - **Values:** sessions, engaged sessions, **key events** (form submissions, WhatsApp clicks, calls)
  - **Compare** conversion rate with Google organic and paid

  AI-referred visitors have usually already read a summary of your topic before they click, so they may arrive closer to a decision. Compare their conversion rate with other channels in your own data before deciding how much to invest.

  ## Step 5: Check server logs (optional, for technical teams)

  Hosting logs or tools like Cloudflare analytics record UTM parameters and user agents even when GA4 misses visits (for example, when cookie consent is declined). They also show **AI crawlers** (GPTBot, OAI-SearchBot, PerplexityBot, Google-Extended) reading your site, a leading indicator that you may be cited.

  ## Why this matters for small businesses

  AI assistants are becoming a front door for research, especially for considered purchases: courses, software, home interiors, travel, healthcare. If you can't measure the traffic, you can't tell whether your [Generative Engine Optimisation](/blog/generative-engine-optimization-guide-india) work is paying off, or whether to invest more in it.

