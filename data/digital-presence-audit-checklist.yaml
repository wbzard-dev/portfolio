content: |
  If your business isn't getting enough enquiries online, it's tempting to jump straight into ads or hire an agency. But most of the time, the problem is something simple that nobody has checked: an outdated phone number, an unverified Google profile, a broken contact form, or a website Google has never indexed.

  A quick self-audit finds these problems before you spend money. You don't need technical skills or paid tools, just a phone, a laptop and an hour. This checklist walks through the five areas that matter most for a small business in India: how customers find you, your Google profile, your website, your social media, and your tracking and ownership. At the end, you'll know exactly what to fix first.

  ## Part 1: Search like a customer (10 minutes)

  Use your phone and a private browser tab, so Google doesn't personalise results.

  - [ ] Search your **exact business name** and city. Do you appear, with the right details?
  - [ ] Search your **main service plus "near me"** from your location.
  - [ ] Search your **service plus area or city**, such as "bakery in Jayanagar" or "CA in Shivamogga".
  - [ ] Note which **competitors** appear above you and how many reviews they have.
  - [ ] Ask an AI assistant like ChatGPT or Gemini to recommend a business like yours in your city.

  Take screenshots of what you find. They make a useful "before" record, so you can compare results after making fixes. If a competitor keeps appearing above you, look closely at their profile and website. They usually have more photos, more recent reviews or a page that matches the search exactly. Our [guide to AI Overviews for local businesses](/blog/ai-overviews-ai-mode-local-business) explains how AI answers pick which businesses to mention.

  If you don't appear at all, read [why your business isn't showing on Google](/blog/business-not-showing-on-google).

  ## Part 2: Google Business Profile (15 minutes)

  - [ ] The profile is **verified** and you're an owner, not just a manager.
  - [ ] **Name, address, phone and website** are correct and match your website.
  - [ ] The **primary category** matches what customers search for.
  - [ ] **Hours**, including holidays, are accurate.
  - [ ] At least **15 to 20 real photos** of your premises, team and work.
  - [ ] Recent **reviews**, and you've replied to each one.
  - [ ] **Services or products** listed with descriptions.
  - [ ] A post or update in the last month.

  Our [Google Business Profile checklist](/blog/google-business-profile-shivamogga-local-seo) explains each item in detail.

  ## Part 3: Your website (15 minutes)

  - [ ] It loads in a few seconds on a phone. Test with **PageSpeed Insights**.
  - [ ] The first screen says **what you do, where, and how to contact you**.
  - [ ] **Call and WhatsApp buttons** are visible on mobile.
  - [ ] Each main service has its **own page**.
  - [ ] **Prices or starting prices** are shown.
  - [ ] The **contact form works**. Submit a test and check it arrives.
  - [ ] The site uses **HTTPS** with no browser warnings.
  - [ ] **Search Console** shows your pages as indexed.

  If several of these fail, read [7 signs your business needs a new website](/blog/signs-business-needs-new-website).

  ## Part 4: Social media and listings (10 minutes)

  - [ ] Your **Instagram bio** says what you do, where, and has a contact link.
  - [ ] You've **posted in the last two weeks**.
  - [ ] **Highlights** show reviews, prices and location.
  - [ ] **Messages are answered** within a few hours. Check your oldest unread DM.
  - [ ] Your **WhatsApp Business profile** has hours, address, catalogue and quick replies.
  - [ ] Details on **JustDial, Practo, Zomato** or your category platforms match your Google profile.

  If your posts get likes but no customers, see [8 reasons Instagram isn't bringing customers](/blog/instagram-posting-no-customers-fix).

  ## Part 5: Tracking and ownership (10 minutes)

  This is the least exciting part and the most important.

  - [ ] You own the **domain** and know its renewal date.
  - [ ] You're the **owner** of Google Business Profile, Analytics, Search Console and Meta business portfolio.
  - [ ] **Google Analytics** is installed and records calls, WhatsApp clicks and form submissions.
  - [ ] If you run ads, **conversion tracking** is working.
  - [ ] You know roughly **how many enquiries** came from online channels last month.

  If you're missing access to anything, start with [how to recover your accounts from a developer](/blog/recover-domain-website-access-from-developer). For tracking, see our [GA4 conversion setup guide](/blog/ga4-conversion-tracking-setup).

  ## What to fix first

  Count how many boxes you ticked in each part. Any part with more than two unticked items is where customers are slipping away. Write down every unticked item with a date to fix it, because a checklist only helps if it turns into a to-do list.

  Don't try to fix everything at once. Work in this order:

  1. **Ownership and access**, because nothing else is safe without it.
  2. **Google Business Profile**, the biggest free source of local customers.
  3. **Website contact buttons and forms**, so visitors can actually reach you.
  4. **Tracking**, so you can measure improvements.
  5. **Content, social media and ads**, once the foundation works.

  ## Repeat the audit every quarter

  An hour spent on this checklist can uncover problems that have been costing you customers for months. Most fixes, like correcting details, adding photos, replying to reviews and testing your form, cost nothing. Repeat the audit every three months, track how many items you've ticked, and you'll steadily strengthen your digital presence without guesswork.

