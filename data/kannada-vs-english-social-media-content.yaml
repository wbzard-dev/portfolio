content: |
  Walk into most shops in Shivamogga and the conversation happens in Kannada. Walk into a co-working space in Koramangala and it's English. Walk into a bakery in Basavanagudi and it's probably both in the same sentence.

  Your social media and ads should sound like the conversations your customers already have with you.

  ## Start with your customers, not your preference

  Ask three questions:

  1. **What language do customers use on calls and WhatsApp?**
  2. **Who decides the purchase?** (For a preschool it's parents; for a SaaS product it's a manager.)
  3. **Where are they?** Shivamogga, Bhadravati and Sagar audiences differ from Whitefield or Electronic City.

  ## A practical rule of thumb

  | Business type | Usually works best |
  |---|---|
  | Local shops, clinics, restaurants, coaching in Shivamogga | Kannada or Kannada-English mix |
  | Neighbourhood businesses in older Bangalore areas | Mix, with Kannada for local warmth |
  | Tech startups, B2B services, premium D2C brands | English, with occasional Kannada for local campaigns |
  | Tourism and homestays near Jog Falls and Agumbe | English and Kannada (visitors come from Bangalore and beyond) |
  | Festivals, local events, community posts | Kannada works strongly almost everywhere |

  This is a starting point. Your own results decide.

  ## Channel by channel

  **Instagram reels.** Voice and on-screen text matter most. A Kannada voice-over with short captions in English or Kannada can reach both audiences. Humour and everyday phrases land better in the language people joke in.

  **Instagram posts and carousels.** Keep text short. For bilingual audiences, put the main line in one language and a small line in the other.

  **WhatsApp broadcasts and status.** Write as you'd speak to a regular customer. In Shivamogga, Kannada messages usually feel more personal.

  **Google Business Profile posts.** Mostly English or mixed, since search terms are often typed in English even by Kannada speakers ("dentist near me", "best cake shop Shimoga").

  **Google Search ads.** Match how people search. Most searches are typed in English or transliterated Kannada. Add Kannada keywords only if you see searches for them.

  **Meta ads.** Easy to test. Run the same offer as two ads, one in Kannada and one in English, to the same audience and compare cost per lead.

  ## Running a simple language test

  1. Pick one offer (for example, "free trial class this Saturday")
  2. Create two versions of the same creative: Kannada and English
  3. Run both for one to two weeks on the same budget
  4. Compare **cost per lead** and **lead quality**, not just likes
  5. Keep the winner, then try a mixed version

  ## Getting Kannada right

  - **Use a fluent writer.** Machine translation often produces formal or awkward Kannada nobody actually speaks.
  - **Match the tone:** everyday spoken Kannada for social, slightly more formal for official notices.
  - **Check fonts and rendering** on phones. Some design tools render Kannada script incorrectly.
  - **Spell your brand consistently** in both scripts.

  Your website can follow the same approach. See [Kannada and bilingual websites](/blog/kannada-bilingual-website-shivamogga).

