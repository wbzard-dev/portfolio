content: |
  *Updated 24 October 2026.*

  Many startup products in Bangalore are built with **Laravel** and shipped in **Docker** containers. After the **PHP2Shell** fixes on 21 October 2026 ([background](/blog/php2shell-cve-2026-109618-explained)), teams have been asking: does this affect Laravel, and how do we patch containers properly?

  ## Is Laravel affected?

  **Yes.** The flaws are in the PHP engine, and they affect PHP-FPM, Apache with mod_php and FrankenPHP, which is how Laravel apps are served. Laravel's own session handling makes no difference. The same is true for **Symfony, CodeIgniter, Yii, Slim** and custom PHP apps.

  Fixed PHP versions: **8.5.12, 8.4.27, 8.3.36, 8.2.35**. Laravel 13 requires PHP 8.3+ ([details](/blog/laravel-13-php-requirements)), so most current Laravel apps need **8.3.36 or later**.

  ## Docker: rebuild properly

  The official `php` image on Docker Hub was rebuilt for the fixed versions across variants (cli, apache, fpm, zts; Debian and Alpine).

  **1. Pin an exact patched tag** in your Dockerfile:

  ```dockerfile
  FROM php:8.4.27-fpm
  # or php:8.3.36-fpm-alpine, php:8.5.12-apache, etc.
  ```

  Floating tags like `php:8.4-fpm` will point to the patched build once published, but only if you **pull again**.

  **2. Rebuild without cache reuse of the base image:**

  ```bash
  docker compose build --pull
  docker compose up -d --force-recreate
  ```

  Without `--pull`, Docker may happily reuse the **old, cached base image**, and you'll ship an unpatched container while thinking you've updated.

  **3. Verify the running container:**

  ```bash
  docker compose exec app php -v
  ```

  Check the version is a fixed one. If you install PHP from **distribution packages** inside the image (Debian, Ubuntu, RHEL bases), the version number may not change after a backported fix; check the package version instead.

  **4. Rebuild everything that uses PHP:** web, queue worker, scheduler, and any sidecar images. Scan images with your registry's vulnerability scanner or tools like Trivy, Grype or Docker Scout to find stragglers.

  ## Restart long-running PHP processes

  Patching binaries doesn't affect processes already running. Restart:

  - **PHP-FPM** and Apache
  - **Queue workers:** `php artisan queue:restart` (Horizon: `php artisan horizon:terminate` and let Supervisor restart it)
  - **Scheduler** containers or cron
  - **Laravel Octane** (Swoole, RoadRunner or FrankenPHP): `php artisan octane:reload` or restart the service
  - Any **Supervisor**-managed PHP processes

  ## Laravel Forge, Vapor and Laravel Cloud

  - **Forge:** Forge-provisioned servers use OS packages; update PHP from the server's PHP settings or via SSH, then restart PHP-FPM and workers
  - **Vapor:** reports say apps on a native PHP 8.3+ runtime were **redeployed automatically**; **custom and Docker runtimes need a rebuild and redeploy**
  - **Laravel Cloud:** check the platform's status announcements and redeploy if advised

  Always confirm against the platform's official announcements.

  ## Interim mitigation

  If you can't rebuild immediately, set in your PHP ini (for example a file copied into `/usr/local/etc/php/conf.d/`):

  ```ini
  session.upload_progress.enabled = 0
  ```

  This blocks the confirmed session-based paths (and covers [CVE-2026-115560](/blog/cve-2026-115560-session-upload-progress)), but not every variant. Don't rely on `ini_set()` in code or `.user.ini`. **Rebuilding with a patched image is the real fix.** More mitigations: [patching on a VPS](/blog/php2shell-patch-vps-ubuntu-php-fpm).

  ## CI/CD: make this automatic next time

  - **Automated base-image updates:** Dependabot or Renovate can open PRs when `php` tags change
  - **Scheduled rebuilds** (weekly) even without code changes
  - **Image scanning** in the pipeline, failing builds on critical CVEs
  - **Pinned, explicit versions** in Dockerfiles so you know exactly what's deployed

  New to this? Our [Docker for beginners](/blog/docker-for-beginners) guide and [DevOps roadmap](/blog/devops-roadmap-for-beginners) cover the basics.

  ## After patching: check for compromise

  For Laravel specifically:

  - Rotate **`APP_KEY`** carefully if you suspect compromise (it invalidates encrypted data and sessions; plan it), plus database passwords, API keys, mail and payment credentials in `.env`
  - Look for unexpected files in `public/` and `storage/`
  - Check logs for PHP processes spawning shells or making outbound connections

  Full checklist: [was my website hacked through PHP2Shell?](/blog/php2shell-was-my-site-hacked)

