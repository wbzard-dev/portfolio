content: |
  Back pain, neck pain, stress and poor sleep come with Bangalore's desk jobs and traffic. That has turned yoga into something many people genuinely need, which means steady demand for good teachers close to home.

  ## Step 1: Certification and focus

  Get a recognised teacher training certification if you don't have one, and decide your focus:

  - **General hatha or vinyasa** for beginners and fitness
  - **Therapeutic yoga** for back pain, PCOS, diabetes, stress
  - **Prenatal and postnatal yoga**
  - **Kids' yoga**
  - **Power yoga** for a fitness crowd
  - **Corporate yoga** for offices

  A clear focus helps people choose you over a generic class.

  ## Step 2: Start small

  You don't need a big studio on day one. Many Bangalore teachers start in:

  - **Apartment clubhouses** (ask the association)
  - **Rented halls** for fixed hours
  - **Shared spaces** in dance or fitness studios
  - **Online** classes on video

  Once your batches are full, move into a dedicated space: clean, quiet, ventilated, with good flooring and storage for mats.

  ## Step 3: Registration

  - Proprietorship or LLP
  - **Trade licence** and **shop and establishment registration** for a dedicated studio
  - **GST** once over the threshold
  - **Waiver and health declaration** forms for students

  ## Step 4: Batches and pricing

  Morning (6–8 am) and evening (6–8 pm) batches are the busiest. Offer monthly and quarterly memberships, drop-in classes, private sessions at a higher rate, and workshops. Keep batch sizes small enough that you can correct posture.

  ## Step 5: Add online classes

  Online classes let you teach students who travel, moved cities, or prefer home. Use them as a separate plan or as a backup included in membership. They also let you reach students outside Bangalore.

  ## Step 6: Get students

  1. **Google Business Profile** as a yoga studio with batch timings, photos and reviews; "yoga classes near me" is searched daily
  2. **Free trial class** for every new enquiry
  3. **Instagram** with short sequences, tips for desk workers and student stories
  4. **Apartment association notice boards** and WhatsApp groups
  5. **Corporate tie-ups** with nearby offices
  6. **A simple website** with batches, prices, your certification and a WhatsApp button

  ## Step 7: Retain students

  Track attendance, message students who miss a week, run 30-day challenges and workshops, and celebrate progress. Ask regular students for Google reviews. A community that renews every month is the whole business.

