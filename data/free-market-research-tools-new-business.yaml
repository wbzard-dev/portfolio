content: |
  Most new businesses in India are started on instinct. Someone sees a busy shop, hears a friend made money, or notices a gap in their area, and jumps in. Sometimes instinct is right. Often, a few hours of research would have shown that demand was seasonal, competition was fierce, or customers wanted something slightly different.

  You don't need an expensive research agency to find out. A handful of free online tools can show you how many people search for what you plan to sell, whether interest is growing, who your competitors are, what customers complain about and what offers others are running. This guide covers seven of those tools, how to use each one for an Indian business idea, and how to turn what you find into decisions.

  ## 1. Google Trends: is interest growing?

  [Google Trends](https://trends.google.com) shows how search interest in a topic changes over time. Set the country to India and narrow it to your state, such as Karnataka.

  Compare a few terms, such as "cloud kitchen" vs "home food delivery", or "pilates" vs "yoga classes". Look for three things: is interest **rising or falling** over five years, is it **seasonal**, and which related searches are growing. A business riding a rising trend is far easier to grow than one fighting a decline.

  ## 2. Google Keyword Planner: how many people search?

  Google Keyword Planner is inside a free Google Ads account. You don't need to run ads to use it. Enter your service and location, such as "physiotherapy Shivamogga" or "interior designer HSR Layout", and it shows a range of monthly searches and the rough cost of advertising.

  High search volume means existing demand. A high suggested bid means competitors find those customers valuable. Our [local SEO guide for Bangalore startups](/blog/local-seo-bangalore-startups) explains how to use these keywords later on your website.

  ## 3. Google Maps: count and study competitors

  Search your business type on Google Maps in your area. Count how many competitors appear, check their ratings and review counts, and note their opening hours and photos.

  Then **read their reviews**, especially the three-star and one-star ones. Customers tell you exactly what's missing: "slow delivery", "no parking", "rude staff", "prices not clear". Each complaint is a chance for your business to be different. This is often the most valuable free research you can do.

  ## 4. Meta Ad Library: see competitors' ads

  The [Meta Ad Library](https://www.facebook.com/ads/library) lets anyone see the active ads running on Facebook and Instagram. Search competitors' names or keywords related to your business and filter by India.

  You'll see which businesses are spending on ads, what offers they promote, which images and videos they use, and how long ads have been running. An ad that has been running for months is probably working. Don't copy it, but learn from the angle and offer.

  ## 5. Instagram and YouTube search

  Search hashtags and keywords related to your idea, plus your city name. Look at which local accounts have engaged followers, what content gets the most comments, and what questions people ask in comments.

  Comments are free customer research. If dozens of people ask "do you deliver to Jayanagar?" or "is there a weekend batch?", that's demand someone isn't meeting yet.

  Keep a simple note as you go, with three columns: what customers want, what they complain about, and what nobody seems to offer. After an hour of scrolling, patterns become clear, and those patterns are often the best positioning ideas for a new business.

  ## 6. Google Search and AI answers

  Search the questions your customers would ask, such as "best coaching centre for NEET in Shivamogga", and see what appears in results and AI answers. Note which competitors show up, whether they have proper websites, and how good their content is.

  If the top results are weak, outdated or from directories, there's a chance to win with a good website. Our guide on [Google's AI Overviews for local businesses](/blog/ai-overviews-ai-mode-local-business) explains how these answers choose sources.

  ## 7. Directories and marketplaces

  Check JustDial, IndiaMART, Practo, Zomato, Swiggy, Urban Company or Amazon, depending on your category. These show how many sellers exist, their price ranges and their review volumes. Price research alone can stop you from launching too cheap or too expensive. See [which listing sites matter in India](/blog/business-listing-sites-india).

  ## Turn research into decisions

  Online research is only useful if it changes what you do. After a few hours with these tools, you should be able to answer: is demand growing, who are the top five competitors, what do customers complain about, and what price range is normal? Use those answers to choose your niche, set your prices and write your message. Then confirm everything by talking to real customers, as explained in our [business idea validation guide](/blog/validate-business-idea-shivamogga).

