content: |
  Real estate is one of the most competitive categories for online ads in Bangalore. Large developers bid aggressively on searches like "2 BHK in Whitefield" or "villa plots Sarjapur Road", and leads routinely cost several hundred to a few thousand rupees each. For smaller builders and brokers, the only way to compete is to waste less.

  Here's the approach that works best for small and mid-sized real estate businesses.

  ## Measure the right number

  Most real estate campaigns are judged on cost per lead. That's misleading. A ₹200 lead who never answers is worse than a ₹1,500 lead who books a site visit.

  Track these instead:

  | Metric | What it tells you |
  |---|---|
  | Cost per qualified lead | Leads who confirm budget, location and timeline |
  | Cost per site visit | The best single measure of campaign quality |
  | Site visit to booking rate | Sales team and project fit |
  | Cost per booking | True acquisition cost |

  ## Build one landing page per project

  Don't send ads to a general home page. Each project needs a page with:

  - Project name, location and **RERA registration number** (required in ads and builds trust).
  - **Price range** and configurations. Hiding price brings low-intent enquiries.
  - Floor plans, amenities, real photos or renders, and a map with travel times to tech parks, schools and metro stations.
  - A short form, a **WhatsApp button** and a click-to-call button.
  - Builder credentials and past projects.

  Our guide to [landing pages that convert](/blog/landing-page-for-ads-that-converts) covers the layout.

  ## Use Google and Meta for different jobs

  **Google Search Ads** catch people actively searching: "3 BHK apartments Hebbal", "plots near Devanahalli airport". Use phrase and exact match, strong negative keywords (rent, PG, resale if you sell new) and location targeting by presence. If leads are poor, see [Google Ads not getting leads](/blog/google-ads-not-getting-leads-fix).

  **Meta Ads** (Instagram and Facebook) create demand among people who aren't searching yet, and retarget website visitors. Use video walkthroughs, location highlights and price-led creatives. Use higher-intent lead forms with qualifying questions. See [Meta ads with clicks but no leads](/blog/meta-ads-clicks-but-no-leads).

  **Portals** (99acres, MagicBricks, Housing.com) still bring volume, but leads are often shared with several sellers. Use them alongside your own channels, not instead of them.

  ## Ask qualifying questions

  Add two or three questions to every form:

  - Budget range.
  - Preferred configuration.
  - Planning to buy within: 3 months / 6 months / just exploring.

  Fewer leads, much better quality.

  ## Follow-up wins the sale

  The single biggest improvement in real estate campaigns is speed. Call within five minutes, send the brochure on WhatsApp immediately and offer two specific site-visit slots. Track every lead's status in a simple CRM or sheet. Our [lead follow-up system](/blog/lead-follow-up-system-small-business) shows a simple set-up.

  ## Don't forget organic and local

  - Optimise your [Google Business Profile](/blog/google-business-profile-shivamogga-local-seo) for your sales office and each site office.
  - Publish area guides ("Living in Thanisandra: schools, metro, prices") that rank and get cited by AI assistants.
  - Post weekly construction updates on Instagram to build trust with buyers who are watching.

