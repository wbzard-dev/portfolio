content: |
  "How much should I pay someone to handle my Instagram?" is one of the most common questions founders ask us. The honest answer depends on how much content you need and how much of it is video. Here's a breakdown of real-world ranges in Bangalore.

  ## Typical price ranges

  | Option | Monthly cost | What you usually get |
  |---|---|---|
  | Freelancer (basic) | ₹8,000–₹15,000 | 8–12 static posts, captions, scheduling |
  | Freelancer (with reels) | ₹15,000–₹25,000 | Posts plus 4–6 edited reels from your footage |
  | Small agency | ₹20,000–₹45,000 | Strategy, 12–16 posts incl. reels, stories, replies, report |
  | Established agency | ₹45,000–₹1L+ | Shoots, high-volume video, multiple platforms, influencer work |

  ## What drives the price

  - **Video.** A reel needs an idea, a script, shooting and editing. It costs several times a static post.
  - **Who shoots.** Sending your own phone footage is much cheaper than a monthly shoot. Our [phone photography guide](/blog/phone-photography-small-business) helps.
  - **Number of platforms.** Instagram plus Facebook is cheap to combine. Adding LinkedIn or YouTube adds real work.
  - **Community management.** Replying to comments and DMs daily takes time, and it's where many enquiries happen.
  - **Strategy and reporting.** Cheap plans often skip both.

  ## What a good plan should include

  1. A **content framework**: 3–5 content pillars tied to what customers ask before buying.
  2. A **monthly calendar** you approve in advance.
  3. **Captions and hashtags** written for your audience, in English, Kannada or both. See [Kannada vs English content](/blog/kannada-vs-english-social-media-content).
  4. **Profile optimisation:** bio, highlights, link and contact buttons.
  5. **DM and comment replies,** or a clear handover process to your team.
  6. **Monthly reporting on enquiries,** not just likes and reach.

  ## Social media management is not the same as ads

  Management covers organic content. **Meta ads** are a separate service with a separate budget paid to Meta. Boosting a post from the app is not the same as running a proper campaign. Our [boost vs Ads Manager guide](/blog/instagram-boost-post-vs-ads-manager) explains why.

  ## How to get value for money

  - Pay for **fewer, better posts**. Three to four strong posts a week beats daily filler.
  - Ask for content **built around customer questions**, which also helps you appear in Google and AI answers.
  - Insist on **a monthly enquiry count**. If posting isn't bringing DMs or calls after three months, change the content, not just the designer.
  - Keep **login access** yourself.

  If you're posting but getting no customers, read [why Instagram posting isn't bringing customers](/blog/instagram-posting-no-customers-fix) first.

