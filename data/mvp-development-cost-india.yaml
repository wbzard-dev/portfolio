content: |
  "How much will my MVP cost?" is like asking how much a house costs: it depends on what you're building. But founders still need a number to plan around, and the quotes they get can be wildly different for what sounds like the same product.

  ## Part 1: Get the idea right first

  The cheapest MVP is the one with the **smallest scope that still tests your riskiest assumption**. Before asking anyone for a quote:

  - Write the **one problem** the MVP solves, for **one type of user**
  - List the **one core workflow** (for example: sign up → create a booking → get confirmation → pay)
  - Mark every other feature as **"later"**
  - Decide what success looks like: signups, paying customers, repeat usage

  Founders who do this get lower quotes and better products. For validating first, see [how to launch a SaaS startup](/blog/how-to-launch-a-saas-startup-from-bangalore).

  ## Part 2: What drives the cost

  | Factor | Lower cost | Higher cost |
  |---|---|---|
  | **Platforms** | Web app (works on phones too) | Native iOS + Android + web |
  | **User roles** | One type of user | Customers, vendors, admins, staff |
  | **Screens and workflows** | A handful of core screens | Dozens of screens and edge cases |
  | **Integrations** | Payments, email | Maps, CRMs, ERPs, third-party APIs, hardware |
  | **Real-time features** | None | Chat, live tracking, collaboration |
  | **Design** | Clean UI from a design system | Fully custom brand design and animations |
  | **Compliance and security** | Standard practices | Health, finance or regulated data |
  | **Admin tools** | Basic admin panel | Detailed dashboards and reporting |

  **Web app or mobile app?** For most MVPs, a responsive **web app** is faster to build and update, and doesn't need app store approval. Go native only if your core feature needs the phone (camera, GPS in the background, offline use). More in [website or app first?](/blog/website-or-app-first-for-startups)

  ## Who builds it: the trade-offs

  | | Freelancer | Agency / studio | In-house team |
  |---|---|---|---|
  | Cost | Usually lowest | Medium | Highest (salaries, hiring time) |
  | Speed to start | Fast | Fast | Slow (hiring) |
  | Risk | Higher: single point of failure | Lower: process, backups, accountability | Depends on hires |
  | Best for | Small, well-defined builds | Founders who need product + launch in one go | After product-market fit |

  **No-code or custom?** No-code tools are great for testing a concept quickly. Custom code makes sense when you need performance, complex logic, integrations, or a codebase investors and future engineers can build on.

  ## How to compare quotes

  Ask every developer or agency:

  1. **Is the scope itemised?** Features, screens and integrations listed, not just "MVP: ₹X"
  2. **Is it fixed price or time-and-materials?** What happens if scope changes?
  3. **Who owns the code**, the cloud accounts and the domain? (It should be you)
  4. **What's included after launch?** Bug fixes, hosting setup, handover documentation
  5. **Can I see similar products you've built**, and talk to a past client?
  6. **What tech stack, and why?** Avoid obscure choices that make hiring hard later

  ## How to spend less without cutting quality

  - Cut scope, not quality. Fewer features built properly beat many built badly
  - Use proven building blocks: authentication, payments and email services instead of custom code
  - Launch on the web first
  - Design from a good component system rather than fully custom screens
  - Ship in phases: version 1 in weeks, then improve based on real users

  ## Your 30-day kickstart plan

  - **Week 1:** problem, user and core workflow written; scope frozen
  - **Week 2:** clickable prototype; test with 5–10 target users
  - **Weeks 3–4:** build sprint begins with weekly demos; landing page and waitlist live

  ## Where a launch partner fits

