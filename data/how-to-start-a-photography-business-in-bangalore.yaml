content: |
  Bangalore produces an enormous amount of photo and video work every week: weddings, corporate events, startup launches, D2C product shoots, restaurant menus, real estate listings, headshots for LinkedIn. Many photographers here are talented but irregular earners. The difference between a hobby and a business is usually a niche, clear packages and a steady source of clients.

  ## Step 1: Choose your niche

  - **Weddings and pre-weddings**: high value, seasonal, needs a team
  - **Product and e-commerce photography** for D2C brands: steady, studio-based, repeat clients
  - **Food photography** for restaurants, cloud kitchens and menus
  - **Corporate events and headshots**: weekday work, companies pay on invoice
  - **Real estate and interiors** for builders and designers
  - **Kids, maternity and family portraits**

  Pick one to lead with. You can add more later, but a portfolio that mixes everything confuses clients.

  ## Step 2: Gear (less than you think)

  Start with a solid camera body, two versatile lenses, lighting suited to your niche, backup storage and editing software. Rent specialised lenses and lights per shoot until you're sure you need them.

  ## Step 3: Build a portfolio

  If you're new to a niche, do a few shoots at low cost for real clients (a friend's café, a small D2C brand, a startup's team photos) in exchange for full usage in your portfolio. Choose your best 20–30 images. Quality beats quantity.

  ## Step 4: Register the business

  - Proprietorship or LLP, **GST registration** (many corporate and brand clients require it), **Udyam registration**
  - A **business bank account**
  - A **standard contract**: scope, deliverables, timelines, payment terms, cancellation, usage rights and copyright

  ## Step 5: Pricing

  Create packages with clear deliverables:

  - Hours of coverage or number of products
  - Number of edited images and delivery time
  - Albums, videos, reels, raw files (extra or included)
  - Travel charges outside your area

  Take an advance to confirm bookings, especially for weddings. Raise prices as your calendar fills.

  ## Step 6: Get clients

  1. **A portfolio website** with your niche, packages from price, and an enquiry form; clients outside your network find you through Google
  2. **Google Business Profile** as a photographer or photo studio, with your best work and reviews
  3. **Instagram** with Reels of behind-the-scenes and before-and-after edits
  4. **Partners**: wedding planners, decorators, event companies, marketing agencies, interior designers; they send repeat work
  5. **LinkedIn** for corporate and brand clients
  6. **Google Ads** for "product photographer in Bangalore"-type searches once your website converts

  ## Step 7: Deliver like a professional

  Meet deadlines, communicate clearly and make delivery easy (an online gallery, organised folders). Ask every happy client for a Google review and a testimonial. Repeat clients and referrals are where photography becomes a business.

