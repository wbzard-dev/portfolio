content: |
  Bangalore is full of people living away from their families: IT employees, students in PGs, young couples who both work, and elderly parents whose children have moved abroad. Many of them want simple, healthy, home-style food every day. A tiffin service from your kitchen can meet that with very little investment.

  ## Step 1: Choose your customers and cuisine

  - **Bachelors and PG residents**: affordable, filling, regular timings
  - **Working couples**: lunch and dinner, healthier options
  - **Office lunch**: delivered to tech parks and offices
  - **Elderly and patients**: low oil, low salt, diet-specific meals
  - **Regional cuisine** for people missing home food: North Indian, Bengali, Andhra, Kerala, Udupi and more

  Cooking the food of a specific region often wins loyal customers faster than a generic menu.

  ## Step 2: FSSAI and basics

  Register on the FoSCoS portal for **FSSAI registration** (small businesses) before you sell. Keep your kitchen clean and organised, store ingredients properly, and use food-grade packaging. Add **GST** only once you cross the threshold, and open a separate bank account for business payments.

  ## Step 3: Menu and planning

  Fix a **weekly rotating menu** and share it on WhatsApp every Sunday. Keep a standard meal (rice, roti, dal, sabzi, curd) with a few add-ons. A predictable menu makes buying and cooking efficient.

  ## Step 4: Pricing

  Calculate the cost per meal, including ingredients, gas, packaging, delivery and your time. Offer:

  - **Monthly subscriptions** (best for you: predictable and paid in advance)
  - **Weekly plans** for people who want to try
  - **Single meals** at a higher price

  ## Step 5: Packaging and delivery

  Use leak-proof, microwave-safe containers or steel tiffins with a deposit and return system. Deliver within a tight radius at fixed times. Many tiffin services start by delivering themselves, then hire a delivery person or use a local delivery service as they grow.

  ## Step 6: First 30 customers

  1. **Your own apartment** and nearby apartment WhatsApp groups (ask before posting)
  2. **PGs and hostels** nearby: talk to the owners
  3. **Offices and co-working spaces** within your delivery area
  4. **Google Business Profile** with service area (you can hide your home address), menu photos and hours
  5. **Instagram** with daily meal photos and kitchen videos showing hygiene
  6. **Free trial meal** for new customers

  ## Step 7: Grow carefully

  Quality and timing must stay the same as orders grow. Get feedback every week, ask happy subscribers for Google reviews, and add a referral offer. When you outgrow your home kitchen, a [cloud kitchen](/blog/how-to-start-a-cloud-kitchen-in-bangalore) is the natural next step.

