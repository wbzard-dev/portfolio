content: |
  Every founder reaches the point where doing marketing alone at midnight stops working. The question is who to bring in: an agency, a freelancer, or a full-time marketer. Each one can be the right answer, at the right stage.

  ## The quick comparison

  | | Agency / launch partner | Freelancer | In-house marketer |
  |---|---|---|---|
  | Typical cost (India) | ₹25,000–₹1.5L / month | ₹10,000–₹50,000 / month or per project | ₹5–12L / year + tools |
  | Skills covered | Website, social, SEO, ads, design | Usually one or two | Usually one or two, strong on strategy |
  | Speed to start | 1–2 weeks | Days | 1–3 months to hire and onboard |
  | Risk | Getting a junior team | Disappearing, limited capacity | Expensive mis-hire |
  | Best stage | Launch to early traction | One clear task | After you know what works |

  ## When an agency or launch partner is the right call

  Early on, you don't need one great marketer. You need five different skills for a few hours each: someone to build the website, set up tracking, design creatives, write posts and run ads. Hiring all of those people is impossible on a startup budget, and one person rarely does all five well.

  A small agency gives you that range for less than a single salary. It suits you if:

  - You're launching or have been live for less than a year.
  - You don't yet know whether Instagram, Google or LinkedIn will bring your customers.
  - You want one point of accountability rather than managing several vendors.

  This is exactly the gap a launch partner like [Wbzard Labs](/startup-launch-package) fills: website, social media, SEO and ads planned together, so you can learn quickly which channel pays.

  ## When a freelancer is the right call

  Freelancers are excellent for **well-defined, bounded work**:

  - Building a [landing page for ads](/blog/landing-page-for-ads-that-converts).
  - Fixing website speed or a technical SEO issue.
  - Designing a logo or a set of post templates.
  - Editing reels from footage you shoot.

  They're harder to rely on for ongoing growth work where several skills have to fit together. If you hire one, agree on deliverables, deadlines and access in writing. Our guide on [questions to ask a website developer](/blog/how-to-hire-a-website-developer-questions) applies to any freelancer.

  ## When to hire in-house

  A full-time marketer makes sense when:

  - You've found one or two channels that bring customers profitably.
  - You're spending enough on ads, or producing enough content, that someone needs to own it daily.
  - Marketing decisions need deep product knowledge, common in B2B SaaS.

  Even then, most in-house marketers work *with* an agency or freelancers for design, development and production. The hire becomes the owner of strategy; the agency becomes the hands.

  ## The hidden costs founders forget

  - **Tools:** design software, scheduling tools, SEO tools and ad spend are rarely included in any quote.
  - **Management time:** a freelancer needs more of your direction than an agency; an in-house hire needs onboarding.
  - **Switching costs:** if accounts aren't in your name, changing vendors means starting from zero. See [how to recover access from a developer](/blog/recover-domain-website-access-from-developer).

  ## A sensible path for most startups

  1. **Months 0–6:** a launch partner sets up the website, tracking, social media and first ad tests.
  2. **Months 6–12:** keep what works, cut what doesn't, and add freelancers for specific tasks.
  3. **After 12 months:** hire in-house to own the proven channels, with the agency supporting production.

