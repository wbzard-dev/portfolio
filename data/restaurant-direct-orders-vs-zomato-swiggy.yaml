content: |
  For many restaurants, cafés and cloud kitchens in India, Zomato and Swiggy bring most delivery orders. They also take a substantial commission on each one, plus fees for ads and promotions. On thin restaurant margins, that adds up fast.

  The answer isn't to leave the apps. It's to use them to find new customers, and then bring repeat customers to order from you directly.

  ## Aggregators for discovery, direct for loyalty

  Think of it this way:

  - **First order:** a customer discovers you on Zomato or Swiggy. Fine, pay the commission.
  - **Second order onwards:** give them a good reason to order directly from you.

  Even moving a portion of repeat orders to direct channels can improve your monthly margin noticeably.

  ## 1. Set up WhatsApp ordering

  For most restaurants, WhatsApp is the easiest direct channel:

  - Use **WhatsApp Business** with a product catalogue of your menu, prices and photos.
  - Add quick replies for menu, delivery areas and timings.
  - Accept **UPI payments** via QR or payment links.
  - Use your own delivery staff or a hyperlocal delivery partner.

  As volume grows, the WhatsApp Business API allows automated order flows. See [WhatsApp Business app vs API](/blog/whatsapp-business-app-vs-api).

  ## 2. Add a simple ordering website

  A one-page site with your menu, an order button (WhatsApp or an online ordering tool) and your delivery areas gives customers a direct link to save and share. It also helps you appear on Google for "biryani delivery Koramangala" or "best cafe in Shivamogga". See our [restaurant and café marketing guide for Shivamogga](/blog/restaurant-cafe-marketing-shivamogga).

  ## 3. Make Google your free order channel

  Your [Google Business Profile](/blog/google-business-profile-shivamogga-local-seo) can show your menu, photos, hours and an order link. Many people search on Google Maps before they open an app. Make sure:

  - The order link points to **your** WhatsApp or website, not only to aggregators.
  - Menu and prices are current.
  - You have recent photos and plenty of [reviews](/blog/how-to-get-more-google-reviews).

  ## 4. Use your packaging

  Every aggregator order is a chance to convert that customer:

  - Insert a card or sticker with a QR code: "Order direct next time on WhatsApp and get a free dessert" or a small discount.
  - Keep the offer simple and generous enough to change behaviour.
  - Check each platform's current partner terms so your packaging inserts comply.

  ## 5. Build a repeat-customer list

  With customers' permission, save direct customers' numbers and send occasional WhatsApp updates: new dishes, weekend specials, festival menus. Don't spam; one or two messages a week at most. Respect India's DPDP rules on consent. See [DPDP compliance for small businesses](/blog/dpdp-act-compliance-small-business-website).

  ## 6. Instagram that drives orders

  Reels of dishes being made, behind-the-scenes kitchen clips and customer reactions perform well. Put "Order on WhatsApp" in the bio with a direct link, and use the same message in every post. Need ideas? See [Instagram reel ideas for cafés and restaurants](/blog/instagram-reel-ideas-cafes-restaurants-bangalore).

  ## 7. Track the saving

  Every month, compare:

  - Number of direct orders and their value.
  - Aggregator commission you would have paid on those orders.
  - Cost of the discount or freebie you gave.

  This shows exactly what your direct channel is worth.

