  ## Common launch mistakes

  - **Launching before the basics are ready.** An empty Instagram and no Google profile waste your launch moment
  - **Running ads without tracking.** You'll never know what worked
  - **Hiring four separate freelancers** for website, social, SEO and ads who never talk to each other
  - **Letting someone else own your domain or ad accounts**
  - **Trying every channel at once** instead of doing two or three well

