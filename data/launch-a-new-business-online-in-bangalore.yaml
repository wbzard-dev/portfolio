content: |
  Bangalore customers decide fast. Before they visit a café, book a salon, call a clinic or buy from a new brand, they check Google, Instagram and your website, often in under a minute. If your business isn't there, or looks half-finished, they move on to the next option.

  This guide gives you a 30-day plan that works for almost any new business, plus links to detailed guides for specific industries.

  ## Part 1: Get clear before you build

  Everything online depends on three answers. Write them down:

  1. **What do you offer?** In one sentence a stranger understands
  2. **Who is it for?** A specific customer, in a specific area or niche
  3. **Why you?** The reason to choose you over the obvious alternatives

  These answers become your website headline, your Google profile description and your Instagram bio.

  If you haven't tested the idea yet, do that first. A landing page and a small ad test can tell you a lot in two weeks.

  ## Part 2: The 30-day launch plan

  **Week 1: Brand and foundations**

  - Name check: domain, Instagram handle, trademark search
  - Logo, two or three colours and fonts
  - Business email on your domain
  - Photos of your real place, product or team, booked

  **Week 2: Website and Google**

  - A fast, mobile-first website or landing page: offer, proof, prices or price ranges, location and WhatsApp and enquiry buttons. See [website costs for Bangalore startups](/blog/website-development-cost-bangalore-startups)
  - Google Business Profile with the right category, photos, services and hours. See [local SEO for Bangalore startups](/blog/local-seo-bangalore-startups)
  - Google Analytics, Search Console, Meta Pixel and conversion tracking installed and tested

  **Week 3: Social media**

  - Instagram (and LinkedIn for B2B) profiles set up
  - Content pillars and templates; 9–12 posts ready before launch
  - A 90-day content calendar. See our [social media framework](/blog/social-media-framework-for-new-business)
  - WhatsApp Business with catalogue and quick replies

  **Week 4: Launch and first customers**

  - Launch to your network with a personal message and clear offer
  - First reviews from early customers
  - A small, controlled ad test on Meta or Google. See [Meta vs Google Ads](/blog/meta-ads-vs-google-ads-for-startups)
  - Measure: enquiries, bookings, sales and where they came from

