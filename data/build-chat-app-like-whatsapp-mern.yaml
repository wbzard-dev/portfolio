content: |
  Most student projects work on request and response: click a button, get data. Chat apps are different. Messages must appear on someone else's screen the moment they're sent. Building one teaches you real-time systems, which many freshers have never touched.

  *WhatsApp is a trademark of its owner. This guide describes building your own learning project; don't use their name, logo or design in your app.*

  ## How real-time chat works

  Normal HTTP is like sending letters: the browser asks, the server answers, and the connection ends. For chat, the server needs to push new messages without being asked.

  **WebSockets** keep a connection open in both directions. **Socket.IO** is a library for Node.js and React that makes this simple, with automatic reconnection and fallbacks.

  The flow:

  1. User A logs in; the browser opens a socket connection.
  2. A sends a message → the server saves it in MongoDB → the server emits it to User B's socket.
  3. B's screen updates instantly.

  ## Features for your version

  **Must have:**

  - Sign up and login with JWT
  - Contact or user search
  - One-to-one chat with live messages
  - Chat history loaded from the database
  - Conversation list sorted by latest message

  **Nice to have:**

  - Online/offline status
  - Typing indicator
  - Read receipts (sent / delivered / seen)
  - Group chats
  - Image sharing
  - Unread message counts

  ## Data models

  ```js
  User:         { name, email, passwordHash, avatar, lastSeen }
  Conversation: { participants: [UserId], isGroup, name, lastMessage, updatedAt }
  Message:      { conversation: ConversationId, sender: UserId, text, image,
                  readBy: [UserId], createdAt }
  ```

  Index messages by `conversation` and `createdAt` so loading a chat stays fast as history grows.

  ## Server code sketch

  ```js
  io.on("connection", (socket) => {
    const userId = socket.user.id;          // set by auth middleware
    socket.join(userId);                    // a private room per user

    socket.on("message:send", async ({ conversationId, to, text }) => {
      const msg = await Message.create({ conversation: conversationId, sender: userId, text });
      io.to(to).emit("message:new", msg);   // deliver to recipient
      socket.emit("message:sent", msg);     // confirm to sender
    });

    socket.on("typing", ({ to }) => io.to(to).emit("typing", { from: userId }));
  });
  ```

  On the React side, connect once after login, listen for `message:new`, and append it to the open chat's state.

  ## Build it in stages

  1. Auth and user search with a REST API ([Express basics](/blog/nodejs-express-rest-api-beginners)).
  2. Conversations and messages saved and loaded with REST.
  3. Add Socket.IO for live delivery.
  4. Online status and typing indicators.
  5. Read receipts and unread counts.
  6. [Deploy](/blog/deploy-mern-app-free). Make sure your backend host supports WebSockets.

  ## Things interviewers will ask

  - Why WebSockets instead of polling every second?
  - How do you authenticate a socket connection?
  - What happens to messages sent while the recipient is offline?
  - How would this scale to many servers? (A shared adapter like Redis.)
  - How would you add end-to-end encryption, conceptually?

  ## Other projects to pair with this

  A chat app shows real-time skills. Pair it with a data-heavy project like a [food delivery app](/blog/build-food-delivery-app-like-swiggy-mern) or [e-commerce site](/blog/build-ecommerce-website-mern-project) for a well-rounded portfolio.

