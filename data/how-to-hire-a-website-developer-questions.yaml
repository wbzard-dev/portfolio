content: |
  Most bad website experiences don't come from bad developers. They come from unclear agreements: nobody wrote down what was included, who owns what, or what happens after launch.

  Use these questions with any freelancer or agency, including us.

  ## Scope and price

  **1. What exactly is included?** Ask for an itemised list: number of pages, features (forms, booking, payments, blog, language versions), content writing, images, and what's *not* included.

  **2. Is the price fixed or hourly?** Fixed price needs a clear scope. Hourly needs an estimate and a cap.

  **3. What are the recurring costs?** Domain, hosting, email, premium plugins or themes, maintenance. Get yearly numbers. See [domain, hosting and business email explained](/blog/domain-hosting-business-email-guide-shivamogga).

  **4. How many revision rounds, and what counts as a change?** A colour tweak isn't a new page.

  For typical ranges, see [website design cost in Shivamogga](/blog/website-design-cost-shivamogga) and [website development cost in Bangalore](/blog/website-development-cost-bangalore-startups).

  ## Ownership

  **5. Will the domain, hosting and code be in my name?** They should be. Register the domain yourself or make sure you're the owner on record.

  **6. Will I get admin access to everything?** Website admin, hosting, Google Analytics, Search Console, Google Business Profile, Meta Business account.

  **7. What happens if we stop working together?** You should be able to take the site to another developer without losing anything.

  ## Quality and results

  **8. How will people find this site on Google?** Look for one page per service, proper titles, a sitemap, Search Console setup and local SEO basics. See [SEO for a new website](/blog/seo-for-a-new-website-first-90-days).

  **9. How fast will it load on a phone?** Ask them to show a PageSpeed Insights result for a site they built. See [why websites are slow](/blog/website-speed-core-web-vitals-small-business).

  **10. How will I know if it's bringing enquiries?** Form, call and WhatsApp tracking should be part of the build. See [conversion tracking](/blog/ga4-conversion-tracking-setup).

  **11. Can I update content myself?** Text, photos, blog posts, prices, without paying for every small change.

  ## Process and proof

  **12. Can I see similar sites you've built?** Open them on your phone. Are they fast? Do the buttons work? Do they look current?

  **13. Can I speak to a past client?** A confident provider will connect you.

  **14. What's the timeline and payment schedule?** Common: advance to start, a milestone payment at design approval, balance at launch. Avoid paying 100% upfront.

  **15. What support do I get after launch?** Bug fixes for how long? Who do you call if the site goes down? What do updates cost?

  ## Red flags

  - "We'll register the domain for you" (in their name)
  - A price without any written scope
  - No examples you can open and test
  - Guaranteed "page one on Google" claims
  - Templates sold as fully custom design
  - No mention of mobile, speed, SEO or tracking

  ## Freelancer, agency or DIY?

  - **DIY builder:** fine for a very simple first site if you have time
  - **Freelancer:** often the lowest price; ask about backup if they're unavailable
  - **Agency or studio:** more process and accountability; useful if you also need SEO, social and ads

