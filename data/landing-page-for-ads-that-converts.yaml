content: |
  You pay for every ad click. If 100 people click and 2 enquire, your cost per lead is 50 clicks' worth. If the same 100 clicks bring 8 enquiries, your cost per lead drops by 75%, with the same budget.

  That gap is almost always the landing page.

  ## Homepage vs landing page

  | Homepage | Landing page |
  |---|---|
  | Talks about everything you do | Talks about one service or offer |
  | Many links and menus | One main action (call, WhatsApp or form) |
  | Written for everyone | Written for the people who clicked that ad |
  | Hard to measure | Built to be measured |

  ## The 12-point checklist

  **1. Message match.** If the ad says "Kids' swimming classes in Vijayanagar", the headline says that too. Visitors decide in seconds whether they're in the right place.

  **2. One offer, one action.** "Book a free trial class", "Get a free site visit", "Get fees and timings". Pick one.

  **3. Buttons above the fold on mobile.** Most clicks come from phones. A **Call** button and a **WhatsApp** button should be visible without scrolling, ideally as a sticky bar at the bottom.

  **4. A short form.** Name, phone, and one qualifying question. Every extra field costs enquiries.

  **5. Fast loading.** Aim for the page to show content in under 2.5 seconds on a mobile connection. Compress images, avoid heavy sliders. See [website speed for small businesses](/blog/website-speed-core-web-vitals-small-business).

  **6. Benefits, not features.** "Your kitchen ready in 30 days with a 10-year warranty" beats "We use premium materials".

  **7. Real proof.** Google review rating and a few quotes, real photos of your work and team, numbers you can back up (years in business, students trained, projects done).

  **8. Price or price range.** You don't need exact prices, but "packages from ₹X" or "typical range" filters out the wrong people and builds trust.

  **9. Answer objections.** A short FAQ: timing, location, parking, payment options, what happens after enquiring.

  **10. Location clarity.** Area name, a map, and the areas you serve. Crucial for local searches.

  **11. No distractions.** Remove the full navigation menu, blog links and social icons that lead people away.

  **12. Tracking.** Form submissions go to a thank-you page; call and WhatsApp clicks are tracked as conversions. See [conversion tracking setup](/blog/ga4-conversion-tracking-setup).

  ## A simple structure that works

  1. **Headline + subheadline** matching the ad, with the city or area
  2. **Call / WhatsApp / form** buttons
  3. **3–5 benefits** with icons or short lines
  4. **Photos or a short video**
  5. **Reviews and proof**
  6. **How it works** in 3 steps
  7. **Pricing or packages**
  8. **FAQ**
  9. **Final call to action** with the same buttons

  ## Languages and audiences

  If you target Kannada-speaking customers in Shivamogga or parts of Bangalore, a Kannada or bilingual version of the landing page often converts better. Match the language of the ad. See [Kannada and bilingual websites](/blog/kannada-bilingual-website-shivamogga).

  ## Test one thing at a time

  Once the page works, improve it with small tests: a different headline, a different offer, a shorter form, a new hero photo. Change one thing, wait for enough enquiries, then compare.

