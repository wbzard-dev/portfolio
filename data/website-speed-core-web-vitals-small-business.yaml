content: |
  Open your website on your phone, on mobile data, away from Wi-Fi. Count the seconds until you can see something useful. If it's more than three, you're losing people, and paying for it if you run ads.

  ## Why speed matters

  - **Enquiries:** people leave slow pages, especially when they came from an ad or a search with three other options.
  - **Ads:** landing page experience affects Google Ads Quality Score and cost per click.
  - **SEO:** page experience, including Core Web Vitals, is part of how Google evaluates pages.
  - **Real conditions:** many customers browse on mid-range Android phones on patchy 4G.

  ## Core Web Vitals in plain English

  | Metric | What it measures | Good |
  |---|---|---|
  | **LCP** (Largest Contentful Paint) | How fast the main content (usually the hero image or heading) appears | Under 2.5 seconds |
  | **INP** (Interaction to Next Paint) | How quickly the page responds when you tap something | Under 200 ms |
  | **CLS** (Cumulative Layout Shift) | How much things jump around while loading | Under 0.1 |

  Google measures these from real Chrome users visiting your site, where there's enough data.

  ## How to check your site (free)

  1. **PageSpeed Insights:** enter your URL. Look at the mobile result and the "Diagnose performance issues" list.
  2. **Search Console → Core Web Vitals:** shows which groups of pages are poor, need improvement or are good. See the [Search Console guide](/blog/google-search-console-setup-guide).
  3. **Your own phone on mobile data.** The simplest test is still the most honest.

  ## The fixes that matter most

  **1. Compress and resize images.** The most common problem by far. A 4 MB photo straight from a phone or camera doesn't belong on a web page. Resize to the size it's displayed at, use modern formats like WebP or AVIF, and lazy-load images below the fold.

  **2. Cut heavy sliders and background videos.** A hero slider with five large images loads all five. One strong image or a short, compressed video poster is faster and usually converts better.

  **3. Remove plugins and scripts you don't use.** Every chat widget, popup tool, animation library and tracking script adds weight. Keep what you measure and use.

  **4. Use good hosting.** Very cheap shared hosting is often the bottleneck for WordPress sites. A server close to India or a CDN makes a visible difference.

  **5. Load fonts sensibly.** Use one or two font families, with only the weights you need.

  **6. Reserve space for images and embeds.** Setting width and height stops content jumping around (better CLS).

  **7. Defer non-essential JavaScript.** Analytics, chat and social embeds can load after the main content.

  **8. Cache and use a CDN.** Services like Cloudflare serve your site from locations near your visitors.

  ## Builders, WordPress and custom sites

  - **Website builders (Wix, Squarespace and others):** convenient, but you have limited control over speed.
  - **WordPress:** can be fast with a light theme, few plugins and good hosting; often slow without them.
  - **Custom or static sites:** usually the fastest, because only what's needed is loaded.

  More: [WordPress vs Wix vs custom websites](/blog/wordpress-vs-custom-website-shivamogga).

  ## A quick self-check

  - [ ] Mobile PageSpeed score checked and the main issues noted
  - [ ] Images resized and compressed
  - [ ] Unused plugins and scripts removed
  - [ ] Hero section loads in under 2.5 seconds on mobile data
  - [ ] Call and WhatsApp buttons work immediately on tap
  - [ ] Nothing jumps around while the page loads

