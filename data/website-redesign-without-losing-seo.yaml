  - "Keep the titles, headings and content that already rank, and improve them rather than deleting them."
  - "After launch, submit the new sitemap and monitor Search Console's Pages report daily for two weeks."
  - "A short, temporary dip after a redesign is normal, but a drop lasting more than four to six weeks usually means redirects or indexing are broken."
