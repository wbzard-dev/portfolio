content: |
  In Bangalore, people decide where to eat on the weekend while scrolling on Thursday. A good reel can fill tables for weeks; a missing Instagram presence makes a great café invisible.

  You don't need an agency to start. You need a phone, good light and a plan. If you're still setting up, see [how to start a café in Bangalore](/blog/how-to-start-a-cafe-in-bangalore).

  ## Before you film: 5 rules

  1. **Hook in two seconds.** Start with the sizzle, the pour, the cheese pull, or a bold line of text.
  2. **Vertical, natural light, steady phone.** Shoot near a window; a small tripod helps.
  3. **Short.** Most reels work best at 7–20 seconds.
  4. **Always say where.** Location tag, area name in the caption ("Indiranagar", "JP Nagar"), and on-screen text.
  5. **One call to action.** "Save this for Sunday", "Order on Swiggy/Zomato", "Book a table, link in bio".

  ## Behind the scenes (1–8)

  1. Opening the café at 7 am: shutters up, first coffee
  2. Making your signature dish from start to finish, sped up
  3. The chef plating one dish in real time
  4. Fresh ingredients arriving from the market
  5. Making the in-house sauce, dough or batter
  6. Cleaning and prep before service (shows hygiene)
  7. The rush: tickets printing, kitchen in motion
  8. Closing time: last order, lights off

  ## Menu and food (9–16)

  9. "Everything under ₹300 on our menu"
  10. The dish 80% of customers order first
  11. New item launch: first taste reaction from the team
  12. Pour shots: filter coffee, cold brew, milkshakes
  13. Size comparison: "This is our full-size burger"
  14. Seasonal special (monsoon chai, mango season, winter soups)
  15. "What ₹500 gets you for two"
  16. Build-your-own combo walkthrough

  ## People (17–22)

  17. Meet the chef or barista: one fun fact each
  18. Staff picks: "What our team eats on break"
  19. Customer first-bite reactions (always ask permission)
  20. Regulars: "Ramesh has come here every morning for 2 years"
  21. The founder story in 20 seconds
  22. Team trying each other's creations

  ## Space and experience (23–26)

  23. A slow walkthrough of the space at golden hour
  24. Work-friendly corner: plugs, Wi-Fi, quiet seats
  25. Pet-friendly, kid-friendly or rooftop features
  26. Weekend live music, board games or events

  ## Offers and local trends (27–30)

  27. Weekday lunch combo or happy-hour reveal
  28. Festival specials: Ugadi, Ganesha Chaturthi, Dasara, Christmas
  29. RCB match-day offers or screenings (if you show matches)
  30. Collaboration with a nearby business: bakery, bookstore, florist

  ## A weekly routine that's realistic

  - **Monday:** plan 4 reels from this list and note the shots needed
  - **Tuesday (quiet hours):** film everything in one hour
  - **Wednesday:** edit in CapCut, Instagram Edits or the Instagram editor; write captions and add trending audio
  - **Post:** 3–4 reels across the week, ideally before lunch and dinner decision times
  - **Daily:** reply to comments and DMs; share customer stories

  ## Turn views into visits

  - Keep your **Google Business Profile** updated with the same photos and offers
  - Put **Swiggy, Zomato, reservation and WhatsApp links** in your bio
  - Use **UTM links** to see which reels bring website visits ([how to track](/blog/ga4-conversion-tracking-setup))
  - Boost your best-performing reel to people within a few kilometres

  Measure **saves, shares, profile visits and direction clicks**. Views alone don't pay rent.

