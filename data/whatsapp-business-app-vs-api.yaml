content: |
  In India, WhatsApp is the real contact form. Customers message to ask prices, timings, availability and directions. The question isn't whether to use WhatsApp for business, but which version.

  ## The two options

  **WhatsApp Business app:** a free app for Android and iPhone. You run it on your phone (and can link a few other devices).

  **WhatsApp Business Platform (API):** a programmable version used through a provider or directly through Meta's Cloud API. No app on a phone; you use a dashboard, a CRM or your own software.

  ## Side by side

  | | Business app | Business Platform (API) |
  |---|---|---|
  | Cost | Free | Meta charges for business-initiated template messages; providers usually charge a monthly or per-message fee |
  | Setup | Minutes | Days; needs a verified Meta Business account |
  | Who replies | You, plus a few linked devices | Many agents in a shared inbox |
  | Automation | Greeting, away messages, quick replies | Chatbots, flows, automatic replies, triggers from your systems |
  | Broadcasts | Broadcast lists (only reach people who saved your number) | Template messages to opted-in customers at scale |
  | Integrations | Basic (catalogue, links, ads) | CRM, booking, payments, order updates, lead forms |
  | Green tick / verification | Meta Verified options for some businesses | Official business account options |
  | Best for | Shops, clinics, salons, cafés, solo founders | Busy clinics, coaching institutes, D2C brands, real estate, multi-location businesses |

  Pricing and features change. Check Meta's current WhatsApp Business pricing page and your provider's plans before deciding.

  ## Get the most out of the free app

  - **Business profile:** address, hours, website, description, category
  - **Catalogue:** products or services with photos and prices
  - **Quick replies:** `/price`, `/location`, `/timings`, `/review` (link to your [Google review page](/blog/how-to-get-more-google-reviews))
  - **Labels:** New lead, Follow up, Paid, Regular
  - **Greeting and away messages:** so nobody waits in silence
  - **Click-to-WhatsApp ads** from Facebook and Instagram

  For local selling ideas, see [Instagram and WhatsApp marketing for Shivamogga shops](/blog/instagram-whatsapp-marketing-shivamogga).

  ## Signs you've outgrown the app

  - Several staff need to reply from one number
  - Leads are being missed or answered hours late
  - You send the same answers dozens of times a day
  - You need automatic messages: booking confirmations, payment links, delivery updates, reminders
  - You want WhatsApp chats inside your CRM with the lead's source
  - You need to message hundreds of opted-in customers reliably

  ## Choosing an API provider

  Ask:

  1. **What are the total costs?** Meta's message charges plus the provider's fee
  2. **Shared inbox and roles?** Can you assign chats and see response times?
  3. **No-code chatbot or flows?** Can your team edit them?
  4. **Integrations?** Your CRM, Google Sheets, website forms, payment gateway
  5. **Can you keep your number** and leave later without losing it?

  ## Rules that apply to both

  - **Get opt-in** before sending marketing messages
  - **Don't spam.** Too many blocks and reports can restrict or ban your number
  - **Respect quiet hours** and give an easy way to stop messages
  - **Reply fast.** Speed is the biggest reason WhatsApp leads convert

