content: |
  We regularly speak with business owners who've already been burned once. The story is often the same: a slick pitch, a monthly invoice, lots of posts, and no new customers. When they try to leave, they discover the agency controls their website or ad account.

  Most of this is avoidable. Here are 12 red flags to watch for before you sign.

  ## Red flags in the pitch

  **1. Guaranteed rankings.** No one can guarantee a number one Google ranking. Google says so itself. Ranking depends on competition, your site and factors no agency controls.

  **2. Guaranteed followers.** "10,000 followers in 30 days" usually means bought or fake followers who will never buy from you, and can hurt your account's reach.

  **3. No questions about your business.** If they propose a plan without asking about your customers, pricing, margins and how you close sales, the plan is a template.

  **4. The same package for everyone.** A clinic, a SaaS startup and a clothing brand shouldn't get the same 12-posts-a-month plan.

  **5. Big promises, no examples.** Ask for real businesses they've helped at your size and stage, with numbers. If they can't share any, be careful.

  ## Red flags in the contract

  **6. Accounts in their name.** Your domain, hosting, website, Google Business Profile, Meta Business Manager and Google Ads account should be owned by your business, with the agency added as a partner or user. If not, read [how to recover access from a developer](/blog/recover-domain-website-access-from-developer).

  **7. Long lock-ins before results.** Twelve months upfront is a red flag. A 2–3 month initial period, then month-to-month, is fair to both sides.

  **8. Vague scope.** "Digital marketing services" with no list of deliverables means you can't hold anyone accountable.

  **9. Ad spend mixed into fees.** You should see exactly how much went to Meta or Google, ideally paid directly from your own card.

  ## Red flags once work begins

  **10. Vanity reports.** Monthly reports full of impressions, reach and likes, but no enquiries, cost per lead or sales. If tracking isn't set up, they can't measure what matters. See [GA4 conversion tracking](/blog/ga4-conversion-tracking-setup).

  **11. Slow or no communication.** If it takes a week to change one line on your website, it'll take months to fix a campaign that's losing money.

  **12. Blame without change.** When results are poor, a good agency proposes specific changes. A bad one blames the algorithm, the season or your product, and keeps the same plan.

  ## What a good agency does instead

  - Starts with a goal and tracking.
  - Recommends the smallest plan that can prove results.
  - Puts every account in your name.
  - Reports enquiries and cost per enquiry in plain language.
  - Tells you what *not* to do.

  Our guide to [choosing the best agency for a Bangalore startup](/blog/best-digital-marketing-agency-bangalore-startups) has ten questions to ask on your first call.

