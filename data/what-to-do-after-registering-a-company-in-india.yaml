content: |
  You've got the certificate of incorporation, or your GST and Udyam registrations are through. It feels like the big step is done. In reality, the next 30 days decide whether the business gets going or sits as a registered name with no customers.

  Here's a practical checklist, split into the paperwork and the part that brings customers.

  *General guidance only. Your CA or company secretary will tell you the exact compliance for your entity type.*

  ## Part 1: Make the company operational

  **1. Open a current account** in the company's name. Keep personal and business money separate from day one.

  **2. Set up accounting.** Choose an accounting tool, save every invoice and bill, and agree a monthly routine with your CA.

  **3. Calendar every compliance deadline.** GST returns, TDS, annual filings and statutory meetings. Missing deadlines leads to penalties that are entirely avoidable.

  **4. Complete post-incorporation formalities.** For companies this can include items such as the commencement of business declaration and appointing an auditor, within set timelines. Ask your CA for the list.

  **5. Sign founder and employee agreements.** Founder roles, equity vesting, IP assignment to the company and NDAs. Much easier now than after a disagreement.

  **6. Apply for the registrations you need.** GST if you haven't, Udyam (MSME), shop and establishment registration, professional tax, and **DPIIT startup recognition** if you're building something innovative.

  ## Part 2: Secure the brand

  **7. Buy your domain** (and close variants) in the company's name, with auto-renew on.

  **8. Claim social handles** on Instagram, LinkedIn, Facebook, YouTube and X, even if you won't use all of them yet.

  **9. File a trademark** for your brand name in the right classes. Do a search first.

  **10. Set up business email** on your domain (for example `founder@yourcompany.in`). It looks credible to customers, investors and banks.

  ## Part 3: Get found and start selling

  **11. Launch a website or landing page.** It doesn't need to be big: what you do, who it's for, proof, and a clear way to contact or buy. See [what a website costs for Bangalore startups](/blog/website-development-cost-bangalore-startups).

  **12. Create your Google Business Profile** if you serve customers locally, even as a service-area business. See [local SEO for Bangalore startups](/blog/local-seo-bangalore-startups).

  **13. Install tracking.** Google Analytics, Search Console, Meta Pixel and conversion tracking, before any marketing spend.

  **14. Set up a social media system**, not random posts. Our [social media framework](/blog/social-media-framework-for-new-business) gives you a 90-day plan.

  **15. Start selling.** Talk to customers, run a pilot, make your first sale. Everything above exists to make this easier.

  For a deeper version covering Karnataka specifically, read the [startup launch checklist for Karnataka](/blog/startup-launch-checklist-karnataka).

  ## A realistic 30-day timeline

  - **Days 1–7:** bank account, accounting, compliance calendar, agreements
  - **Days 8–14:** domain, handles, trademark search and filing, business email
  - **Days 15–25:** website, Google profile, social profiles, tracking
  - **Days 26–30:** launch, outreach, first campaigns

  ## Where a launch partner fits

  Your CA handles Part 1. Part 3 (getting found and starting to sell) is where most new companies stall, because it spans design, development, SEO, social media and ads, usually spread across several freelancers.

