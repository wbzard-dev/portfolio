content: |
  Most new businesses in India go online in the same week they open. The shutters go up, the board is painted, and then someone creates an Instagram page. The result is a quiet first month, because nobody knew you were coming and Google had never heard of you.

  It doesn't have to work that way. If you start your digital setup about 30 days before opening, you can open with a waiting list, a verified Google listing and a few hundred local people who already know your name. This plan works for a café in Indiranagar, a clinic in Shivamogga or a service business run from home. Each week has a few clear jobs, and none of them needs a big budget.

  ## Week 1: Secure your name everywhere

  Before you design anything, make sure you own your name online. Search your business name on Google, Instagram and the domain registrar. If someone else is already using it in your city and category, it is cheaper to change the name now than after you print boards and bills.

  Then lock down the basics in a single afternoon:

  - **Domain name**: a .in or .com domain in your name or your company's name, never in a developer's name.
  - **Instagram and Facebook page**: the same handle on both if possible.
  - **WhatsApp Business** on a dedicated number, not your personal one.
  - **Business email** on your domain, such as hello@yourbrand.in.

  Keep every login in one shared document that you control. Our guide on [domains, hosting and business email](/blog/domain-hosting-business-email-guide-shivamogga) explains each step.

  ## Week 2: Get on Google before you open

  Your **Google Business Profile** is the single most important listing for a local business. Create it now, even if you haven't opened. You can add an opening date so Google shows "Opening soon" to people who find you.

  Verification is the slow part. Google may ask for a video of your premises, signboard and tools, and approval can take anywhere from a day to a few weeks. Starting early means you are visible on Google Maps on opening day rather than a month later.

  Add your category, service area, phone number, hours and at least ten real photos of the space, even if it is still being set up. The [Google Business Profile checklist](/blog/google-business-profile-shivamogga-local-seo) covers the settings that matter most.

  ## Week 3: Build a simple website and a waitlist

  You don't need a ten-page website before launch. A **single page** that says what you do, where you are, your prices or packages, and how to contact you is enough. Add call and WhatsApp buttons that are visible on phones.

  The most useful pre-launch feature is a **waitlist or early-bird form**. Offer something small for signing up: 10% off the first visit, a free consultation, or early access. Collect names and phone numbers, then save them as a WhatsApp broadcast list. These people become your first customers and your first reviews.

  If you're not sure how big the site should be, read [one-page vs multi-page websites](/blog/one-page-vs-multi-page-website-small-business).

  ## Week 3 and 4: Start posting behind the scenes

  People love watching something get built. Start posting two or three times a week before you open:

  - The empty space and the first coat of paint.
  - Unboxing equipment or stock.
  - The founder explaining why they started this business.
  - A sneak peek of the menu, services or product range.
  - A countdown to opening day.

  These posts don't need to be polished. Phone videos with clear audio work better than designed graphics. Every post should end with one action, such as "Join the waitlist on our website" or "Message us on WhatsApp for opening offers". Our list of [content ideas for new businesses](/blog/content-ideas-new-business-no-customers) has more.

  ## Week 4: Plan a small local launch campaign

  In the final week, put a small budget behind your launch. For most local businesses, **Meta ads** (Instagram and Facebook) aimed at people within three to five kilometres work well for awareness. Google Search ads help if people already search for what you sell, such as "physiotherapy clinic near me".

  Keep it simple: one video, one offer, one clear call to action, and a budget of a few hundred rupees a day for seven to ten days. Use Ads Manager rather than the boost button so you can control the location and track results. See [boosting vs Ads Manager](/blog/instagram-boost-post-vs-ads-manager) for why.

  Also message your waitlist two days before opening and again on the morning of launch.

  ## Opening week: Ask for reviews from day one

  Your first customers are your most loyal fans. Ask every happy customer for a Google review in the first week, and make it easy with a short link or QR code at the counter. Ten genuine reviews in the first month put you ahead of most new competitors on Google Maps.

  Reply to every review and message within a few hours. Early speed sets the tone for how people talk about you. Our guide on [getting more Google reviews](/blog/how-to-get-more-google-reviews) has scripts you can copy.

  ## Common pre-launch mistakes to avoid

  - **Letting a developer or agency register your domain** in their own name.
  - **Waiting for the "perfect" logo** before creating any accounts.
  - **Posting only designed graphics** with no people or real photos.
  - **Spending the whole budget on launch day** and having nothing left for week two.
  - **Not tracking where customers came from**, so you can't tell what worked.

  ## Open with customers, not silence

  A good launch isn't about one big day. It's about making sure that by the time you open, Google knows where you are, a few hundred local people have seen what you're building, and a list of interested customers is waiting for your message. Thirty days is enough to do all of this without a big budget.

