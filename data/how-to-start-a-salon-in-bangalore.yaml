content: |
  Salons are one of the most resilient local businesses: people need haircuts in every economy, and a client who trusts their stylist rarely switches. In Bangalore, with its large working population and wedding market, there's room for well-run salons in almost every neighbourhood. The question is how to stand out from the three already on your street.

  ## Part 1: Shape the idea

  **Pick a position.** Each needs a different location, price and fit-out:

  - **Premium unisex salon** in areas like Indiranagar, Koramangala or Whitefield
  - **Bridal and makeup studio**, which is appointment-heavy, high-ticket and portfolio-driven
  - **Men's grooming lounge**: beards, quick cuts, office crowd
  - **Neighbourhood family salon**: value pricing, loyal locals
  - **Specialist**: nails, hair colour, skin treatments, curly hair

  **Study competitors' reviews.** Read Google reviews of salons nearby. Complaints about waiting time, hygiene, inconsistent stylists or pushy upselling show you what to do differently.

  **Know your numbers.** Revenue depends on chairs, stylists, average bill and how many hours the chairs are busy. Work out how many clients a day you need to cover rent, salaries and products.

  ## Part 2: Execution

  **Location.** Visibility, parking, ground-floor access and a residential or office catchment within a few kilometres. Salons rely on repeat local clients.

  **Licences.** Typically a trade licence from the local city corporation, shop and establishment registration, GST where applicable, and fire and signage compliance depending on the premises. Confirm the list for your location.

  **Fit-out.** Good lighting, comfortable chairs, hygienic washing stations, storage and a pleasant waiting area. Clients judge hygiene in the first ten seconds.

  **Hiring.** Stylists are your product. Hire for skill and consistency, test with trial services, and think about retention early: commissions, training and a career path. When a stylist leaves, clients often follow.

  **Booking system.** Use salon software or a simple online booking tool with WhatsApp reminders. It reduces no-shows and lets clients book at 11 pm.

  ## Part 3: Filling the appointment book

  - **Google Business Profile** with services, prices, photos of the space and booking link
  - **Instagram**: transformations, Reels of the process, stylist profiles, trending styles. Get client permission for photos
  - **Opening offer** for the first month, then a **membership or package** to bring clients back
  - **Reviews** asked for at checkout, with a QR code at the counter
  - **Partnerships** with gyms, boutiques, wedding planners and photographers
  - **Local Meta ads** within a few kilometres for opening and festival or wedding seasons
  - **A simple website** with services, price ranges, team, booking and bridal enquiries

  More on content in our [social media framework for new businesses](/blog/social-media-framework-for-new-business).

  ## Your 30-day kickstart plan

  - **Week 1:** brand, price list, booking system and licences underway
  - **Week 2:** website, Google profile, Instagram and WhatsApp Business ready; hiring finalised
  - **Week 3:** soft launch with friends; capture before-and-after content and first reviews
  - **Week 4:** grand opening offer, local ads, membership launched

  ## Where a launch partner fits

  Salon owners are usually busy with fit-out, hiring and suppliers right up to opening day. The online presence that brings the first wave of clients, from Google profile to Instagram to booking to local ads, needs to be ready *before* the doors open, not after.

