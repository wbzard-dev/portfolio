content: |
  New cafés and restaurants keep opening across Shivamogga, from Gandhi Bazaar to Vinoba Nagar to the roads leading out to Sagar. The ones that last aren't always the ones with the best food. They're the ones people can **find**, **trust** and **remember**.

  Here's a practical marketing plan for restaurants, cafés, bakeries, sweet shops and cloud kitchens.

  ## 1. Win Google Maps first

  When someone searches "café near me", "biryani in Shivamogga" or "best bakery Shimoga", Google shows the map pack before anything else. To appear there:

  - **Pick the most specific category** ("South Indian restaurant", "Café", "Bakery") and add secondary ones
  - Add your **menu** (as a link and photos), **price range**, hours and holiday hours
  - Upload **real photos**: the food, the space, the entrance (so people recognise it from the road)
  - Turn on **attributes** like dine-in, takeaway, delivery, outdoor seating, family-friendly
  - **Reply to every review**, good or bad, within a day or two

  Our [Google Business Profile checklist for Shivamogga](/blog/google-business-profile-shivamogga-local-seo) covers every setting.

  ## 2. Get reviews in a way that doesn't feel awkward

  Reviews are the single biggest factor in whether someone tries a new place. Make it easy:

  - Put a **QR code** to your review link on tables and the bill
  - Ask in person when a customer says they enjoyed the meal
  - Send the link over WhatsApp after a delivery order

  Never buy reviews or offer discounts in exchange for 5 stars. It breaks Google's rules and can get reviews removed.

  ## 3. Instagram: show the food being made

  For food, **Reels beat posters**. What works locally:

  - Dosa on the tawa, biryani being opened, coffee being poured
  - "New on the menu" and weekend specials
  - Behind the scenes: the chef, early-morning prep, the team
  - Customers enjoying themselves (with their permission)
  - Collaborations with Shivamogga food pages and creators

  Post 3–4 times a week. Consistency matters more than production quality. For a full system, see our [social media framework for new businesses](/blog/social-media-framework-for-new-business).

  ## 4. Use delivery apps for discovery, not dependence

  Zomato and Swiggy bring orders, but their commissions eat into margins. Use them to get discovered, then:

  - Put a card in every delivery bag with your **WhatsApp number** for direct orders
  - Offer a small benefit for ordering direct, like free delivery nearby or a dessert
  - Make sure your app menu, photos and ratings are as good as your Google profile

  ## 5. Build a WhatsApp list of regulars

  A WhatsApp Business broadcast list is your own marketing channel. Ask customers to save your number and send:

  - Daily or weekly specials
  - Festival menus (Dasara, Deepavali, Ugadi and Christmas orders)
  - Slow-day offers, for example Tuesday evenings

  Keep it to 1–2 messages a week so people don't mute you. More ideas in our [Instagram and WhatsApp marketing guide](/blog/instagram-whatsapp-marketing-shivamogga).

  ## 6. A simple website still matters

  You don't need online ordering on day one. A fast website with your **menu, photos, location, hours and a WhatsApp order button** helps you:

  - Rank for searches like "family restaurant in Shivamogga" or "party hall Shimoga"
  - Take catering and bulk order enquiries, which are often your most profitable orders
  - Look established to event planners and corporate clients

  ## 7. Local ads for launches and events

  A small Meta ads budget targeting people within a few kilometres works well for openings, new menus and events. Google Ads works for high-intent searches like "catering services Shivamogga". Our [Google Ads guide for Shivamogga](/blog/google-ads-shivamogga-guide) explains how to start small.

  ## What to measure

  - Google profile: calls, direction requests and website clicks (in the profile's performance tab)
  - WhatsApp: orders and enquiries per week
  - Instagram: profile visits and DMs, not just likes
  - Delivery apps: share of orders that are repeat customers

