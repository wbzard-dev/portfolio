content: |
  "When can it go live?" is usually the second question founders ask, right after the price. The answer depends far more on the type of site and how fast content arrives than on how quickly the developer types.

  ## Typical timelines

  | Type of website | Typical timeline |
  |---|---|
  | Landing page for ads or a launch | 1–2 weeks |
  | Small business website (5–10 pages) | 3–6 weeks |
  | Business website with blog, booking and bilingual content | 5–8 weeks |
  | E-commerce store (up to ~100 products) | 6–12 weeks |
  | Custom web app or MVP | 8–16 weeks for version one |

  These assume the client gives feedback within a few days at each step.

  ## What happens in each phase

  **1. Discovery and planning (2–5 days).** Goals, pages, features and content plan. A [website brief](/blog/website-project-brief-template) speeds this up a lot.

  **2. Design (1–2 weeks).** Home page first, then inner pages. One or two rounds of changes.

  **3. Content (in parallel).** Text, photos, product details, testimonials.

  **4. Development (1–4 weeks).** Building pages, forms, integrations, mobile layouts.

  **5. SEO and tracking set-up (2–3 days).** Titles, descriptions, sitemap, Search Console, GA4, Meta Pixel.

  **6. Testing and launch (2–4 days).** Phones, browsers, forms, speed, then go live.

  ## What causes delays

  - **Content arrives late.** By far the most common cause. Decide early who writes the text and when photos will be ready.
  - **Too many decision-makers.** Feedback from five family members or co-founders in different directions.
  - **Scope creep.** "Can we also add a login area?" in week four.
  - **Domain or hosting access.** Waiting for someone to find old login details. See [recovering access from a previous developer](/blog/recover-domain-website-access-from-developer).
  - **Payment gateways and approvals.** Razorpay, PhonePe or bank verification can take a few days to a couple of weeks.

  ## How to launch faster

  1. **Start with a smaller first version.** Launch with your most important pages, then add more. Google starts indexing sooner, too.
  2. **Use a landing page while the full site is built.** It can collect enquiries and run ads within a week or two. See [pre-launch digital presence](/blog/pre-launch-digital-presence-new-business).
  3. **Prepare content upfront.** Write service descriptions and gather photos before design begins.
  4. **Choose one decision-maker** for feedback.
  5. **Fix the scope in writing** and keep a "phase two" list for new ideas.

  ## Is a one-week website realistic?

  For a focused landing page or a simple 3–5 page site with ready content, yes. For anything with e-commerce, bookings or custom features, a one-week promise usually means a template with your logo on it. That can be fine for testing an idea, but check it's fast, mobile-friendly and set up for SEO and tracking.

