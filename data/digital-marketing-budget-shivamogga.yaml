content: |
  "How much should I spend on marketing?" gets answers ranging from "nothing, just post on Instagram" to "at least a lakh a month". Neither is useful. The right budget depends on **what a customer is worth to you** and **how fast you want to grow**.

  Here's a practical way to work it out.

  ## The three buckets of marketing spend

  **1. One-time setup.** The foundation everything else depends on:

  - A fast website or landing page ([what it costs in Shivamogga](/blog/website-design-cost-shivamogga))
  - Google Business Profile, WhatsApp Business and social profiles set up properly
  - Conversion tracking: Google Analytics, Search Console, Meta Pixel and Google Ads conversions
  - Brand basics: logo, colours and photos of your real business

  **2. Ad spend.** Money paid directly to Google and Meta. This goes to the platforms, not to your agency.

  **3. Management and content.** Someone's time to create posts and Reels, run and optimise ads, reply to messages and report results, whether that's you, a staff member or an agency.

  When comparing agency quotes, always ask: **how much of this is ad spend and how much is the fee?**

  ## Start with what's free

  Before spending on ads, do the basics that only cost time:

  - Complete and active [Google Business Profile](/blog/google-business-profile-shivamogga-local-seo)
  - Ask every happy customer for a review
  - Post 3–4 times a week on Instagram
  - Build a WhatsApp broadcast list of customers

  Many Shivamogga businesses get a steady flow of enquiries from these alone.

  ## Work backwards from customer value

  Ask: **what is one new customer worth to me over a year?**

  | Business | Rough value of a customer | What you can afford per customer |
  |---|---|---|
  | Café | A few hundred rupees per visit, but regulars visit often | Low per customer; focus on repeat visits |
  | Coaching centre | A full course fee | A meaningful share of one fee |
  | Clinic or dentist | Consultations plus treatments | Moderate |
  | Real estate | Very high | High, but leads must turn into site visits |
  | Homestay | One booking, plus repeat guests and referrals | A share of one booking |

  If a coaching student pays ₹20,000 for a course and one in five enquiries joins, you can afford to pay quite a lot per enquiry and still profit. A café selling ₹150 coffees can't, so it should rely more on Google Maps, Instagram and word of mouth.

  ## A sensible way to start ads

  1. **Set up tracking first.** Without it, you're guessing.
  2. **Start small** with a daily budget you're comfortable losing while you learn.
  3. **Run for 2–4 weeks** without constant changes. Ads platforms need data.
  4. **Measure cost per enquiry**, and if possible cost per customer.
  5. **Increase budget only on what works**, and pause what doesn't.

  Shivamogga's advantage is **lower competition** than Bangalore, so the same budget usually goes further. Our [Google Ads guide](/blog/google-ads-shivamogga-guide) and [Meta vs Google comparison](/blog/meta-ads-vs-google-ads-for-startups) explain which to start with.

  ## Seasonal planning

  Plan bigger budgets around the moments your customers buy:

  - **Festivals:** Ugadi, Dasara, Deepavali, Christmas and the wedding season for retail, food and gifts
  - **Admissions season** for coaching centres and schools
  - **Monsoon and weekends** for Malnad homestays and tourism
  - **Launches and new branches** for any business

  ## Red flags in marketing quotes

  - No clear split between **ad spend and fees**
  - Promises of a fixed number of leads or "guaranteed first page on Google"
  - Reports showing only likes and reach, not enquiries
  - Ad accounts set up in the **agency's name** instead of yours

