content: |
  A salon is one of the most dependable small businesses in Shivamogga. People need haircuts every month, and weddings, festivals and functions keep the beauty side busy all year. The salons that do well are the ones people trust with their hair, skin and wedding day, and that trust is built step by step.

  ## Step 1: Choose your format

  - **Ladies' beauty parlour**: threading, waxing, facials, hair, mehendi, bridal
  - **Men's salon**: haircuts, beard, grooming, hair colour
  - **Unisex salon**: wider customer base, more space and staff needed
  - **Bridal and makeup studio**: high-value bookings, heavily seasonal
  - **Home-based or home-visit service**: low cost to start, ideal for testing demand

  If you're starting with limited money, a home-based or small parlour lets you build a client list before you invest in a shop.

  ## Step 2: Location

  Residential areas and busy shopping roads work best. Women customers especially prefer a safe, well-lit, easy-to-reach location with privacy. Two-wheeler parking matters more than a fancy façade.

  ## Step 3: Registrations

  - **Trade licence** from Shivamogga City Corporation (or your town's municipal body)
  - **Shop and establishment registration**
  - **GST** once you cross the threshold
  - **Udyam registration** to access MSME schemes and loans

  See [how to start a business in Shivamogga](/blog/how-to-start-a-business-in-shivamogga) for the full process.

  ## Step 4: Setup and hygiene

  Customers notice hygiene immediately. Budget for:

  - Chairs, mirrors, wash stations, good lighting
  - Steriliser, disposable sheets, clean towels for every customer
  - Branded, genuine products (customers ask, especially for colour and skin)
  - A separate, private room for facials, waxing and bridal

  ## Step 5: Staff

  A skilled stylist or beautician is your most important hire. Pay fairly, give a share of product sales and offer training; good staff who leave often take customers with them.

  ## Step 6: Pricing and packages

  Build a printed menu with clear prices. Add packages that increase repeat visits, such as a monthly grooming plan, a pre-bridal package, or a festival offer. Keep prices consistent; regulars talk to each other.

  ## Step 7: Get bookings

  1. **Google Business Profile** with services, prices, photos of the space and team, and booking via WhatsApp. "Salon near me" and "beauty parlour near me" are searched daily in Shivamogga
  2. **Instagram Reels** of real haircuts, colours, bridal looks and before-and-after (with the customer's permission)
  3. **WhatsApp Business** with a catalogue, appointment booking and reminders
  4. **Bridal portfolio** on Instagram and your website; bridal customers book months ahead
  5. **Local Meta ads** before festivals and wedding season, targeting women within a few kilometres
  6. **Referral offers**: a discount for each friend a regular brings

  ## Step 8: Keep them coming back

  Send a WhatsApp reminder when a customer is due (four weeks for a haircut, for example). Ask happy customers for a Google review on the spot. Track your regulars and notice when they stop coming.

