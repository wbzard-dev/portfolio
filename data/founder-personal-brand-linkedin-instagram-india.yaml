content: |
  When your business is brand new, nobody knows its name. They can, however, get to know you. That's why so many successful Indian founders built an audience on LinkedIn or Instagram before their company became well known. People trust a person with a face, a story and opinions far more than a logo with three posts.

  You don't need to become an influencer to make this work. A founder's personal brand is simply a consistent, honest record of what you're building, what you know and who you help. This guide shows first-time founders how to choose the right platform, what to post, how much time it really takes, and how to turn attention into enquiries for the business without sounding salesy.

  ## Why a personal profile beats a new company page

  Social platforms generally show content from people more than content from brand pages. A new company page with a few followers reaches very few people, while a founder sharing a real story can reach thousands through comments and shares.

  There's also a trust benefit. Customers, early employees and investors want to know who's behind the business. Seeing you explain your work, answer questions and admit mistakes makes them far more comfortable reaching out. Your company page still matters, but your personal profile does the heavy lifting in the first year.

  ## LinkedIn or Instagram: pick one to start

  Trying to grow on every platform at once is the fastest way to burn out. Choose one main platform based on who your customers are:

  - **LinkedIn** for B2B services, SaaS, consulting, recruitment, and if you'll be raising money or hiring. It's especially strong in Bangalore's startup and tech community.
  - **Instagram** for consumer and local businesses: food, fashion, fitness, beauty, education, interiors and anything visual.

  Once you're consistent on one for three months, repurpose the same ideas for the other. A LinkedIn post can become an Instagram carousel or a short reel.

  ## Set up your profile to convert

  Your profile is your landing page. Before posting, fix the basics:

  - A clear, friendly **photo of your face**.
  - A headline that says **who you help and how**, such as "Helping Bangalore clinics get more patients online", not just "Founder at XYZ".
  - A short bio with your story and one **link** to your website or booking page.
  - A featured section or pinned posts showing your best work and an offer.

  ## What to post: five content types that work

  You don't need a viral idea every day. Rotate these five types:

  1. **Building in public**: share milestones, numbers you're comfortable with, and decisions you're making.
  2. **Lessons learned**: a mistake you made and what you'd do differently.
  3. **Customer problems**: questions customers ask you and your honest answers.
  4. **Behind the scenes**: your workspace, team, process and early days.
  5. **Opinions**: a clear view on your industry, even a slightly unpopular one.

  Write the way you speak. Short lines, simple words and one idea per post work better than corporate language. For local businesses, Kannada or bilingual posts can perform well; see [Kannada vs English content](/blog/kannada-vs-english-social-media-content).

  ## The 30-minute daily routine

  A personal brand is built by consistency, not intensity. A realistic routine for a busy founder:

  - **10 minutes**: reply to every comment and message from the previous day.
  - **10 minutes**: leave thoughtful comments on five to ten posts by people in your industry or city.
  - **10 minutes**: write or record ideas for your next post.

  Publish two or three times a week. Keep a running note on your phone of questions customers ask, because those become your best posts. Our [social media framework for new businesses](/blog/social-media-framework-for-new-business) explains how to plan a month in one sitting.

  ## Turn attention into enquiries

  Followers alone don't pay bills. Every few posts, give people a simple next step: a free audit, a sample, a discovery call or a waitlist. Mention it naturally at the end of useful posts rather than in every caption.

  Reply to every direct message quickly, and move serious conversations to WhatsApp or a call. Track how many enquiries mention your posts, so you know the effort is working. If you also run ads, your personal content gives warm audiences that are cheaper to retarget.

  ## Start before you feel ready

  The founders with strong personal brands didn't start as experts or great writers. They started by sharing what they were learning, week after week, and improved as they went. Pick one platform, fix your profile, post two or three times a week and talk to the people who respond. In six months you'll have an audience that trusts you, and that makes every part of growing the business easier.

