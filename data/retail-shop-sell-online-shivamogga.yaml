content: |
  Many shops in Shivamogga, from Gandhi Bazaar to B.H. Road to Durgigudi, already sell over the phone. A regular customer calls, asks what's new, and the shop sends photos on WhatsApp. That's online selling. It just isn't organised yet.

  Here's how to turn it into a proper channel, one step at a time.

  ## Stage 1: WhatsApp Business (week 1)

  Cost: free. Effort: a few evenings.

  - Install **WhatsApp Business** on a dedicated shop number
  - Add your **address, hours, Google Maps link and catalogue**
  - Photograph your **top 20–50 products** in good daylight against a plain background, with prices
  - Set up a **greeting message** and **quick replies** for common questions (delivery, sizes, returns)
  - Accept **UPI payments** with a QR code or payment link
  - Create **broadcast lists** of regular customers for new arrivals and festival offers

  Many Shivamogga shops get a meaningful share of sales from WhatsApp alone. More ideas in our [WhatsApp and Instagram marketing guide](/blog/instagram-whatsapp-marketing-shivamogga).

  ## Stage 2: Instagram for discovery (weeks 2–4)

  WhatsApp sells to people who already know you. **Instagram** finds new customers, especially for fashion, sarees, jewellery, footwear, gifts, cakes and home décor.

  - Post **Reels** of new arrivals, try-ons and unboxings
  - Use **highlights** for categories, prices, delivery info and reviews
  - Put your WhatsApp number in the bio, since most Instagram sales close on WhatsApp
  - Run small **local ads** for festivals: Dasara, Deepavali, wedding season and Ugadi

  ## Stage 3: Delivery and returns

  Decide this **before** you advertise:

  - **Local delivery within Shivamogga:** your own staff or a local delivery partner, same day or next day
  - **Across India:** courier aggregators let you compare rates and book pickups
  - **Cash on delivery:** useful for trust, but it increases returns. Many shops offer it only for repeat customers
  - **A clear return and exchange policy**, written down and shared

  ## Stage 4: Marketplaces or your own website?

  | | Marketplaces (Amazon, Flipkart, Meesho, ONDC apps) | Your own website |
  |---|---|---|
  | Reach | Huge, ready audience | You bring the traffic |
  | Fees | Commission and fees per sale | Payment gateway fees and hosting |
  | Competition | Right next to cheaper sellers | Only your products |
  | Customer data | Mostly the marketplace's | Yours, for repeat sales |
  | Brand | Hard to build | Easy to build |

  For most shops the answer is **both, eventually**: marketplaces for reach, your own site for loyal customers and higher margins.

  ## Stage 5: Your own e-commerce website

  Move to a full store when:

  - You're getting **regular orders** and managing them on WhatsApp is chaotic
  - You have **more products** than a WhatsApp catalogue handles well
  - You want customers to **order at 11 pm** without waiting for a reply
  - You're ready to sell **beyond Shivamogga**

  A good store includes product search and filters, UPI and card payments, order notifications on WhatsApp, inventory tracking and SEO so products appear on Google. We explain options and costs in [e-commerce websites for Shivamogga businesses](/blog/ecommerce-website-shivamogga).

  ## Mistakes to avoid

  - **Bad photos.** Dark, blurry photos kill online sales faster than high prices.
  - **No prices.** "DM for price" loses many customers who won't ask.
  - **Slow replies.** Answer within an hour during shop hours.
  - **Advertising before delivery is sorted.**

