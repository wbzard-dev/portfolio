  ## Your 30-day kickstart plan

  - **Week 1:** location finalised, registrations underway, practice management system chosen
  - **Week 2:** website and Google profile built; clinic photos taken once interiors are ready
  - **Week 3:** WhatsApp booking set up; apartment and corporate outreach planned
  - **Week 4:** opening, health camp or open day, review routine started

