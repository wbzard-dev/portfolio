content: |
  New layouts keep coming up around Shivamogga, and every one of them needs groceries. A well-run kirana or mini supermarket is a steady business: low risk of the product going out of fashion, daily footfall and loyal families. The challenge is thin margins and, increasingly, competition from delivery apps. Here's how to start right.

  ## Step 1: Choose the format

  - **Kirana store**: counter service, small space, strong personal relationships
  - **Mini mart or self-service supermarket**: shelves, trolleys, wider range, more capital
  - **Specialty store**: organic, millets, Malnad produce, dry fruits or a pooja store
  - **Franchise** of an established brand: a ready system, but fees and less freedom

  ## Step 2: Location is everything

  Grocery is a convenience business. Look for:

  - **Growing residential areas** with few existing stores
  - **Count the households** within about 1 km
  - **Main road access** with space for two-wheeler parking
  - **Nearby competition**: you can win against an old store with a cleaner, better-stocked, faster one, but not against three

  Spend a few days observing the area at morning and evening rush times before signing.

  ## Step 3: Registration

  - **Trade licence** from Shivamogga City Corporation or your town's municipal body
  - **Shop and establishment registration**
  - **FSSAI registration** or licence (you sell food)
  - **GST** registration once over the threshold; it also helps when buying from distributors
  - **Weights and measures** (Legal Metrology) compliance for weighing scales
  - **Udyam registration** for MSME benefits

  Full sequence in our guide to [starting a business in Shivamogga](/blog/how-to-start-a-business-in-shivamogga).

  ## Step 4: Stock and suppliers

  Start with fast-moving essentials: rice, dal, oil, atta, sugar, spices, snacks, soaps, detergents, dairy and bread. Buy from local distributors and wholesale markets, and compare credit terms. Watch what sells in the first two months and cut slow items. Add local products (honey, areca, homemade snacks, Malnad spices) that apps don't carry.

  ## Step 5: Billing and stock software

  A simple billing and inventory system from day one shows your fast movers, low stock and margins per product. It also lets you track credit customers properly, which is where many kirana stores quietly lose money.

  ## Step 6: Compete with quick-commerce apps

  You can't beat apps on catalogue size, but you can beat them on trust and service:

  1. **WhatsApp ordering and free home delivery** within your area; send a weekly offer list to a broadcast group
  2. **Google Business Profile** with hours, photos, phone and "delivers" information so "grocery store near me" finds you
  3. **Monthly lists**: let families send their monthly list on WhatsApp and deliver it packed
  4. **Credit for trusted regulars**, tracked in your billing software
  5. **Fresh local products** that apps don't stock
  6. **UPI payments** and a clean, well-lit store

  Our guide to [how retail shops in Shivamogga can sell online](/blog/retail-shop-sell-online-shivamogga) has more ideas.

  ## Step 7: Grow with loyalty

  Know your regular families by name, remember their usual items, run festival offers (Ugadi, Dasara, Diwali) and ask happy customers for Google reviews. In grocery, repeat customers are the whole business.

