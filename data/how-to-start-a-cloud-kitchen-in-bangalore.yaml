content: |
  Bangalore is one of India's biggest food delivery markets, and cloud kitchens have made it possible to start a food brand without renting a restaurant on 100 Feet Road. The catch: low barriers mean heavy competition. The kitchens that survive are the ones that treat it as a **brand**, not just a listing on an app.

  ## Part 1: Shape the idea

  **Start with one hero, not a menu of everything.** "North Indian, Chinese, Continental and Desserts" is how most failing kitchens start. Customers remember *the place that does great Malabar parotta and beef fry* or *the healthy bowls kitchen in HSR*. Pick:

  - **One cuisine or format** (bowls, biryani, millet meals, Kerala home food, high-protein meals)
  - **A hero dish** you can make consistently, fast, and that travels well in a box
  - **A clear customer**: office lunches in Whitefield, students near colleges, families on weekends, fitness-focused professionals

  **Choose your area by demand, not rent.** A cloud kitchen typically serves a **3–5 km radius**. Open the delivery apps at lunch and dinner in different areas (Koramangala, HSR Layout, Bellandur, Marathahalli, Indiranagar, Electronic City) and look at what's crowded and what's missing. A cuisine with only two average-rated options in a dense office area is an opportunity.

  **Test before you invest.** Run a home-kitchen or pop-up trial for 2–3 weekends. Sell to friends, office groups and apartment communities on WhatsApp. If people reorder without being asked, you have something.

  ## Part 2: Execution

  **Licences and registrations.** Requirements depend on your size and setup, so confirm with a food licensing consultant or CA. Most cloud kitchens deal with:

  - **FSSAI** registration or licence, based on turnover
  - **Trade licence** from the local city corporation (Bangalore's civic body is now organised under the Greater Bengaluru Authority)
  - **GST registration**, which delivery platforms generally expect
  - **Fire safety NOC**, depending on kitchen size and location
  - **Shop and establishment registration** if you employ staff

  **Kitchen setup.** Rent a small commercial space, a shared kitchen, or a slot in a multi-brand kitchen facility. Plan for cooking equipment, refrigeration, exhaust, packaging storage and a clean prep area. **Packaging** is a bigger decision than most founders think: it decides whether food arrives looking like your photos.

  **Costing every dish.** Before listing, calculate food cost, packaging, platform commission, discounts and delivery charges per dish. Many kitchens discover their best-seller loses money after commission.

  **Launch on delivery apps.** Swiggy and Zomato onboarding asks for FSSAI, GST, PAN, bank details and a menu. Invest in **professional food photos**, and write short, appetising dish descriptions. The first few weeks of ratings strongly affect how the apps rank you.

  ## Part 3: Getting customers you own

  Delivery apps bring volume, but they own the customer relationship. Build your own channel alongside:

  - **A simple ordering website** with your menu, photos, delivery areas and a WhatsApp order button. It also lets you rank for searches like "healthy meals delivery HSR Layout"
  - **WhatsApp Business** with a catalogue and broadcast lists for daily specials
  - **A card in every delivery bag** with your WhatsApp number and a reason to order direct
  - **Instagram Reels** of food being made: the tawa, the dum being opened, the packing
  - **A Google Business Profile** as a delivery-only business, so you appear in map searches
  - **Office and apartment tie-ups** for bulk lunches and weekend orders

  For content, our [social media framework for new businesses](/blog/social-media-framework-for-new-business) gives you a 90-day plan.

  ## Your 30-day kickstart plan

  - **Week 1:** finalise menu, costing, brand name and packaging; start licence applications
  - **Week 2:** kitchen setup, food photography, Instagram and WhatsApp Business ready
  - **Week 3:** go live on delivery apps; ordering site and Google profile live; friends-and-family orders for early reviews
  - **Week 4:** office and apartment outreach, first small Meta ads within your delivery radius, track reorders

  ## Where a launch partner fits

  The kitchen, the food and the licences are yours. The part founders usually struggle to fit in, while also cooking 200 meals a day, is everything online: the ordering site, the Google profile, Instagram, WhatsApp setup and the first local ads.

