content: |
  Bangalore loves eating out. On any weekend, Koramangala, Indiranagar, Jayanagar, HSR and Whitefield are packed. But the same streets see restaurants open and shut within a year. The ones that last usually get three things right: a clear concept for a specific crowd, controlled costs, and strong local visibility.

  *This is a practical guide, not legal advice. Confirm licences and fees with a consultant or CA; Bengaluru's civic administration has been restructured under the Greater Bengaluru Authority, so check which corporation covers your address.*

  ## Step 1: Concept first

  Answer these before you look at a single property:

  - **Who** eats here? Office lunch crowd, families, couples, students, late-night diners?
  - **What** cuisine and format? QSR, casual dining, fine dining, bar and kitchen, regional cuisine?
  - **Why** would someone choose you over the 20 places within 2 km?

  "Good food" isn't a concept. "Authentic Mangalorean seafood for families in South Bangalore" is.

  ## Step 2: Location

  Match the area to your crowd: tech parks for weekday lunches, residential neighbourhoods for families and delivery, high streets for weekend footfall. Check visibility, parking, delivery radius, neighbouring restaurants and how the street looks at lunch, evening and weekend.

  Study your delivery catchment on aggregator apps too: which cuisines are missing nearby?

  ## Step 3: Licences

  Most Bangalore restaurants need:

  - **FSSAI licence** (state or central, depending on size)
  - **Trade licence** from the city corporation
  - **GST registration**
  - **Shop and establishment registration**
  - **Fire NOC** depending on area and seating
  - **Signage permission** for boards
  - **Excise licence** if you serve alcohol (the most complex and expensive)
  - **Music licence** if you play recorded music

  Start these early; some take weeks or months.

  ## Step 4: Costs to plan

  | Cost head | Notes |
  |---|---|
  | Rent and deposit | Bangalore deposits are often many months of rent |
  | Interiors and kitchen | Kitchen equipment is not the place to cut corners |
  | Licences and consultants | Higher if you serve alcohol |
  | Staff | Chefs, service, cleaning, manager |
  | Opening inventory | Ingredients, packaging, beverages |
  | Technology | POS, aggregator onboarding, website |
  | Marketing | Pre-launch and first 90 days |
  | Reserve | Several months of rent and salaries |

  ## Step 5: Menu engineering

  Keep the menu tight. Cost every dish, know your food cost percentage and push high-margin items in menu design. Test with friends and a soft launch before printing.

  ## Step 6: Aggregators and direct orders

  Swiggy and Zomato bring discovery and volume, but their commissions eat your margin. Build direct orders from day one: a simple ordering website, a WhatsApp number on every bag and table, and a reason to order direct (a small discount or a free side). Read [direct orders vs Zomato and Swiggy](/blog/restaurant-direct-orders-vs-zomato-swiggy).

  ## Step 7: Get found before opening

  1. **Google Business Profile** with menu, photos, hours, reservations and the right category
  2. **Instagram** documenting the build, the chef, and signature dishes; see [Reel ideas for cafés and restaurants](/blog/instagram-reel-ideas-cafes-restaurants-bangalore)
  3. **A website** with menu, location, reservations and ordering
  4. **Food bloggers and local creators** at the soft launch

  ## Step 8: The first 90 days

  - **Soft launch** for two weeks to fix kitchen and service problems
  - **Ask every happy table for a Google review**; reply to every review
  - **Local ads** within 3–5 km on Meta and Google, focused on your concept and best dishes
  - **Track** covers, average bill, food cost, review rating and repeat customers every week

