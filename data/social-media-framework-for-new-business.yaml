content: |
  India has around **500 million social media user identities**, and Instagram alone can reach roughly **481 million people** through ads ([DataReportal, Digital 2026: India](https://datareportal.com/reports/digital-2026-india)). Your customers are scrolling. The question is whether they'll see you, remember you and message you.

  Most new businesses start enthusiastically, post daily for two weeks, see little response, and go quiet. The problem isn't effort. It's the **lack of a system**. Here's the framework we set up for founders in Bangalore and Shivamogga.

  ## Step 1: Decide who you're talking to (and who you're not)

  Before you design a single post, write one sentence:

  > "We help **[specific customer]** who want **[specific outcome]** without **[specific pain]**."

  For example: "We help working professionals in HSR Layout eat home-style meals without cooking after a long day." Every post should make sense to *that* person.

  ## Step 2: Choose your platforms (fewer is better)

  | Platform | Best for |
  |---|---|
  | Instagram | Consumer brands, food, fashion, fitness, beauty, homestays, local services |
  | LinkedIn | B2B, SaaS, consulting, founder-led brands, hiring |
  | YouTube (incl. Shorts) | Education, coaching, real estate, anything that needs explaining |
  | Facebook | Local community reach, older audiences, events |
  | WhatsApp Business | Where conversations turn into sales, for every business |

  Start with **one primary platform plus WhatsApp**. Add a second only when the first runs smoothly.

  ## Step 3: Set 4–5 content pillars

  Pillars are recurring themes that keep your content consistent and easy to plan. A good mix:

  1. **Educate:** tips, how-tos, myths ("3 things to check before buying a sofa")
  2. **Show:** behind the scenes, process, team, making-of
  3. **Prove:** customer reviews, before and after, results, case stories
  4. **Connect:** founder story, values, local culture (Bangalore traffic memes and Malnad monsoon posts work)
  5. **Sell:** offers, launches, product features, clear calls to action

  Aim for roughly 80% value and 20% selling. People follow accounts that help or entertain them, then buy from the ones they trust.

  ## Step 4: Pick a rhythm you can keep for 90 days

  Consistency beats volume. A realistic starting rhythm for a small team:

  - **3 feed posts or reels per week**
  - **Stories most days** (quick, unpolished, real)
  - **One "hero" piece per month**: a high-effort reel, carousel guide or collaboration

  Put it in a simple calendar, and plan around festivals and local moments: Ugadi, Dasara, Deepavali, the monsoon, exam season, the IPL and long weekends.

  ## Step 5: Build templates so posts take minutes, not hours

  Create a small brand kit in Canva or Figma:

  - 3–4 carousel layouts (cover, content, closing slide with call to action)
  - Quote/testimonial template
  - Reel cover template
  - Story templates for offers, polls and FAQs

  Templates make your feed recognisable and cut production time dramatically.

  ## Step 6: A simple reels playbook

  Short video drives most organic reach on Instagram. A repeatable formula:

  1. **Hook in the first 1–2 seconds:** a bold statement, question or surprising visual ("Stop paying ₹500 for this…")
  2. **Deliver the value quickly:** one idea per reel
  3. **On-screen text,** because many people watch without sound
  4. **A clear call to action:** "Save this", "Comment 'PRICE'", "DM us on WhatsApp"

  Keep a running list of hooks that worked and reuse the formats.

  **For Shivamogga and other Karnataka audiences:** test Kannada or bilingual captions and voiceovers. Local language content often earns stronger engagement.

  ## Step 7: Turn followers into customers

  Social media only matters if it leads to enquiries:

  - Put a **WhatsApp link** and a short, clear **bio** ("Home-style tiffin · HSR & Koramangala · Order on WhatsApp ↓")
  - Use **Highlights** for menu or pricing, reviews, FAQs and location
  - Set up **saved replies** for common DMs
  - Reply to comments and DMs **fast**, ideally within the hour during business hours

  ## Step 8: Measure what matters, monthly

  Ignore vanity metrics. Track:

  | Metric | Why it matters |
  |---|---|
  | Reach from non-followers | Is your content being discovered? |
  | Saves and shares | Is it genuinely useful? |
  | Profile visits → link clicks | Is interest turning into action? |
  | DMs and WhatsApp chats | Real conversations |
  | Enquiries and sales from social | The only number that pays the bills |

  Each month, keep the top three formats, drop the bottom three, and try two new ideas.

  ## What to expect in the first 90 days

  - **Month 1:** set up, find your voice, learn what your audience responds to
  - **Month 2:** consistency starts to show in reach; the first DMs and enquiries arrive
  - **Month 3:** clear winners emerge, and you double down. This is also the right time to put [ad budget](/blog/meta-ads-vs-google-ads-for-startups) behind proven content.

