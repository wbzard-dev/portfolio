content: |
  Bangalore is full of experienced professionals who decide it's time to go independent: technology consultants, product and marketing advisors, CAs, lawyers, HR and recruitment specialists, architects and designers. The expertise is there. What's new is **selling it** to people who don't already know you.

  ## Part 1: Shape the idea

  **Narrow your positioning.** Compare:

  - "I'm a business consultant" → hard to remember, hard to refer
  - "I help Bangalore SaaS startups set up their finance function before Series A" → memorable and easy to refer

  Choose by combining **what you're best at**, **who values it most**, and **who can pay**.

  **Pick your offer format.**

  - **Projects** with defined scope and deliverables
  - **Retainers** for ongoing advisory or managed services
  - **Productised services**: fixed packages like "GST compliance setup" or "hiring your first 10 engineers"
  - **Workshops and training** for teams

  Productised offers are easier to sell, price and deliver than open-ended hours.

  **Test with your network.** Before resigning, or right after, have 15–20 conversations with former colleagues, clients and contacts. Ask what they struggle with and whether they'd pay for your offer.

  ## Part 2: Execution

  **Business setup.** Sole proprietorship, LLP or private limited depending on liability, partners and growth plans. Get GST registration if needed, a current account, professional indemnity insurance where relevant, and any registrations your profession requires.

  **Contracts.** Clear engagement letters with scope, deliverables, timelines, fees, payment terms and confidentiality.

  **Pricing.** Price on value and outcome rather than time. Research what clients pay for alternatives: a full-time hire, a large firm, or the cost of the problem.

  **Systems.** Proposals, invoicing, a simple CRM to track leads and follow-ups, and templates for your core deliverables.

  ## Part 3: Winning clients beyond your network

  **Credibility comes first.** People who don't know you will check:

  - **A professional website**: who you help, what you deliver, how you work, case studies, your background and an easy way to book a call. Many consultants lose deals because their only presence is a LinkedIn profile
  - **LinkedIn**: a profile that matches your positioning, and regular posts sharing insights from your work
  - **Case studies** with outcomes, anonymised if needed
  - **Testimonials** from former clients and colleagues

  **Then build inbound demand:**

  - **Content**: LinkedIn posts, articles and short videos on the problems you solve
  - **Talks** at Bangalore meetups, industry events and webinars
  - **Partnerships** with complementary firms that refer work: CAs and lawyers, agencies and consultants, recruiters and HR advisors
  - **SEO** for specific service searches ("GST consultant for startups in Bangalore")
  - **Small, targeted ads** only once your website converts, often LinkedIn or Google search

  ## Your 30-day kickstart plan

  - **Week 1:** positioning, two or three packaged offers, pricing and contracts
  - **Week 2:** website, business email and LinkedIn profile aligned
  - **Week 3:** announcement to your network; 20 personal conversations
  - **Week 4:** first content published, two partnerships approached, proposal templates ready

  ## Where a launch partner fits

  Consultants usually know exactly what they offer but struggle to show it online in a way that wins strangers' trust. A sharp website, consistent LinkedIn presence and a simple lead-capture flow can make you look like an established firm from the first week.

