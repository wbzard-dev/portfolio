content: |
  Bangalore has a never-ending calendar of events: weddings, naming ceremonies, house-warmings, birthday parties, office celebrations, conferences and daily corporate lunches. Many successful caterers here started by cooking for relatives' functions and grew through word of mouth. Here's how to do it deliberately.

  ## Step 1: Choose your segment

  - **Weddings and big functions**: large volumes, seasonal, needs a team and equipment
  - **House parties and small events** (20–100 people): easier start, frequent
  - **Corporate events and conferences**: pay on invoice, need consistency and GST
  - **Daily office lunches and canteens**: steady volume, thin margins
  - **Specialty cuisine**: regional, Jain, satvik, live counters, desserts

  ## Step 2: Kitchen

  Small events can start from a home kitchen. As you grow, rent a commercial kitchen or share one with a cloud kitchen. You'll need large cooking vessels, burners, chafing dishes, serving equipment, insulated containers and transport.

  ## Step 3: Licences

  - **FSSAI registration or licence** depending on turnover
  - **Trade licence** from the city corporation for a commercial kitchen
  - **GST registration** (corporate clients usually require it)
  - **Shop and establishment registration**

  ## Step 4: Menus

  Create set menus at three or four price levels, plus add-ons and live counters. Do tasting sessions for big orders. Standardise recipes so quality stays the same whoever cooks.

  ## Step 5: Per-plate pricing

  Calculate per plate: ingredients, cooking staff, service staff, transport, gas, disposables or crockery, equipment wear, wastage, and your margin. Charge separately for service staff, crockery rental or live counters. Take an advance to confirm and the balance before or on the event day.

  ## Step 6: Staff

  Keep a core team of cooks and helpers, and a list of reliable service staff you can call for big events. Train them on hygiene, presentation and politeness; guests judge the caterer by the service as much as the food.

  ## Step 7: Get clients

  1. **Google Business Profile** as a caterer with menus, photos of real events and reviews; "caterers near me" is searched constantly
  2. **Instagram** with photos and Reels of event setups, live counters and food
  3. **Partners**: event planners, wedding venues, party halls, decorators and apartment associations
  4. **Corporate outreach** to HR and admin teams of nearby offices
  5. **A website** with menus, price ranges, past events and an enquiry form
  6. **Tasting events** for prospective wedding clients

  ## Step 8: Repeat and referrals

  Collect feedback after each event, ask happy hosts for a Google review, and stay in touch; families come back for the next function and corporate clients for the next event.

