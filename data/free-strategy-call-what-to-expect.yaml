content: |
  Many founders put off booking a call with an agency because they expect a hard sell. A good strategy call is the opposite: 30 minutes where someone who launches businesses every month looks at yours and tells you what they'd do first.

  Here's what happens on one, and how to prepare so you leave with real answers.

  ## What a strategy call is for

  The call has three jobs:

  1. **Understand your business:** what you sell, who buys it and how they find you today.
  2. **Find the biggest bottleneck:** usually one of visibility (people can't find you), trust (they find you but don't contact you) or follow-up (they contact you but don't buy).
  3. **Recommend the next step:** the smallest piece of work that would make the biggest difference.

  If it's not a fit, a good agency says so and points you elsewhere.

  ## What happens, minute by minute

  - **0–5 min:** introductions and your goal for the next 3–6 months.
  - **5–15 min:** your business, customers, pricing and current marketing.
  - **15–25 min:** a live look at your website, Google profile, Instagram or ads, with honest observations.
  - **25–30 min:** a recommendation, rough timeline and what it would cost to do it.

  ## 8 things to prepare

  1. **Your goal in one sentence.** For example: "20 enquiries a month for our physiotherapy clinic in Jayanagar."
  2. **Your monthly budget range,** including ad spend. A range is fine.
  3. **Average customer value.** What a customer is worth to you over a year. This decides how much you can pay per lead.
  4. **Current numbers:** monthly enquiries, where they come from, and roughly how many become customers.
  5. **Links:** website, Google Business Profile, Instagram, Facebook, LinkedIn.
  6. **Two or three competitors** you admire or lose customers to.
  7. **What you've tried already,** and what happened.
  8. **Your deadline,** such as a launch date, a festival season or an investor meeting.

  If you're pre-launch and have none of these numbers, that's fine. Our [pre-launch digital presence guide](/blog/pre-launch-digital-presence-new-business) shows what we'll focus on instead.

  ## Questions to ask on the call

  - What would you do first, and why?
  - What would you *not* do for a business like mine?
  - How will we know if it's working, and when?
  - What do you need from me each week?
  - Whose name will the accounts be in?

  More questions are in [how to find the best agency for a Bangalore startup](/blog/best-digital-marketing-agency-bangalore-startups).

  ## What you should get afterwards

  Within a day or two, expect a short written summary: the recommendation, the scope, the price and the timeline. No pressure to sign on the call, no long contracts before results.

