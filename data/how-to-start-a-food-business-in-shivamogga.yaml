content: |
  Shivamogga's colleges, hospitals, offices and growing residential layouts mean a steady demand for good, affordable food: daily meals for students and PG residents, snacks for evening crowds, cakes for celebrations and catering for functions.

  The good news: you can start small and test demand before taking a shop.

  ## Part 1: Choose your model

  | Model | Start-up investment | Good for |
  |---|---|---|
  | **Tiffin / meal subscription** | Low (home kitchen) | Students, PG residents, working professionals |
  | **Home bakery / cakes** | Low to medium | Birthdays, festivals, custom orders |
  | **Snacks and pre-orders** (holige, chakli, pickles) | Low | Festivals, gifting, people outside Shivamogga |
  | **Cloud kitchen** (delivery only) | Medium | Delivery apps, specific cuisines |
  | **Small eatery, darshini or café** | Higher | Busy roads, near colleges, bus stands, hospitals |
  | **Catering for functions** | Medium | Weddings, house warmings, office events |

  If you're unsure, start with tiffins or pre-orders from home and move to a shop once you have regular customers. To test an idea, see [how to validate a business idea](/blog/validate-business-idea-shivamogga).

  ## Part 2: Licences and registrations

  Rules change, so check current requirements and fees with the authorities or a CA.

  - **FSSAI:** every food business needs **FSSAI basic registration** (small businesses) or a **state licence** (larger turnover or operations), applied for on the FoSCoS portal. This applies to home kitchens too.
  - **Trade licence:** for a shop or eatery, from the Shivamogga City Corporation or the relevant local body.
  - **Shop and establishment registration** if you employ staff.
  - **GST:** depending on turnover and whether you sell through delivery apps. Ask a CA.
  - **Fire safety and health approvals** may apply for larger restaurants.
  - **Signboard and building permissions** for a commercial premises.

  General steps: [how to start a business in Shivamogga](/blog/how-to-start-a-business-in-shivamogga).

  ## Part 3: Menu and pricing

  - **Keep the menu short.** A few dishes done consistently well beat a long menu.
  - **Plan around your customers:** simple North Karnataka or Malnad meals, South Indian breakfast, healthy options, or one specialty cuisine.
  - **Calculate the full cost per plate:** ingredients, gas, packaging, delivery, app commissions, wastage and your time.
  - **Subscription pricing** (weekly or monthly) gives predictable income for tiffin services.
  - **Hygiene and consistency** matter more than variety. One bad experience in a WhatsApp group travels fast.

  ## Part 4: Getting your first customers

  **WhatsApp first.** Create a WhatsApp Business account with your menu as a catalogue, timings and payment options (UPI). Share it with friends, PG owners, hostel groups and apartment groups. See [Instagram and WhatsApp marketing for Shivamogga shops](/blog/instagram-whatsapp-marketing-shivamogga).

  **Google Business Profile.** Even a home kitchen can create a service-area profile. People search "tiffin service near me" and "cake shop Shimoga". See the [Google Business Profile checklist](/blog/google-business-profile-shivamogga-local-seo).

  **Delivery apps.** Swiggy and Zomato reach many customers in Shivamogga. Budget for commissions and make sure your pricing works.

  **Tie-ups.** PG owners, hostels, coaching centres, offices and hospitals often need daily meals.

  **Instagram.** Short reels of cooking, packing and happy customers. Ideas: [30 reel ideas for cafés and restaurants](/blog/instagram-reel-ideas-cafes-restaurants-bangalore) work in Shivamogga too.

  **Reviews.** Ask every satisfied customer. See [how to get your first 50 Google reviews](/blog/how-to-get-more-google-reviews).

  ## Part 5: Running it well

  - Write down recipes and portion sizes so quality stays the same
  - Keep a simple daily sheet of orders, costs and payments
  - Collect feedback weekly and change one thing at a time
  - Plan for festivals, exams and holidays when demand changes

  ## Your 30-day kickstart plan

  - **Week 1:** choose the model; apply for FSSAI; fix the menu and costs
  - **Week 2:** WhatsApp Business catalogue, Google Business Profile, simple logo and packaging
  - **Week 3:** trial orders from friends and two or three PGs or offices; collect feedback
  - **Week 4:** launch subscriptions or pre-orders; ask for reviews; post reels

