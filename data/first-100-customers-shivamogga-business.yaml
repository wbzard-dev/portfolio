content: |
  Customer number 101 is far easier to win than customer number 1. By then you have reviews, photos, word of mouth and a sense of what works. The hard part is getting there.

  Here's a 90-day plan we use with new businesses in Shivamogga.

  ## Before launch: get the basics right

  You can't send people somewhere that isn't ready. Before day 1:

  - **Google Business Profile** set up and verified ([checklist](/blog/google-business-profile-shivamogga-local-seo))
  - **WhatsApp Business** with a catalogue and quick replies
  - **Instagram** with 9–12 posts so it doesn't look empty
  - A **simple website** with services, prices or price ranges, and a WhatsApp button
  - A clear **launch offer** that isn't just a deep discount

  ## Days 1–30: your network (customers 1–30)

  In Shivamogga, people trust people. Your first customers almost always come from someone who knows you.

  - **Message everyone personally**: family, friends, classmates, former colleagues, your apartment or layout group. Personal messages, not a forward.
  - **Ask for one thing**: try us, and if you like it, tell one person.
  - **Ask every happy customer for a Google review** in the first week. Early reviews are what convince strangers.
  - **Make a founding customer offer**: a free add-on, early access or priority service, rather than heavy discounts that set the wrong price in people's minds.

  ## Days 15–60: local visibility (customers 30–70)

  **Google Maps.** Post weekly updates and photos on your profile, answer questions, and reply to every review. New businesses with steady activity climb the map rankings.

  **Partnerships.** Find businesses that serve the same customers but don't compete:

  - A bakery and a gift shop doing joint festival hampers
  - A coaching centre and a stationery shop near colleges
  - A physiotherapist and a gym
  - A homestay and a local guide or taxi service

  **Community.** College fests, apartment association events, temple festivals, sports tournaments and local Facebook and WhatsApp groups. Show up, sponsor small things, be useful.

  **Instagram.** Reels showing your work, your team and real customers. Collaborate with Shivamogga creators and pages. See our [social media framework](/blog/social-media-framework-for-new-business).

  ## Days 30–90: small, targeted ads (customers 70–100+)

  Shivamogga is a great place to advertise because **competition is lighter** than in Bangalore. A modest daily budget can reach a large share of your local audience.

  - **Meta ads** (Facebook and Instagram) within a few kilometres of your location, for launches, offers and events
  - **Google search ads** for high-intent searches like "AC repair Shivamogga" or "dentist near me"
  - Send ads to a **specific landing page or WhatsApp**, not just your Instagram profile

  Start small, watch cost per enquiry for a week or two, then increase what works. Our [Google Ads guide for Shivamogga](/blog/google-ads-shivamogga-guide) explains the setup, and [how much to spend](/blog/digital-marketing-budget-shivamogga) helps you set a budget.

  ## Track where every customer came from

  Ask every new customer **"How did you hear about us?"** and write it down in a simple sheet. After 50 customers, you'll know which channels deserve more time and money.

  ## Turn customers into repeat customers

  Getting to 100 customers is great. Getting 30 of them to come back is better:

  - Save customers to a **WhatsApp broadcast list** (with permission)
  - Send a **thank-you message** and a reason to return
  - Remember regulars by name. In Shivamogga, that still matters more than any loyalty app

