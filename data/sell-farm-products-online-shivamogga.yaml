content: |
  Shivamogga district and the wider Malnad region grow some of Karnataka's best-known produce: areca, pepper, cardamom, coffee in the hill taluks, forest honey, jaggery, rice varieties and more. Much of it is sold to traders at wholesale rates. The same products, packed and branded, sell for much more in Bangalore homes.

  The opportunity is real. So is the work. Here's how to approach it.

  ## Step 1: Pick a focused first product

  Don't launch with twenty items. Choose one or two where you have a real advantage:

  - **Single-estate coffee** (roasted beans or ground)
  - **Raw or forest honey**
  - **Pepper, cardamom and spice blends**
  - **Organic jaggery and jaggery powder**
  - **Traditional rice varieties**
  - **Areca-based products** such as areca leaf plates and bowls (popular as eco-friendly tableware)
  - **Homemade pickles, chutney powders and snacks**

  The best first product travels well, has a long shelf life and has a clear story.

  ## Step 2: Get compliance right

  - **FSSAI:** packaged or processed food needs FSSAI registration (small businesses) or a state licence, depending on turnover and activity. Check the current thresholds on the FoSCoS portal.
  - **Labelling:** product name, ingredients, net weight, FSSAI number, manufacturing and best-before dates, and address, as per FSSAI rules.
  - **GST:** may be needed depending on turnover and if you sell through marketplaces. Ask a CA.
  - **Organic claims:** you can't call products "organic" without proper certification. Use honest words like "naturally grown" only if true.
  - **Lab testing:** for honey and spices especially, test reports build trust and help with marketplaces.

  For general setup, see [how to start a business in Shivamogga](/blog/how-to-start-a-business-in-shivamogga) and [funding and schemes in Karnataka](/blog/startup-funding-schemes-shivamogga).

  ## Step 3: Brand and packaging

  City buyers pay for trust. Your packaging and content should answer:

  - **Where is it from?** Village, taluk, estate, altitude
  - **Who made it?** Your family, your farm, your process
  - **Why is it better?** Fresh harvest, small batches, no additives
  - **How do I use it?** Brewing guide, recipes, storage

  Use food-grade, well-sealed packaging that survives courier handling. See [brand name, logo and domain](/blog/brand-name-logo-domain-new-business-shivamogga).

  ## Step 4: Where to sell

  | Channel | Good for | Watch out for |
  |---|---|---|
  | **WhatsApp and Instagram** | First 100 customers from your network and referrals | Manual order handling |
  | **Your own website** | Better margins, repeat customers, brand building | Needs traffic (SEO, ads, social) |
  | **Marketplaces** (Amazon, Flipkart and others) | Reach and trust | Commissions, fees, price competition, returns |
  | **Bangalore pop-ups, organic stores, cafés** | Sampling, wholesale-plus orders | Credit terms, consistency |
  | **Corporate gifting** | Festival bulk orders | Lead time, custom packaging |

  Start with WhatsApp and Instagram, add a simple store when orders become regular. See [how local shops can sell online](/blog/retail-shop-sell-online-shivamogga) and [e-commerce website options](/blog/ecommerce-website-shivamogga).

  ## Step 5: Price for profit

  Work out your **full cost per pack**: produce, processing, packaging, label, courier (and failed deliveries), payment gateway fees, marketplace commission, ad cost per order and your time. Many farm brands underprice and lose money on every courier order.

  Offer combos and larger packs so shipping is spread across a higher order value.

  ## Step 6: Marketing that fits

  - **Reels:** harvest, drying, roasting, packing, the estate in the monsoon
  - **Recipes and brewing videos**
  - **Customer reviews and unboxing videos**
  - **Festival and gifting campaigns** around Deepavali and New Year
  - **Meta ads to Bangalore** audiences interested in organic food, coffee or cooking, once your page converts

  ## Your 30-day kickstart plan

  - **Week 1:** product chosen, FSSAI application started, costs calculated
  - **Week 2:** packaging and labels designed; product photos taken
  - **Week 3:** Instagram and WhatsApp Business set up with catalogue; first orders from your network
  - **Week 4:** collect reviews, fix packaging issues, plan a simple website

