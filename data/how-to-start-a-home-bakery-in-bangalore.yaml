content: |
  Birthdays, anniversaries, office celebrations, festivals: Bangalore orders a lot of cakes and treats, and many people prefer a trusted home baker over a chain. Low startup costs make it one of the easiest food businesses to begin. The challenge is turning occasional orders from friends into a steady business.

  ## Part 1: Shape the idea

  **Choose a speciality.**

  - **Custom celebration cakes**: themes, fondant, photo cakes
  - **Eggless or vegan bakes**: a large audience in Bangalore
  - **Healthy bakes**: millet, sugar-free, keto, gluten-free
  - **Cookies, brownies and gift boxes**: great for corporate and festival gifting
  - **Regional sweets and snacks**: home-style Mysore pak, chakkuli, Kerala snacks, pickles
  - **Meal or tiffin service** for nearby offices and PGs

  **Define your area.** Delivering a cake across Bangalore in traffic is risky. Start with a radius you can reliably serve, such as your apartment community and nearby neighbourhoods.

  **Test with your network.** Take orders from friends, colleagues and your apartment community for a month. Track what sells, what gets reordered, and what people ask for that you don't make.

  ## Part 2: Execution

  **FSSAI registration.** Home food businesses need FSSAI registration, which is done online and is straightforward for small turnovers. Display your FSSAI number on packaging and your profiles; it builds trust.

  **Kitchen and equipment.** A good oven, mixer, accurate scales, storage and a clean, dedicated workspace. Upgrade only once demand justifies it.

  **Pricing.** For each product, add ingredients, packaging, gas and electricity, delivery, your time, and a margin. Many home bakers undercharge for their time. Your price signals quality.

  **Packaging.** Sturdy cake boxes, labels with your brand, FSSAI number, ingredients and a "best before". Packaging is your marketing when the cake arrives at a party.

  **Delivery.** Use reliable delivery partners for local orders, or offer pickup. Agree on cutoff times for same-day orders and advance notice for custom cakes.

  **Payments.** UPI and payment links, with an advance for custom orders to avoid cancellations.

  ## Part 3: Getting steady orders

  - **Instagram**: Reels of decorating, cutting, packaging and customer celebrations. Your feed is your menu
  - **WhatsApp Business** with a catalogue, quick replies for prices and delivery, and broadcast lists for festival specials
  - **Google Business Profile** as a home-based or service-area business, with photos and reviews
  - **A simple website** with a catalogue, prices, order form and delivery areas
  - **Apartment communities** and office groups, which often bring the first wave of regulars
  - **Corporate gifting** for Diwali, Christmas and New Year: bulk orders with good margins
  - **Reviews and referrals**: ask every happy customer for a photo and review

  See our [social media framework for new businesses](/blog/social-media-framework-for-new-business) for a 90-day content plan.

  ## Your 30-day kickstart plan

  - **Week 1:** speciality, menu, pricing and brand name finalised; FSSAI application
  - **Week 2:** product photography, Instagram and WhatsApp Business catalogue ready
  - **Week 3:** website and Google profile live; apartment and office outreach
  - **Week 4:** festival or launch offer, small local ads, review routine running

