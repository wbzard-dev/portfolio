content: |
  When a founder asks "how much will a website cost?", the honest answer is "it depends on what you need". A short brief turns that into a precise quote. It also makes sure the developer builds a site that brings customers, not just one that looks nice.

  Here's a ten-section brief you can fill in within an hour. Copy it into a document and send it to every developer or agency you're considering, so the quotes are comparable.

  ## 1. About the business

  - Business name, what you sell and where.
  - How long you've been operating, or your launch date.
  - **Example:** "A physiotherapy clinic in Vinobanagar, Shivamogga, opening in January."

  ## 2. The goal of the website

  Pick one primary goal:

  - Get enquiries (calls, WhatsApp, forms).
  - Get bookings or appointments.
  - Sell products online.
  - Build credibility for investors, partners or B2B buyers.

  **Example:** "30 appointment enquiries a month from Google and Instagram."

  ## 3. Who the customers are

  - Who buys from you, what they worry about and what they search for.
  - Languages they prefer. See [Kannada and bilingual websites](/blog/kannada-bilingual-website-shivamogga).

  ## 4. Pages you need

  List every page. For example:

  - Home
  - About
  - One page per service (list them)
  - Pricing or packages
  - Testimonials or case studies
  - Blog
  - Contact

  Not sure how many? Read [one-page vs multi-page websites](/blog/one-page-vs-multi-page-website-small-business).

  ## 5. Features

  Tick what you need:

  - Contact form, WhatsApp button, click-to-call
  - Online booking or calendar
  - Payments or e-commerce (how many products?)
  - Blog or CMS for you to edit content
  - Multiple languages
  - Customer login or portal
  - Integrations (CRM, email, Google Sheets)

  Every extra feature changes the price, so this section matters most.

  ## 6. Design references

  Share two or three sites you like and **what specifically** you like: layout, colours, photos, simplicity. Also mention one you dislike. Share your logo and brand colours if you have them.

  ## 7. Content and photos

  - Who writes the text: you, or the developer?
  - Do you have professional photos, or will you shoot them? See [phone photography for small businesses](/blog/phone-photography-small-business).

  Missing content is the number one reason website projects run late.

  ## 8. SEO and tracking

  - Which cities and areas do you want to appear in on Google?
  - Require GA4, Search Console and Meta Pixel set-up at launch.
  - Basic on-page SEO (titles, descriptions, page speed) should be included.

  ## 9. Ownership and access

  State clearly: **the domain, hosting, website code and all accounts must be registered in the business's name**, with login details handed over at launch. Our [domain, hosting and email guide](/blog/domain-hosting-business-email-guide-shivamogga) explains each piece.

  ## 10. Budget and timeline

  - A budget range. This helps developers suggest the right solution instead of guessing.
  - Your deadline and why (launch, festival, event).

  For typical ranges, see [website design cost in Shivamogga](/blog/website-design-cost-shivamogga) or [website development cost for Bangalore startups](/blog/website-development-cost-bangalore-startups). For timelines, read [how long it takes to build a website](/blog/how-long-to-build-a-website-india).

  ## What to do next

  Send the brief to two or three developers and use our [questions to ask a website developer](/blog/how-to-hire-a-website-developer-questions) to compare answers.

  Or send it to us. [Book a free 30-minute call](https://cal.com/vivek-g-ts38ii/30min) and we'll go through your brief together, or [share your details](/startup-launch-package) and we'll reply with a fixed, itemised quote. Don't have a brief yet? That's fine: we'll fill it in with you on the call.
