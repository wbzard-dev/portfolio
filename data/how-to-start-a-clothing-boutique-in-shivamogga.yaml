content: |
  Many of the best boutiques in Shivamogga started in someone's front room: a few sarees, a WhatsApp group of relatives and friends, and an eye for what people like. The difference now is that Instagram lets the same boutique sell to customers in Bangalore, Mangaluru and abroad.

  ## Step 1: Pick your niche

  - **Sarees**: silk, cotton, Ilkal, Mysore silk, designer and party wear
  - **Ethnic wear**: kurtis, salwar sets, lehengas
  - **Kids' wear and festive outfits**
  - **Custom tailoring and blouse designing**: high demand around weddings
  - **Western and casual wear** for college students
  - **Men's ethnic wear** for weddings and functions

  Choose based on what you know and who you already know. Your first 50 customers usually come from your own network.

  ## Step 2: Shop, home boutique or online first?

  | Model | Good for | Watch out for |
  |---|---|---|
  | **Home boutique** | Testing demand, low cost | Limited walk-ins, space for trials |
  | **Small shop** | Walk-in customers, trust | Rent, fixed hours, staff |
  | **Online first (Instagram + WhatsApp)** | Reaching beyond Shivamogga | Photos, shipping, returns |

  Most successful small boutiques combine a small physical space with strong Instagram and WhatsApp selling.

  ## Step 3: Sourcing

  Visit wholesale markets and manufacturers (Bangalore's Chickpet, Surat, Jaipur, Tiruppur and handloom clusters) and buy small quantities of many designs at first. Track what sells in the first month, then reorder winners. Build relationships with two or three reliable suppliers who will send photos and ship small lots.

  ## Step 4: Registration

  - **Trade licence** from Shivamogga City Corporation if you run a shop
  - **Shop and establishment registration**
  - **GST**: most online marketplaces and many shipping and payment setups need it; ask your CA about selling across states
  - **Current account** and UPI/payment gateway in the business name

  Full sequence in our [starting a business in Shivamogga](/blog/how-to-start-a-business-in-shivamogga) guide.

  ## Step 5: Photos sell clothes

  Customers buy from photos and videos. Use natural daylight, a plain wall, and show each piece draped or worn, with close-ups of fabric and work. Short Reels of a saree being draped or a kurti in motion sell far better than flat photos. Our [phone photography guide](/blog/phone-photography-small-business) shows how.

  ## Step 6: Selling channels

  1. **Instagram**: new arrivals, Reels, Stories with "DM to order"
  2. **WhatsApp Business**: catalogue, broadcast lists for new stock, payment by UPI
  3. **Google Business Profile** with the "Boutique" or "Clothing store" category, so "boutique near me" searches find you
  4. **A simple website or online store** once you have steady orders, so customers outside Shivamogga can order without DMs. See [e-commerce websites in Shivamogga](/blog/ecommerce-website-shivamogga)
  5. **Exhibitions and pop-ups** before festivals and wedding season

  ## Step 7: Policies and trust

  Write a clear exchange and return policy, shipping charges and delivery time, and post them on your profile. Share customer photos (with permission) and collect Google reviews. Trust is what turns an Instagram follower into a buyer.

