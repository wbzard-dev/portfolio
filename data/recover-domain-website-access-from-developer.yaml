content: |
  It happens far more often than most people realise. A freelancer built your website a few years ago and has stopped answering calls. An agency you stopped working with won't hand over the Instagram ad account. Your domain is about to expire, and the renewal emails go to someone else. Suddenly you realise you don't control the online presence your business depends on.

  Don't panic, and don't start over yet. In most cases you can recover your domain, website, Google listing and social accounts, especially if you can prove the business is yours. This guide walks through how to find out what you actually own, how to ask for access the right way, the official recovery routes for each platform, and how to make sure it never happens again. It's written for Indian small business owners, with no technical knowledge needed.

  ## Step 1: Find out what you have and where it is

  Before contacting anyone, make a list of every online asset: domain, hosting, website login, business email, Google Business Profile, Google Analytics, Search Console, Facebook page, Instagram, ad accounts and WhatsApp Business.

  For the domain, use a **WHOIS lookup** or the registrar's lookup tool. It usually shows which registrar the domain is with, such as GoDaddy, Hostinger, BigRock or Namecheap, and its expiry date. Owner details are often hidden for privacy, but the registrar is enough to start.

  Also check old emails and invoices. Search your inbox for the domain name, "hosting", "invoice" and the developer's name. Payment receipts in your name are strong proof of ownership.

  ## Step 2: Ask for access politely, in writing

  Many developers aren't hostile; they're just busy or have moved on. Send a short, friendly message by email and WhatsApp asking for:

  - The domain's **transfer code** (EPP or auth code), or for the domain to be moved to your registrar account.
  - **Hosting and website admin logins**, or a full backup of the site.
  - You to be added as **owner** on Google Business Profile, Analytics, Search Console and the Meta business portfolio.

  Offer to pay a reasonable fee for their time if needed; it's often the fastest route. Keep a record of every request and reply.

  ## Step 3: Use official recovery routes

  If you get no reply after a couple of weeks, each platform has its own process.

  ### Domain name

  Contact the registrar's support with your business documents, such as GST registration, trade licence or incorporation certificate, and any invoices. If the domain is registered under your name or business but with someone else's email, registrars can often help update the contact. If it's in the developer's name, recovery is harder and may need a formal dispute. For **.in** domains, the .IN registry's dispute policy applies.

  ### Google Business Profile

  If someone else owns your profile, request ownership from inside Google Business Profile by searching for your business and choosing to request access. The current owner gets a set period to respond. If they don't, Google may let you verify and take over.

  ### Facebook page and Instagram

  If you were ever an admin, check Meta Business Suite for your access. Otherwise, use Meta's help centre forms for page access issues and provide business documents. Recovery is easier if your business name and documents clearly match the page.

  ### Website files and content

  Even without hosting access, you can save your content. Copy text, download images from the live site, and use the Wayback Machine at archive.org for older versions. This gives you everything needed to rebuild on a new host if necessary.

  ## Step 4: If they refuse or demand money

  If a developer refuses to hand over assets you paid for, or asks for an unreasonable amount, send a formal written notice listing what you paid for and requesting transfer by a specific date. A lawyer's notice is often enough to resolve it.

  At the same time, prepare a backup plan. If the domain can't be recovered, register a new one, rebuild the website, update your Google profile and social pages, and tell customers. It's painful, but it's better than staying dependent on someone who won't cooperate.

  ## Step 5: Make sure it never happens again

  Once you have everything back:

  - Put every account under a **business email you own**, with two-factor authentication on.
  - Add developers and agencies as **users or admins**, never as the only owner.
  - Turn on **domain auto-renew** with your own payment method.
  - Keep an **access sheet** with every account, login email and renewal date.
  - Ask for a **website backup** every few months.

  Our [first-week setup checklist](/blog/new-business-online-setup-first-week) and [questions to ask a developer](/blog/how-to-hire-a-website-developer-questions) cover this in detail.

  ## Your business, your accounts

  Losing access to your domain or social pages is stressful, but it's usually recoverable. Find out what you have, ask in writing, use each platform's official recovery route, and keep proof that the business is yours. Once you're back in control, move everything to accounts you own so no single person can ever lock you out again.

