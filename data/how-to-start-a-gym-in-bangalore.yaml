content: |
  Bangalore is one of India's most fitness-conscious cities: runners on the weekend, office-goers who want to stay healthy and a growing appetite for strength training, yoga and functional fitness. Large chains compete on price and convenience. Independent studios win on **coaching, community and results**.

  ## Part 1: Shape the idea

  **Pick your format.**

  - **Full gym**: more space and equipment, broader audience, more competition with chains
  - **Strength or functional training studio**: smaller space, coach-led, higher price per member
  - **Yoga, Pilates or dance studio**: class-based, community-driven
  - **Women-only or specialised** (seniors, post-natal, athletes): clear niche, strong loyalty
  - **Personal training studio**: few clients, premium pricing

  **Check the neighbourhood.** Map nearby gyms and studios, their prices and their Google reviews. In dense residential areas like HSR, Bellandur, Sarjapur Road, Jayanagar or Hebbal, there's often room for a specialised studio even with chains nearby.

  **Validate.** Run outdoor or community-hall classes for a few weeks, or a trial batch in a rented space. If people pay and keep showing up, you have demand.

  ## Part 2: Execution

  **Space.** Ceiling height, flooring that handles dropped weights, ventilation, changing rooms, parking, and neighbours who won't complain about music at 6 am.

  **Licences.** Typically a trade licence from the local city corporation, shop and establishment registration, GST where applicable, and fire safety compliance depending on the premises. Confirm with a consultant.

  **Equipment.** Buy for your format, not for the brochure. A strength studio needs racks, barbells and plates more than rows of machines.

  **Trainers.** Your coaches are your product. Hire certified, personable trainers, and agree on how members are onboarded, assessed and tracked.

  **Pricing.** Monthly, quarterly and annual plans, class packs, personal training add-ons. Make the **founding member** offer attractive enough that people commit before you open.

  ## Part 3: Your first 100 members

  - **Pre-sell founding memberships** during fit-out with a simple landing page and WhatsApp
  - **Free trial class or week**, booked online
  - **Instagram**: member transformations (with permission), coach tips, class clips, community events
  - **Google Business Profile** with class schedule, photos, prices and reviews
  - **Apartment and corporate tie-ups**: group discounts for residents or employees of nearby tech parks
  - **Challenges**: 30-day transformation challenges create urgency and stories
  - **Local Meta ads** within a few kilometres for launch and new batches

  **Retention** is where profit lives. Onboard every member personally, track progress, celebrate milestones and build a community WhatsApp group.

  ## Your 30-day kickstart plan

  - **Week 1:** format, pricing and brand finalised; space and licences underway
  - **Week 2:** landing page with founding membership offer, Instagram and Google profile live
  - **Week 3:** pre-sales push through apartments, offices and ads; coach content filmed
  - **Week 4:** opening week free trials, challenge launched, review routine started

