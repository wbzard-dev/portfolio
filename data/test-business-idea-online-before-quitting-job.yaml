content: |
  Thousands of people in Bangalore sit in traffic every evening thinking about the business they want to start. A cloud kitchen, a consulting practice, a D2C brand, a SaaS tool. What stops most of them isn't the idea. It's the fear of giving up a steady salary for something that might not work.

  The good news is that you no longer need to resign to find out. With a simple website, a small ad budget and a few weekends, you can test whether strangers will actually pay for your idea while you're still employed. This guide explains how to run that test properly, what numbers to look for, and the legal points to check first so your side project doesn't get you into trouble at work.

  ## Check your employment contract first

  Before you build anything, read your offer letter and employment agreement. Many IT and corporate contracts include:

  - **Moonlighting clauses** that restrict paid work outside your job.
  - **IP assignment clauses** that may give your employer rights to things you create, especially in the same field.
  - **Non-solicitation** rules about clients and colleagues.

  If your idea is close to your employer's business, get advice before you start. Testing a bakery while working at a bank is very different from building a competing software product. Using company laptops or time for your side project is also a common mistake.

  ## Friends' opinions are not validation

  The biggest trap is asking friends and family. They'll say "great idea" because they like you, not because they would pay. Real validation means **strangers taking action**: paying, pre-ordering, booking a call or joining a waitlist with their phone number.

  That's why an online test works so well. When you show an offer to people who don't know you and measure what they do, you get honest data. Our guide on [validating a business idea](/blog/validate-business-idea-shivamogga) covers interviews and early research, and this article focuses on the online test.

  ## Build a one-page test website

  You need one page that explains your offer as if the business already exists:

  - **What you sell**, for whom, and the main benefit.
  - **A price**, or at least a starting price. Without a price, interest means little.
  - **Photos or a mock-up** of the product or service.
  - **One action**: pre-order, book a free consultation, or join the waitlist.

  This can be built in a weekend with a simple website builder, or by a developer for a modest fee. Use your own domain so it looks credible. Our [landing page guide](/blog/landing-page-for-ads-that-converts) explains what makes visitors act.

  ## Run small ads to strangers

  Now send real traffic. Set aside **₹5,000 to ₹15,000** for a two to four week test:

  - **Meta ads** (Instagram and Facebook) work for products, food, fashion and lifestyle ideas where people buy on impulse.
  - **Google Search ads** work for services people already search for, such as "GST consultant for startups" or "corporate catering Whitefield".

  Target the exact area and audience you'd serve. Don't boost posts; use Ads Manager so you control targeting and can see results. If you're new to ads, read [Meta ads vs Google ads for startups](/blog/meta-ads-vs-google-ads-for-startups).

  ## Decide your success numbers before you start

  Write down what success looks like before the first rupee is spent. Otherwise you'll talk yourself into continuing no matter what happens. Some examples:

  - A D2C product: **20 paid pre-orders** at full price.
  - A consulting service: **10 qualified discovery calls** and 2 paying clients.
  - A food business: **50 weekend orders** in a month.

  Also track the **cost per enquiry** or cost per order. If each customer costs more to acquire than they'll ever spend with you, the idea needs changing, even if people like it.

  If the numbers fall short, don't give up immediately. Change one thing at a time, such as the price, the headline, the audience or the offer, and run the test again for a week. Many successful businesses found their real customer on the second or third attempt. What matters is that every round teaches you something you couldn't have learned from friends.

  ## Use evenings and weekends wisely

  A side test works when you keep it small. Reply to enquiries in the evening, deliver the first orders on weekends, and keep everything simple: WhatsApp for orders, UPI for payments, a spreadsheet for tracking. Don't build an app, hire a team or register a private limited company before you know people will pay.

  When the numbers look good, the next step is the [launch plan for a business in Bangalore](/blog/launch-a-new-business-online-in-bangalore) and the [checklist after registering a company](/blog/what-to-do-after-registering-a-company-in-india).

  ## Resign with data, not hope

  Quitting a job to start a business is a big decision, but it doesn't have to be a blind one. A short online test with a simple page, a real price and a small ad budget tells you whether strangers want what you're offering. If they do, you'll resign with paying customers and a clear plan. If they don't, you've saved months of savings and can adjust the idea.

  Want help building a test page and running your first ads? Our [Startup Launch Package](/startup-launch-package) is designed for exactly this stage.
