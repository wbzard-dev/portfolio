content: |
  Meta (Facebook and Instagram) ads are the fastest way for many local businesses to get enquiries, because they reach people before they start searching. But many owners try lead ads once, get 40 "leads" that don't answer the phone, and give up.

  Here's how to set them up for quality, not just quantity.

  ## Three ways to collect leads

  | Option | How it works | Lead quality | Best for |
  |---|---|---|---|
  | **Instant form** | A form opens inside Facebook or Instagram, pre-filled with the user's details | Volume is high; quality varies | Admissions, real estate, services with a callback |
  | **Click-to-WhatsApp** | Ad opens a WhatsApp chat with your business | Usually good, since people type a message | Shops, clinics, salons, cafés, anyone who replies fast |
  | **Website / landing page** | Ad sends people to your page with a form, call and WhatsApp buttons | Usually highest, lower volume | Higher-value services, founders testing an offer |

  If you can reply on WhatsApp within minutes during business hours, **click-to-WhatsApp** is often the best place to start in Shivamogga and for local services in Bangalore.

  ## Instant form settings that cut junk leads

  - **Form type: "Higher intent".** Adds a review step before submitting, so fewer accidental taps.
  - **One qualifying question.** "Which service are you interested in?", "Preferred area?", or "When do you plan to start?" with multiple-choice answers.
  - **Keep it short.** Name, phone, and one or two questions. Every extra field lowers volume.
  - **Clear intro text.** Say exactly what happens next: "We'll call you within 30 minutes to share fees and timings."
  - **Privacy policy link.** Required by Meta. Your website needs one.

  ## Targeting: let Meta do more of the work

  - **Location:** a radius around your business, or the areas you deliver to. For Bangalore, pick neighbourhoods rather than the whole city where it makes sense.
  - **Age and language:** only where it truly matters (for example, parents for a preschool).
  - **Interests:** keep them broad. With good conversion data, Meta usually finds buyers better than narrow interest lists.
  - **Retargeting:** show a second ad to people who watched your videos, engaged with your Instagram, or visited your website.

  ## Creative that brings better leads

  - **Real photos and short videos** of your place, team and work. Stock images look like every other ad.
  - **Local cues:** the neighbourhood name, a landmark, the language your customers speak. See [Kannada vs English content](/blog/kannada-vs-english-social-media-content).
  - **A specific offer:** "Free trial class this Saturday", "Free site visit and estimate", "Book a consultation".
  - **Honest expectations:** if you mention fees, mention a range. Hiding prices can attract the wrong people.

  ## Speed decides the sale

  A lead who filled your form 3 minutes ago remembers you. After a few hours, they've often contacted two competitors.

  - Send leads instantly to your phone or a simple CRM (Meta's Leads Center, Google Sheets or WhatsApp notifications)
  - **Call or message within minutes** during business hours
  - Use a short WhatsApp template for the first message
  - Follow up two or three times over a few days before giving up

  ## Track real results

  Install the **Meta Pixel** on your website, and where possible the **Conversions API**, so Meta learns which people actually enquire. For instant forms, mark leads as qualified or converted in Leads Center so you can see which ads bring real customers.

  Measure **cost per qualified lead** and **cost per customer**, not just cost per lead.

  ## Your 30-day plan

  - **Week 1:** privacy policy page, Pixel installed, WhatsApp Business ready with quick replies
  - **Week 2:** one campaign, two or three creatives, one offer
  - **Week 3:** call every lead within minutes; note quality per ad
  - **Week 4:** turn off weak ads, add a retargeting ad, adjust the form question

