content: |
  When someone searches "dentist near me" or "bakery in Jayanagar", Google shows three businesses in the map pack. People look at the stars, the number of reviews and the latest few comments, then they call. A business with 4 reviews loses to one with 80, even if its work is better.

  The good news: you don't need tricks. You need a habit.

  ## Why reviews matter so much

  - **Ranking:** Google uses review count, rating and recency as signals for local results, alongside relevance and distance.
  - **Trust:** most people read reviews before visiting a new clinic, salon, café or service provider.
  - **Conversion:** a strong profile turns searches into calls, direction requests and WhatsApp messages.

  If your [Google Business Profile](/blog/google-business-profile-shivamogga-local-seo) isn't set up and verified yet, do that first.

  ## Step 1: Get your direct review link

  In your Google Business Profile, choose **"Ask for reviews"** (or "Get more reviews"). Google gives you a short link that opens the review box directly. Save it somewhere you can paste it in seconds.

  Then make it easy to use:

  - Save it as a **WhatsApp Business quick reply** (for example `/review`)
  - Print a **QR code** for the counter, reception desk or bill folder
  - Add it to your **invoice**, email signature and thank-you messages

  ## Step 2: Ask at the right moment

  Timing matters more than wording. Ask right after the customer feels the result:

  - A clinic: after a successful follow-up visit, not while the patient is waiting
  - A café or restaurant: when the bill arrives and they've said the food was good
  - A service business: right after the job is done and checked
  - A coaching centre: after results, or after a parent-teacher meeting that went well

  Ask in person first, then send the link on WhatsApp the same day.

  ## Step 3: Use a short, honest message

  > "Thank you for choosing us today. If you were happy with the service, a short Google review really helps a small business like ours. It takes 30 seconds: [link]"

  Offer it in Kannada too if that's how you speak with the customer. Never script what they should write.

  **Tip:** it's fine to say "if you can, mention what we helped you with". Reviews that naturally mention the service ("root canal", "birthday cake", "AC repair") and the area help future customers find and trust you.

  ## What Google's rules forbid

  Getting this wrong can get reviews removed or your profile restricted:

  - **No incentives.** Don't offer discounts, gifts or freebies in exchange for reviews.
  - **No review gating.** Don't ask only the customers you think are happy, or filter people through a survey first.
  - **No fake or bought reviews**, including from staff, friends posing as customers or review sellers.
  - **No review stations** where customers post reviews on a device at your shop.

  Ask everyone. A few honest 4-star reviews make the 5-star ones more believable.

  ## Step 4: Reply to every review

  - **Positive:** thank them by name and mention the service. "Thanks Priya, glad the cake was a hit at the party."
  - **Negative:** reply calmly within a few days, acknowledge the issue, and offer to fix it offline with a phone number. Don't argue in public.
  - **Fake or abusive:** flag it through your profile. Google removes reviews that break its policies, not ones that are simply unfair.

  Future customers read how you respond. A good reply to a bad review often wins more trust than the review lost.

  ## Make it a team habit

  - Give staff the QR code and the WhatsApp quick reply
  - Set a simple monthly target (for example 10 new reviews)
  - Check the count every Monday
  - Thank the team member who brought in the most

  Steady reviews every month beat a burst of 30 in one week followed by silence.

  ## Your 30-day review plan

  - **Week 1:** review link saved, QR code printed, WhatsApp quick reply set up
  - **Week 2:** message your last 30 happy customers personally
  - **Week 3:** ask every customer at the right moment; reply to every review
  - **Week 4:** count results, keep what worked, make it part of daily work

