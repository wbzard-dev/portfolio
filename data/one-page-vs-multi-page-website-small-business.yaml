content: |
  When a new business decides to get a website, the next question is usually about size. Do you need a home page, about page, services, gallery, blog and contact page? Or will one simple page do the job? Web designers often push for more pages because it means a bigger quote, while friends say a single page is plenty.

  The right answer depends on what you want the website to do in its first year. If its main job is to look professional and help people contact you, one page may be enough. If you want Google to send you customers for different services and areas, you'll need more. This guide compares both options on cost, SEO, ads and maintenance, and gives a simple rule for deciding.

  ## What a one-page website is

  A one-page website puts everything on a single scrolling page: a headline, services, prices, photos, reviews, location and contact buttons. Visitors scroll instead of clicking through menus.

  It's quick to build, cheap to maintain and works very well on phones, where most Indian customers browse. For a new café, salon, home bakery, tutor or freelancer, it answers every question a customer has in under a minute. It also makes an excellent landing page for ads, because there's nowhere to get distracted.

  ## What a multi-page website adds

  A multi-page website gives each topic its own page, typically a home page, one page per service, an about page, a contact page and often a blog or location pages.

  The big advantage is **search visibility**. Google ranks pages, not websites. A page called "Root Canal Treatment in Shivamogga" can rank for that search, while a single page trying to cover ten treatments usually ranks for none of them. More pages also give you room to answer customer questions in detail, show case studies and build trust for higher-priced services.

  ## Side-by-side comparison

  | Factor | One-page website | Multi-page website |
  |---|---|---|
  | Typical cost | Lower | Higher |
  | Build time | Days | Weeks |
  | Google ranking | One main topic | Many services and areas |
  | Ad landing page | Excellent | Needs dedicated pages |
  | Maintenance | Very easy | More content to update |
  | Best for | New, simple, local businesses | Growing, multi-service businesses |

  For typical price ranges, see [website development costs for Bangalore startups](/blog/website-development-cost-bangalore-startups) and [website design costs in Shivamogga](/blog/website-design-cost-shivamogga).

  ## When one page is enough

  A one-page site is usually the right start if:

  - You offer **one main service** or a small, simple menu.
  - Most customers find you through **Google Maps, Instagram or referrals**.
  - You serve a **small local area**.
  - You want to launch **quickly** and test the business first.

  ## When you need multiple pages

  Move to a multi-page site when:

  - You offer **several distinct services**, each with its own customers, such as a clinic with dental, skin and physiotherapy.
  - You want to rank for **different areas**, such as Jayanagar, Koramangala and Whitefield, or Shivamogga and Bhadravathi.
  - Customers research for days before buying, as with schools, builders and B2B services.
  - You plan to publish **articles or guides** to bring search traffic over time.

  Our [SEO plan for a new website](/blog/seo-for-a-new-website-first-90-days) explains how to add pages in the right order.

  ## The smart path: start small, built to grow

  For most new businesses, the best approach is to **launch a strong one-page site now** on a platform that lets you add pages later without starting over. Avoid builders that lock you in or make it hard to create proper service pages with their own titles and URLs.

  Then grow it in this order: separate pages for your two or three best-selling services, a location page if you serve several areas, and finally articles that answer common questions. Each new page should have one clear topic, its own title and a visible call and WhatsApp button.

  Watch your Google Search Console data to decide what to add next. If people find your one-page site by searching for a service you only mention in passing, that's a sign it deserves its own page. The same goes for questions customers keep asking on WhatsApp; each one can become a helpful page or article.

  ## What every website needs, whatever its size

  Whether you choose one page or twenty, a few things are non-negotiable: fast loading on phones, a clear headline saying what you do and where, starting prices, real photos, reviews, and call and WhatsApp buttons that are always visible. Add Google Analytics and Search Console from day one, and make sure the domain and hosting are in your name. A small site with these basics will outperform a large site without them.

  ## Size the website to its job

  There's no prize for the biggest website. A focused one-page site that loads fast, shows prices and makes contact easy will beat a slow ten-page site every time. Start with one page if your business is simple and local, add service and location pages as soon as you want Google to bring you customers, and choose a setup that makes that growth easy.

