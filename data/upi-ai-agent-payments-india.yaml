content: |
  *Updated 24 October 2026. This is a developing story; NPCI hasn't published full specifications, and details may change.*

  Imagine telling an AI assistant: *"Reorder my usual groceries, and keep it under ₹1,500."* It finds the items, places the order and pays with UPI, without you opening an app or typing a PIN for each purchase.

  That's **agentic payments**, and India's payments infrastructure is being prepared for it. Here's what's known, what isn't, and what it means for startups and online businesses.

  ## What's been reported

  - **NPCI is developing a Unified Agent Protocol (UAP)**, a standard to let AI agents make UPI payments. Business Standard first reported the work in July 2026, and Reuters reported the plan in September 2026, citing people familiar with it.
  - **It builds on existing UPI features**, especially **UPI Circle** (delegated payments to trusted people) and **Reserve Pay** (blocking an amount for future debits), so users can **delegate payment authority to AI agents within a pre-set limit**.
  - A **central registry of trusted agents** would sit on top of UPI's existing rails.
  - The first use cases are expected to be **low-value, high-frequency** payments: groceries, routine digital purchases, recharges.
  - The **liability model** (who's responsible when an agent gets it wrong) hasn't been published.

  ## What's already happened

  - In **October 2025**, **Razorpay, NPCI and OpenAI** announced a pilot for **UPI payments inside ChatGPT** conversations, with banks such as Axis Bank and Airtel Payments Bank and merchants such as BigBasket.
  - Payment companies including **Pine Labs** have launched their own agent payment protocols.
  - On WhatsApp, Meta has said its [Business AI](/blog/whatsapp-business-ai-india-guide) will be able to handle **UPI payments in chat** "soon".
  - Google's 2026 announcements included a **Universal Cart** and a commerce protocol to let AI help people shop across retailers.

  The direction is clear even if timelines aren't: **AI assistants are becoming a shopping channel, and UPI is being prepared to pay for it.**

  ## How agentic commerce changes buying

  | Today | With AI agents |
  |---|---|
  | Customer searches, compares, visits sites | Assistant researches and shortlists for them |
  | Customer chooses based on ads, reviews, brand | Assistant chooses based on data it can read: price, availability, delivery time, ratings, policies |
  | Customer pays manually | Assistant pays within a pre-approved limit |
  | Loyalty is to a brand or app | Loyalty may shift to whatever the assistant recommends |

  For businesses, the risk is becoming **invisible** to assistants. The opportunity is being the **easiest option for an assistant to choose**.

  ## How to prepare your business

  **1. Make your product data machine-readable.** Clear product names, prices, sizes, stock status, delivery areas and times, return policies. Use **structured data** (Product, Offer, LocalBusiness schema) on your website, and keep Google Merchant Center feeds accurate if you sell products.

  **2. Keep a reliable online checkout.** UPI, cards and wallets via a trusted gateway; clean mobile checkout; clear order confirmations. Assistants (and customers) avoid flaky checkouts. See [Shopify vs WooCommerce vs custom](/blog/shopify-vs-woocommerce-vs-custom-d2c-india).

  **3. Be readable by AI.** A fast website with clear pages, an About page, consistent business details, and an `llms.txt` file help AI assistants understand you. See [Generative Engine Optimisation for small businesses](/blog/generative-engine-optimization-guide-india).

  **4. Earn trust signals.** Reviews, ratings, clear policies and consistent delivery performance are exactly the signals an assistant will weigh.

  **5. Track AI-driven orders.** Set up attribution for AI referrals now so you can see the shift when it happens. See [tracking ChatGPT and Gemini traffic in GA4](/blog/track-ai-traffic-chatgpt-gemini-ga4).

  **6. Watch the rules.** Data protection obligations under the [DPDP Act](/blog/dpdp-act-compliance-small-business-website) apply to data shared with or through AI agents too.

  ## Which businesses feel it first

  - **Groceries, essentials and quick commerce:** repeat, low-value orders are the first target
  - **Bill payments, recharges and subscriptions**
  - **Food delivery** and reorders
  - **D2C brands** with replenishable products (coffee, personal care, pet food)

  Considered purchases (furniture, courses, healthcare) will likely stay human-led for longer, with AI doing the research.

