content: |
  *Updated 24 October 2026. Details are changing quickly; we link to sources at the end and will update this post as OpenAI publishes more.*

  For two decades, "online ads" in India mostly meant Google and Meta. In late August 2026 a third option arrived: **ads inside ChatGPT**. Millions of Indians now ask ChatGPT what to buy, which course to take or how to fix a problem, and brands can now pay to appear in those conversations.

  If you run a startup in Bangalore or a local business in Shivamogga, this guide explains what's actually known, what isn't, and how to decide whether to spend a rupee on it yet.

  ## What launched, and when

  Indian marketing and business outlets report that:

  - **Ads went live for Indian ChatGPT users on 27 August 2026**, after OpenAI's earlier tests in the US.
  - Ads appear for users on the **Free and Go** plans. Users on **Plus, Pro, Business, Enterprise and Education** plans reportedly don't see ads.
  - A **self-serve ads manager** opened to Indian advertisers in early September 2026 (reports give dates between 31 August and 4 September).
  - Large agency groups were among the first launch partners, and some Indian payment and marketing platforms are offering access as partners.

  OpenAI has said ads are kept separate from ChatGPT's answers: an ad is labelled and shown alongside a response, and it shouldn't change what ChatGPT recommends in the answer itself. That separation matters, and we come back to it below.

  ## How ChatGPT ads work (as reported)

  | Question | What Indian guides report | Confidence |
  |---|---|---|
  | Where do ads show? | Labelled ad units shown with relevant ChatGPT responses | High |
  | Who sees them? | Logged-in Free and Go users in India | High |
  | How are you charged? | Cost per click bidding, with recommended starting bids | Medium |
  | Minimum budget | Around **₹725 per day per campaign** | Medium; check OpenAI's docs |
  | Daily budget behaviour | An average over a week; one day may spend up to about 2× the daily amount | Medium |
  | Custom audiences | Reportedly need a large matched list (tens of thousands of users) | Low to medium |

  Treat the numbers as a starting point, not a quote. OpenAI's own ads documentation is the source of truth and it will change as the product matures.

  ## Who is likely to benefit first

  ChatGPT conversations are long and research-heavy. People ask things like *"Which laptop under ₹60,000 is best for coding?"* or *"How do I start a cloud kitchen in Bangalore?"* That favours businesses where customers **research before buying**:

  - **Education and courses:** coding bootcamps, test prep, upskilling (relevant to our [MERN and DevOps courses](/courses))
  - **Software and SaaS:** tools people compare before signing up
  - **Considered purchases:** electronics, furniture, travel packages, insurance
  - **Professional services:** where the question starts as "how do I..." before "who can do it for me"

  It's less obvious for a Shivamogga bakery or salon. People rarely ask ChatGPT where to get a haircut today; they search Google Maps. For hyper-local, urgent needs, [Google Search ads](/blog/google-ads-shivamogga-guide) and your [Google Business Profile](/blog/google-business-profile-shivamogga-local-seo) still win.

  ## ChatGPT ads vs Google and Meta Ads

  | | Google Search Ads | Meta Ads | ChatGPT Ads |
  |---|---|---|---|
  | Intent | High: people are searching | Low to medium: people are scrolling | Medium to high: people are researching |
  | Local targeting | Very precise | Precise | Still limited and unclear |
  | Maturity | 20+ years of tools and data | Very mature | Weeks old in India |
  | Benchmarks for your industry | Plenty | Plenty | Almost none yet |
  | Best use today | Capturing demand | Creating demand, retargeting | Small, tracked experiments |

  Read [Meta Ads vs Google Ads for startups](/blog/meta-ads-vs-google-ads-for-startups) if you haven't settled your core channels yet. ChatGPT ads should come after those are working.

  ## Should you test ChatGPT ads now?

  **Test it if:**

  - Your customers clearly use ChatGPT to research your category
  - You already have Google or Meta campaigns with known cost per lead to compare against
  - You can afford a few weeks of budget purely as learning
  - Your landing page and tracking are solid

  **Wait if:**

  - You don't yet have [conversion tracking](/blog/ga4-conversion-tracking-setup) working
  - Your business depends on customers within a few kilometres
  - Your total ad budget is small; Google and Meta will usually return more per rupee today

  ## How to run a sensible first test

  1. **Pick one offer** that matches a research question, such as "Free MERN stack career guide" or "Compare our plans".
  2. **Build a dedicated landing page** that answers the question the ad appears next to. See our [landing page checklist](/blog/landing-page-for-ads-that-converts).
  3. **Tag the URL with UTM parameters** (for example `utm_source=chatgpt&utm_medium=cpc&utm_campaign=test-oct`) so GA4 separates it. More in [how to track AI traffic in GA4](/blog/track-ai-traffic-chatgpt-gemini-ga4).
  4. **Set the minimum budget** and run for at least two to three weeks.
  5. **Compare cost per lead and lead quality** against your Google and Meta campaigns, not clicks or impressions.
  6. **Decide:** scale, adjust the offer, or pause and revisit in a few months.

  ## Ads aren't the only way into ChatGPT

  Most of the value of AI assistants for a small business is in the **free, organic answers**. When someone asks "best website design company in Shimoga" or "how much does an MVP cost in India", ChatGPT and similar tools pull from websites, reviews, listings and articles they can read and trust.

  That's earned, not bought. It depends on a clear website, consistent business details, reviews and genuinely useful content. We cover how in [Generative Engine Optimisation for small businesses](/blog/generative-engine-optimization-guide-india).

