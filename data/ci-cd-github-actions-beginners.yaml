content: |
  In a team without CI/CD, someone runs tests on their laptop (sometimes), builds the app by hand and copies files to a server. Mistakes slip through, and releases are stressful. CI/CD automates all of that.

  ## What CI/CD means

  **Continuous Integration (CI):** every time code is pushed, a server automatically installs dependencies, runs tests and builds the app. If anything fails, the team knows immediately.

  **Continuous Delivery / Deployment (CD):** after CI passes, the app is automatically packaged and released to a server, either after a button click (delivery) or fully automatically (deployment).

  ## Why it matters for your career

  Almost every software company uses CI/CD. For freshers, a pipeline on your own project shows you understand how real teams work, which is a skill many candidates lack. It's relevant whether you're aiming for [full stack](/blog/how-to-become-full-stack-developer-2026) or [DevOps](/blog/devops-roadmap-for-beginners) roles.

  ## GitHub Actions in 60 seconds

  GitHub Actions runs workflows defined in YAML files inside `.github/workflows/` in your repository. It's free for public repositories and includes free minutes for private ones.

  - **Workflow:** the whole automated process.
  - **Trigger (`on`):** what starts it, such as a push or pull request.
  - **Job:** a group of steps running on a fresh machine.
  - **Step:** a single command or reusable action.

  ## Your first pipeline

  Create `.github/workflows/ci.yml` in a Node.js or React project:

  ```yaml
  name: CI
  on:
    push:
      branches: [main]
    pull_request:

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm
        - run: npm ci
        - run: npm test --if-present
        - run: npm run build --if-present
  ```

  Push it, then open the **Actions** tab on GitHub. You'll see your pipeline run. Break a test on purpose and watch it fail. That's CI working.

  ## Adding deployment

  Once CI works, add a deploy job that runs only after tests pass:

  - **Frontend:** deploy to Vercel, Netlify, Cloudflare Pages or AWS S3.
  - **Backend:** build a Docker image, push it to a registry, then SSH into your server or update a cloud service.
  - **Secrets:** add keys in **Settings → Secrets and variables → Actions** and use them as `${{ secrets.MY_KEY }}`.

  Use `needs: build` so deploy waits for tests, and limit deployment to the `main` branch.

  ## Good habits

  - Keep pipelines fast; cache dependencies.
  - Run tests and linting on every pull request.
  - Never print secrets in logs.
  - Add a status badge to your README; recruiters notice.

  ## Common beginner mistakes

  - Wrong YAML indentation (YAML is strict).
  - Using `npm install` instead of `npm ci` in pipelines.
  - Hard-coding passwords in the workflow file.
  - Deploying from every branch.

