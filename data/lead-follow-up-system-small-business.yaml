content: |
  You finally got the ads working. The phone buzzes with WhatsApp messages, the website form sends enquiries and Google calls come in. But at the end of the month, sales haven't grown much. Most leads asked a question, got a reply, and disappeared.

  This is one of the most common problems we see in small businesses, and it's rarely about lead quality alone. More often, enquiries are lost because replies are slow, nobody follows up, or details get buried in a busy WhatsApp chat list. The fix doesn't need expensive software. A simple system using WhatsApp Business, a few templates and a basic tracker can noticeably improve how many leads become customers. Here's how to set it up.

  ## Why leads go cold

  When a customer enquires, they're often messaging three or four businesses at once. The first helpful reply tends to win. Leads go cold for a few predictable reasons:

  - **Slow first reply.** A reply after a few hours, or the next day, often arrives after the customer has already decided.
  - **No follow-up.** Many businesses reply once and never message again.
  - **Vague answers.** "Price depends, please call" makes customers move on.
  - **Lost track.** Enquiries get buried among personal and supplier chats.

  ## Step 1: Reply fast with quick replies

  Speed is the easiest win. In **WhatsApp Business**, set up:

  - A **greeting message** that instantly confirms you've received the message and when you'll reply.
  - An **away message** for after hours.
  - **Quick replies** for common questions: prices, location, timings, booking process. Type "/" in a chat to use them.

  Aim to reply personally within minutes during business hours. If you can't, assign someone who can. Our [WhatsApp Business AI guide](/blog/whatsapp-business-ai-india-guide) covers newer automation options.

  Don't forget **missed calls**. Many Indian customers call first, and if nobody answers they simply call the next business on Google Maps. Call back every missed number within the hour, or send a WhatsApp message saying "Sorry we missed your call, how can we help?". Treat each missed call as a lead and label it the same way as a chat.

  Make one person responsible for replying to leads each day. When everyone is responsible, nobody is, and enquiries sit unanswered.

  ## Step 2: Track every lead with labels

  WhatsApp Business lets you add **labels** to chats. Create a simple pipeline:

  1. **New lead**
  2. **Quoted or info sent**
  3. **Follow-up due**
  4. **Won**
  5. **Lost**

  Label every new enquiry immediately. At the end of each day, open "Follow-up due" and message each one. This alone stops most leads from falling through the cracks.

  ## Step 3: Follow up with value, not pressure

  Most sales happen after the second or third contact, but follow-ups shouldn't feel like nagging. A simple sequence:

  - **Day 1:** Answer the question clearly, share the price or range, and suggest a next step.
  - **Day 2 or 3:** Send something useful, such as photos of similar work, a customer review or an answer to a common worry.
  - **Day 6 or 7:** A short, friendly check-in, possibly with a time-limited offer.

  After that, move them to a broadcast list for occasional updates rather than chasing further.

  Here's what a good day-3 follow-up might look like for an interior designer: "Hi Priya, here are three kitchens we finished in HSR Layout this year, with the budgets. Happy to visit your flat this weekend if that helps you decide." It's personal, useful and gives a clear next step, without any pressure. Save a few versions like this as quick replies so they take seconds to send.

  ## Step 4: Keep a simple lead tracker

  Labels show status, but a tracker shows patterns. A Google Sheet with these columns is enough:

  | Date | Name | Phone | Source | Interest | Status | Next follow-up | Value |
  |---|---|---|---|---|---|---|---|

  Record the **source** of each lead, such as Google Ads, Instagram, Google Maps or referral. After a month you'll see which channel brings leads that actually buy, not just leads that enquire. If you use a website form, connect it to your tracker or email so nothing is missed. Proper [GA4 conversion tracking](/blog/ga4-conversion-tracking-setup) helps you match online sources too.

  When volume grows, a simple CRM such as Zoho Bigin or HubSpot's free plan can replace the sheet.

  ## Step 5: Learn from lost leads

  Once a month, look at every lead marked "Lost" and ask why. Common patterns:

  - **Price**: you may need clearer packages, or better targeting to reach the right customers.
  - **Speed**: you were too late; tighten reply times.
  - **Trust**: they chose someone with more reviews or proof; add testimonials and photos.
  - **Wrong fit**: your ads or website attracted the wrong people; adjust the message.

  If many leads are poor quality, review your ad targeting and landing page. See [how to build a landing page that converts](/blog/landing-page-for-ads-that-converts) and [Meta lead ads tips](/blog/meta-lead-ads-guide-small-business).

  ## Every lead deserves a system

  Getting enquiries is only half the job; converting them is where the money is. Reply quickly with quick replies, label every chat, follow up two or three times with something useful, track sources in a simple sheet and learn from the leads you lose. It takes about 20 minutes a day, and for many businesses it raises sales more than doubling the ad budget would.

