content: |
  Launching a business is a hundred decisions at once. The digital side shouldn't be one of the things that keeps you up at night, so here's the complete checklist, **in the order we recommend doing it**.

  Karnataka is a good place to be doing this. The state's Startup Policy 2025–30 aims for **25,000 new startups**, with at least **10,000 outside Bengaluru** ([YourStory](https://yourstory.com/2026/01/karnataka-startup-policy-rs-571-cr-outlay-targets-deeptech-growth-beyond-bengaluru)). Whether you're in Koramangala or Kuvempu Road, the digital foundations are the same.

  ## Phase 1: Foundations (before launch)

  **☐ Lock in your name everywhere.** Check the domain, Instagram handle, LinkedIn page, YouTube channel and Google Business Profile name availability *before* you print anything.

  **☐ Buy your domain.** A `.com` or `.in` that's short, easy to spell and easy to say over the phone. Register it in **your company's name**, not a freelancer's.

  **☐ Set up business email** (Google Workspace or Zoho) on your domain. `hello@yourbrand.in` builds far more trust than a Gmail address.

  **☐ Create a simple brand kit:** logo, two or three colours, fonts and a one-line description of what you do.

  **☐ Set up WhatsApp Business** with a catalogue, greeting message, away message and quick replies.

  **☐ Write your one-liner:** "We help [customer] get [outcome] without [pain]." You'll use it everywhere.

  ## Phase 2: Get found (launch week)

  **☐ Launch a fast, mobile-first website** with:
  - A clear headline that says what you do and where
  - A page per main service or product
  - WhatsApp, call and enquiry buttons on every page
  - Your address, map and hours (for local businesses)
  - A privacy policy page (required for running ads)

  Not sure what it'll cost? Read our [website cost guide for Bangalore startups](/blog/website-development-cost-bangalore-startups).

  **☐ Create and verify your Google Business Profile.** Follow our [local SEO checklist](/blog/google-business-profile-shivamogga-local-seo).

  **☐ Submit your site to Google Search Console** with an XML sitemap, and check that `robots.txt` isn't blocking anything important.

  **☐ Do basic on-page SEO:** a unique title and meta description per page, one H1, descriptive image alt text and internal links.

  **☐ List your business consistently** on Justdial, Bing Places, Apple Maps and relevant industry directories, with the same name, address and phone everywhere.

  ## Phase 3: Measure everything (before you spend)

  **☐ Install Google Analytics 4** and mark key events: form submission, WhatsApp click, call click, booking and purchase.

  **☐ Install the Meta Pixel** and verify your domain in Meta Business Manager.

  **☐ Set up Google Ads conversion tracking**, even if you're not running ads yet. You'll want the history.

  **☐ Create a thank-you page** for form submissions. It makes conversion tracking reliable.

  **☐ Use UTM links** for everything you share: Instagram bio, WhatsApp broadcasts, QR codes on flyers.

  ## Phase 4: Build an audience (first 90 days)

  **☐ Choose one or two social platforms** where your customers actually are.

  **☐ Optimise your profiles:** bio, highlights, link, contact buttons and keywords.

  **☐ Set up content pillars, templates and a posting rhythm** you can keep for 90 days. Here's our [90-day social media framework](/blog/social-media-framework-for-new-business).

  **☐ Start a review routine:** ask every happy customer for a Google review.

  **☐ Publish helpful content:** FAQs, guides and blog posts answering what customers ask you every day.

  ## Phase 5: Accelerate with ads (when you're ready)

  **☐ Pick one platform first.** Our guide to [Meta Ads vs Google Ads](/blog/meta-ads-vs-google-ads-for-startups) helps you decide.

  **☐ Create a dedicated landing page** per campaign.

  **☐ Start with a small test budget**, review weekly, and scale what brings real customers.

  **☐ Respond to leads fast.** Speed of follow-up is part of your ad performance.

  ## Phase 6: Review monthly

  **☐ Check** Search Console queries, Business Profile performance, GA4 conversions, social insights and ad cost per lead.

  **☐ Keep** what works. **Cut** what doesn't. **Test** one or two new ideas every month.

  ## Common launch mistakes to avoid

  1. **A freelancer owns your domain or ad account.** Always keep ownership in your company's name.
  2. **Launching ads before tracking.** You'll never know what worked.
  3. **A beautiful site that's slow on mobile.** Most of your visitors are on phones.
  4. **Being on every platform badly** instead of one platform well.
  5. **Treating launch as a single day.** Online growth compounds over months, so consistency wins.

