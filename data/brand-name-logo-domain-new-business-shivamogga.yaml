content: |
  Most founders spend weeks on a name and a logo, then discover the Instagram handle is taken, the `.com` belongs to someone in another country, or a company in Bangalore already has a trademark on it. Here's how to get it right the first time.

  ## What makes a good business name

  - **Easy to say and spell in Kannada and English.** People will say it on the phone, type it into Google and tell their friends. If you have to spell it out every time, it's costing you customers.
  - **Hints at what you do,** at least at first. "Malnad Spice Co." tells people more than "Zyvora".
  - **Not tied to one street**, if you plan to open more branches or sell online.
  - **Short.** Two or three words at most.
  - **Not too close to a competitor** in Shivamogga.

  Think about whether you want to include "Shivamogga" or "Shimoga" in the name. It can help locally, but it limits you if you expand.

  ## The five availability checks

  Before you print anything, check that the name is free as:

  1. **A domain.** `.com` or `.in` are best for most businesses. Avoid hyphens and odd spellings.
  2. **Instagram and Facebook handles**, ideally the exact name or a close variant.
  3. **A company or LLP name**, on the MCA portal, if you're incorporating.
  4. **A trademark.** Search the official trademark registry in your class of goods or services.
  5. **On Google Maps** in Shivamogga, so you're not confused with an existing business.

  If any of these fail, it's much cheaper to change the name now than after signboards are made.

  ## Register the domain properly

  - Buy it from a reputable registrar **in your own name, with your own email**
  - Turn on **auto-renew**, since expired domains get bought by others
  - Add a **business email** on the domain (like `hello@yourbusiness.in`), which looks far more professional than a Gmail address

  Never let a designer or agency register the domain in their account. If you fall out, you can lose your website and email. We explain this in our [domain, hosting and email guide](/blog/domain-hosting-business-email-guide-shivamogga).

  ## What your logo actually needs to do

  A logo doesn't have to be clever. It has to be:

  - **Readable small**, as an Instagram profile picture, WhatsApp display picture and favicon
  - **Clear in one colour**, for stamps, bills and embroidery
  - **Work on signage**, often seen from a moving vehicle on a busy road

  Ask for versions: full logo, icon only, and light and dark backgrounds.

  ## A launch-ready brand kit

  You don't need a 50-page brand book. You need:

  - **Logo** in the versions above
  - **2–3 colours**, written down as exact codes
  - **1–2 fonts**, one for headings and one for body text
  - **Real photos** of your place, products and team
  - **A one-line description**: what you do, for whom, where

  Then use them **consistently**: signboard, Google profile, Instagram, website, visiting cards, bills, packaging and WhatsApp. Consistency is what makes a small business look established.

  ## A note on your Google Business Profile name

  Use your **real business name exactly as it appears on your signboard**. Adding keywords ("XYZ Bakery Best Cakes in Shivamogga") breaks Google's guidelines and can get your profile suspended.

  ## Launch with a consistent brand everywhere

  Our [Startup Launch Package](/startup-launch-package) sets up your website, domain, business email, Google profile and social media with one consistent brand, all registered in your name. See also [how to start a business in Shivamogga](/blog/how-to-start-a-business-in-shivamogga).
