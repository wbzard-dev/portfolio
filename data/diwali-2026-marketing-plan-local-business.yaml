content: |
  *Updated 24 October 2026. Diwali (Deepavali) 2026 is on Sunday, 8 November.*

  Diwali 2026 falls on **8 November**, roughly three weeks later than last year because of the leap month in the Hindu calendar. That changes the rhythm: big online sales like Flipkart's Big Billion Days started in early October, but local buying peaks in the final two weeks before the festival.

  If you run a sweet shop in Shivamogga, a bakery in Jayanagar, a boutique, a salon, a gift business or a D2C brand, **the next 14 days matter most**. Here's a focused plan.

  ## What the 2026 festive numbers tell us

  - **E-commerce order volumes rose 31%** year on year in the first week of 2026 festive sales, according to Unicommerce data reported in October.
  - **Quick commerce orders jumped 85%** in the same comparison, while average order value fell around 10%: more, smaller, last-minute orders.
  - Shoppers increasingly buy **diyas, sweets, dry fruits, gifts and décor** on quick commerce apps like Blinkit, Zepto and Swiggy Instamart.

  **What that means for local businesses:** customers expect **speed and convenience**. If you can't deliver in 30 minutes, compete on what apps can't do: freshness, customisation, local trust, personal service and same-day pickup.

  ## The two-week plan

  ### Days 1–2: Get found (Google)

  Diwali searches are local and urgent: "sweet shop near me", "Diwali gift hampers Bangalore", "crackers shop Shimoga", "salon open on Diwali".

  - **Update your Google Business Profile:** festive hours (including Diwali day and the days around it), new photos of festive products, a post with your offer
  - **Add products** with prices if your category supports it
  - **Reply to every recent review**, and ask happy customers for new ones ([how](/blog/how-to-get-more-google-reviews))
  - **Check your phone number and WhatsApp link work**

  See the [Google Business Profile checklist](/blog/google-business-profile-shivamogga-local-seo).

  ### Days 2–4: Build one clear Diwali offer

  One strong offer beats ten weak ones:

  - **Sweet shops and bakeries:** pre-order gift boxes with a pickup slot; corporate bulk orders
  - **Boutiques and jewellery:** festive collection preview, free alterations or gift wrap
  - **Salons:** pre-Diwali packages with a booking deadline
  - **Gifting and D2C brands:** curated hampers in three price points
  - **Home services:** deep cleaning and painting slots before the festival

  Add a **deadline** ("orders close 5 November") and a **limit** ("only 100 boxes") to encourage action.

  ### Days 3–7: WhatsApp, your best channel

  Your opted-in customers are the cheapest audience you'll ever reach.

  - **Broadcast your offer** with a photo and a price, plus a clear way to order
  - **Update your catalogue** with festive items
  - **Post WhatsApp Status daily**: preparation, packing, new arrivals
  - **Set quick replies** for prices, pickup and delivery areas
  - **Switch on [WhatsApp Business AI](/blog/whatsapp-business-ai-india-guide)** (if available) so late-night enquiries get answered

  Only message people who opted in, and give an easy way to stop messages; India's data protection rules are phasing in ([DPDP checklist](/blog/dpdp-act-compliance-small-business-website)).

  ### Days 3–12: Reels and Stories

  Short, real videos outperform polished posters during festivals:

  - Sweets being made, boxes being packed
  - Shop décor and lights being put up
  - "What ₹1,000 gets you" gift hamper reveals
  - Staff wishing customers Happy Deepavali in Kannada and English ([language tips](/blog/kannada-vs-english-social-media-content))
  - Customer pickups and reactions (with permission)

  Always tag the location and mention your area. More ideas: [30 reel ideas for cafés and restaurants](/blog/instagram-reel-ideas-cafes-restaurants-bangalore).

  ### Days 5–13: Small, targeted Meta ads

  - **Radius:** 3–5 km for a shop in Bangalore; wider for Shivamogga city plus nearby towns
  - **Creative:** your best performing Reel from organic
  - **Objective:** messages (click-to-WhatsApp) or leads
  - **Budget:** a modest daily amount, increased in the last five days
  - **Retarget** people who watched your Reels or visited your website

  Check your ad settings: Meta is switching on [product browsing](/blog/meta-product-browsing-ads-october-28) for existing ads from 28 October unless you opt out.

  ### Days 10–14: The last-minute rush

  - Post **"still available"** updates and same-day pickup slots
  - Push **gift cards or vouchers** for people who missed the deadline
  - Keep replying fast. Speed wins the last-minute buyer

  ### After Diwali: Don't stop

  - **Thank customers** and ask for reviews
  - **Save every number** that opted in for future festivals
  - **Note what worked:** which offer, which Reel, which ad, how many orders
  - Plan for **Christmas, New Year and Sankranti** using the same playbook

  ## Should you sell on quick commerce apps?

  For packaged products (sweets, dry fruits, décor, gifting), listing on quick commerce or marketplaces can add volume, but margins are thinner and you compete on price. For most small businesses, the better move this year is **owning the relationship**: WhatsApp, Instagram and your Google profile. If you want to sell online year-round, see [how local shops can sell online](/blog/retail-shop-sell-online-shivamogga) and [e-commerce platform options](/blog/shopify-vs-woocommerce-vs-custom-d2c-india).

