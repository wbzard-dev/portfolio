content: |
  Bangalore is full of people with skills others will pay to learn: engineers, designers, product managers, marketers, data scientists, finance experts and coaches. Online courses and live cohorts let you teach students across India from home, and many professionals start one alongside their job.

  ## Part 1: Shape the idea

  **Sell a transformation, not a topic.** "Learn Python" competes with thousands of free videos. "Go from Excel to your first data analyst job in 60 days" is a promise people pay for.

  **Find the overlap** between what you're genuinely good at, what people already ask you for help with, and what learners will pay for, usually because it leads to a job, promotion, income or saved time.

  **Pick a format.**

  - **Live cohort**: a fixed batch with live classes, assignments and community. Higher completion and price
  - **Recorded course**: scales easily, but completion rates are typically low
  - **Hybrid**: recorded lessons plus live doubt sessions and reviews
  - **Workshops**: one-day or weekend intensives, a great way to test demand
  - **1:1 or small-group coaching**: premium, limited capacity

  **Validate with a pilot.** Run a paid workshop or pilot cohort for 10–30 people before recording anything. Their questions and results will shape the full course.

  ## Part 2: Execution

  **Curriculum.** Work backwards from the outcome: what must students be able to do at the end? Build modules, assignments and projects toward that. Keep it practical.

  **Tools.** You don't need a custom platform to start:

  - A **landing page** with the outcome, curriculum, schedule, instructor background, fees and FAQs
  - **Payment links** with UPI and cards
  - **Video calls** for live sessions, with recordings
  - A **community** group for discussion and support
  - Later: a course platform or custom learning portal once you have steady batches

  **Business setup.** Register the business, open a current account, check GST requirements with your CA, and publish clear refund terms.

  **Pricing.** Based on the value of the outcome and your format. Early-bird pricing for the first cohort rewards those who trust you first.

  ## Part 3: Your first students

  - **Free content** that shows your expertise: LinkedIn posts, YouTube videos, Instagram Reels, newsletters
  - **Free webinar or workshop → paid cohort**, one of the most reliable course funnels
  - **Student results and testimonials** from your pilot, shared with permission
  - **Partnerships** with communities, colleges and companies for group enrolments
  - **Meta and Google ads** to the landing page or webinar, once your conversion rate is known
  - **Referral rewards** for past students

  ## Your 30-day kickstart plan

  - **Week 1:** outcome, audience and pilot format defined; curriculum outline
  - **Week 2:** landing page with payments and FAQs; free content started
  - **Week 3:** free workshop promoted to your network and communities
  - **Week 4:** pilot cohort begins; collect feedback and results

