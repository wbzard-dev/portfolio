content: |
  Every year, engineering, BCA, BSc and MCA graduates from colleges across Shivamogga (JNNCE, PESITM, Kuvempu University and many more) face the same question: *do I need to move to Bangalore to get into software?*

  For your first job, you may end up relocating, or you may not, since remote and hybrid roles are common. But **learning** the skills that get you hired doesn't require moving. Here's a practical roadmap.

  ## Why full stack (MERN) is a good starting point

  A **full stack developer** builds both what users see (the frontend) and what runs behind it (the backend and database). The **MERN stack**, **M**ongoDB, **E**xpress, **R**eact and **N**ode.js, is popular because it uses **one language, JavaScript, across the whole app**. That means less to learn before you can build something real.

  New to the term? Read [What is the MERN stack?](/blog/what-is-mern-stack)

  ## The roadmap, in order

  ### Step 1: Fundamentals (1–2 weeks)
  - How the web works: browsers, HTTP, DNS, APIs
  - HTML and CSS basics
  - **Git and GitHub**, used from day one for everything you build

  ### Step 2: JavaScript (2–3 weeks)
  - Variables, functions, arrays, objects
  - Modern JS: arrow functions, destructuring, modules
  - **Async JavaScript**: promises, async/await, fetch

  ### Step 3: React (2–3 weeks)
  - Components, props, state and hooks
  - Forms, routing, calling APIs

  ### Step 4: Node.js, Express & MongoDB (2–3 weeks)
  - Building REST APIs with Express
  - Modelling data in MongoDB
  - Authentication basics

  ### Step 5: Deployment (1 week)
  - Environment variables and builds
  - Deploying frontend and backend so your app is **live on the internet**

  Learn **DevOps basics** later to stand out further: Docker, CI/CD and cloud. See our [DevOps roadmap for beginners](/blog/devops-roadmap-for-beginners).

  ## Projects: what actually gets you hired

  Certificates help, but **projects you can explain** get interviews. Build three, each harder than the last:

  1. **A guided full-stack app**, such as a task manager or notes app with login
  2. **A real-world app**: an appointment booking system for a Shivamogga clinic, a menu and ordering site for a café, or a college event portal
  3. **A capstone of your own idea**, built end to end

  For each: put it live on the internet, keep the code clean on GitHub, and write a short README explaining what it does and how you built it.

  ## Getting hired from Shivamogga

  - **Resume:** one page, ATS-friendly, projects with live links at the top
  - **LinkedIn:** a clear headline ("Full Stack Developer | MERN"), and post about what you build
  - **Mock interviews:** practise explaining your projects and core JavaScript concepts out loud
  - **Apply widely:** remote roles, startups, service companies, and local businesses that need developers
  - **Freelance small projects** for local businesses; Shivamogga has plenty that need websites

  ## Learning online vs moving for a course

  You don't need to move to Bangalore and pay rent to learn. A good **live online** course gives you structure, deadlines, feedback and recordings to rewatch, from home.

  What to look for in any course:

  - Live sessions with real people, not just recorded videos
  - **Deployed projects**, not just theory
  - Interview preparation and resume help
  - A fee that matches what you get

