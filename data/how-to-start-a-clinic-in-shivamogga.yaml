content: |
  Shivamogga already has large hospitals and a medical college, but families across the district still travel for specialists, physiotherapy, dental work, dermatology, paediatrics and diagnostics. A focused clinic closer to home saves them a day's travel. Here's how to open one properly.

  *This is a practical overview, not legal or medical-regulatory advice. Confirm current requirements with the District Health Office and your CA.*

  ## Step 1: Decide the type of clinic

  - **General practice or family clinic**
  - **Specialist clinic**: paediatrics, dermatology, ENT, gynaecology, orthopaedics
  - **Dental clinic**
  - **Physiotherapy and rehabilitation**
  - **Diagnostic centre or lab collection point**
  - **Ayurveda, homeopathy or wellness**

  Each has different equipment, space and licensing needs, so settle this first.

  ## Step 2: Choose the location

  Look for:

  - **Residential neighbourhoods** where your patients live, or main roads they already use
  - **Ground-floor access** for elderly patients, with space for two-wheeler and auto drop-off
  - **Proximity to labs and pharmacies** if you don't run your own
  - **A name board that's visible from the road**

  Areas like Vinoba Nagar, Gopala, Durgigudi, Kuvempu Road and around the major hospitals each serve different populations.

  ## Step 3: Registrations

  - **KPME registration**: private medical establishments in Karnataka must register under the Karnataka Private Medical Establishments Act with the district authority
  - **Your professional registration** with the Karnataka Medical Council, Dental Council or the relevant AYUSH board
  - **Biomedical waste management** authorisation and a tie-up with an authorised waste handler
  - **Trade licence** from Shivamogga City Corporation and shop registration
  - **Pharmacy (drug) licence** if you dispense medicines, and **AERB registration** for X-ray equipment
  - **Fire NOC** depending on building size

  ## Step 4: Setup and equipment

  Keep it clean, bright and simple: a waiting area with seating, a consultation room with privacy, an examination area, and storage for records. Use a simple clinic management or appointment app instead of paper registers from day one; it makes follow-ups and reminders easy.

  ## Step 5: Fees and timings

  Look at what other clinics in your area charge for a consultation and follow-up. Keep fixed, predictable timings, including a morning and an evening slot, because many patients come after work. Put fees and timings on your board, Google profile and website.

  ## Step 6: Getting your first patients (ethically)

  Doctors can't advertise like a shop, but they can make sure patients find accurate information. That's most of what works:

  1. **Google Business Profile** with the right category, your qualifications, timings, phone, photos of the clinic, and appointment link. Most patients searching "dermatologist near me" or "child specialist in Shivamogga" decide from this
  2. **A simple website** with your qualifications, services, timings, location map and appointment button
  3. **Referrals** from other doctors, pharmacies and labs nearby; introduce yourself in person
  4. **Health camps** and talks in schools, apartments and offices
  5. **Educational content** on Instagram or YouTube in Kannada: common symptoms, when to see a doctor, prevention

  Follow National Medical Commission guidelines: no cure promises, no before-and-after claims, no patient testimonials without written consent.

  ## Step 7: Reviews and follow-ups

  After a visit, send a WhatsApp message with any instructions, the follow-up date, and your Google review link. Patients trust doctors other patients trust.

