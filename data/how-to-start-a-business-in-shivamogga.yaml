content: |
  Shivamogga is a good place to start a business. Costs are lower than Bangalore, people are loyal to businesses they trust, and in many categories there are still only a handful of serious players. But new owners often get the order wrong: they print visiting cards before choosing a name they can actually register, or open the shop before anyone can find it on Google.

  Here's the sequence we recommend to founders in Shivamogga, Bhadravati, Sagar and nearby towns.

  *This is a practical overview, not legal or tax advice. Rules and fees change, so confirm details with a chartered accountant and the official portals before you file.*

  ## Step 1: Pick your business structure

  | Structure | Good for | Things to know |
  |---|---|---|
  | **Sole proprietorship** | Shops, freelancers, single-owner services | Fastest and cheapest; you are personally liable |
  | **Partnership** | Two or more people running a local business | Needs a partnership deed; register it for better legal standing |
  | **LLP** | Professional firms, small partner-run companies | Limited liability with lighter compliance than a company |
  | **Private limited company** | Startups planning to raise investment | Most compliance, but investors and DPIIT recognition expect it |

  If you're opening a shop, clinic, café or agency, a proprietorship or partnership is usually enough to start. If you plan to raise money or build a product for all of India, talk to a CA about a private limited company early.

  ## Step 2: Choose a name you can own everywhere

  Before you register anything, check that the name is free as:

  - a **domain** (ideally `.com` or `.in`)
  - an **Instagram and Facebook handle**
  - a company or LLP name (on the MCA portal, if you're incorporating)
  - and that it isn't a registered **trademark** in your category

  We cover this in more detail in [how to pick a brand name, logo and domain](/blog/brand-name-logo-domain-new-business-shivamogga).

  ## Step 3: The registrations most Shivamogga businesses need

  **Trade licence.** Most commercial activities inside city limits need a trade licence from the **Shivamogga City Corporation** (Mahanagara Palike). Towns like Bhadravati and Sagar have their own municipal bodies.

  **Shop & establishment registration.** Shops and offices register under the **Karnataka Shops and Commercial Establishments Act** with the Labour Department.

  **Udyam registration (MSME).** Free, online, and done at the official Udyam portal with your Aadhaar and PAN. It makes you eligible for MSME schemes, collateral-free lending programmes and protection against delayed payments from buyers.

  **GST.** Mandatory once your turnover crosses the threshold (different for goods and services), and in some cases regardless of turnover, for example certain inter-state or online sales. Many businesses register voluntarily so they can sell to other GST-registered businesses.

  **FSSAI.** Any food business (restaurant, bakery, home kitchen, sweet shop, packaged food) needs FSSAI registration or a licence depending on size.

  **Current account.** Open a separate bank account in the business name. It keeps your books clean and is often required for payment gateways.

  Depending on your trade you may also need a fire NOC, pollution board consent, a drug licence (pharmacies) or professional registrations (clinics). Your CA will tell you which apply.

  ## Step 4: Get found online before you open

  This is where most new businesses lose their first three months. In Shivamogga, customers check Google Maps, Instagram and WhatsApp before they walk in. Do these **before launch day**:

  1. **Google Business Profile** with the correct category, pin, hours, phone and photos. See our [Google Business Profile checklist for Shivamogga](/blog/google-business-profile-shivamogga-local-seo).
  2. **WhatsApp Business** with a catalogue, greeting message and quick replies.
  3. **Instagram** with 9–12 posts ready, so the profile doesn't look empty.
  4. **A simple website** with your services, location and a WhatsApp button. A 4–6 page site is enough; see [what a website costs in Shivamogga](/blog/website-design-cost-shivamogga).

  ## Step 5: Plan your first 90 days of marketing

  Decide your launch budget, your first offer and how you'll measure enquiries. Our guide to [getting your first 100 customers in Shivamogga](/blog/first-100-customers-shivamogga-business) walks through it.

  ## A simple launch timeline

  - **4–6 weeks before opening:** structure, name, domain, registrations, bank account
  - **3 weeks before:** website, Google Business Profile, WhatsApp Business, Instagram
  - **1–2 weeks before:** photos of the real place, launch offer, local ads ready
  - **Launch week:** ads live, ask first customers for Google reviews

  ## Need help with the online part?

  Registrations are your CA's job. Getting customers is ours. Our [Startup Launch Package](/startup-launch-package) sets up your website, Google profile, social media and ads in one plan for [new businesses in Shivamogga](/locations/shivamogga).
