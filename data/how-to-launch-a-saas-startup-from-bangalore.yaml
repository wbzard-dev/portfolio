content: |
  Bangalore gives tech founders unusual advantages: experienced engineers, active founder communities, investors, and thousands of companies that might be your first customers. It also gives you a lot of noise: advice, events and the temptation to build for a year before showing anyone.

  ## Part 1: Shape the idea

  **Fall in love with the problem, not the product.** Write it down in one sentence: *"[Who] struggles with [what], which costs them [time, money or risk]."* If you can't, the idea isn't ready.

  **Talk to 20+ potential customers.** Ask about their current workflow, what they've tried, what they pay for today and what frustrates them. Listen for urgency: problems people are already spending money or time on.

  **Look at alternatives honestly.** Spreadsheets, WhatsApp groups and manual work are your real competitors more often than other startups.

  **Validate before building.** Put up a **landing page** that describes the outcome, shows a mockup and asks for a waitlist signup, a demo call or a pre-order. Drive targeted traffic through communities, LinkedIn and a small ad test. Signups with real work emails and calls booked are strong signals.

  ## Part 2: Execution

  **Company setup.** If you plan to raise investment, a **private limited company** is usually expected. Consider **DPIIT startup recognition** and Karnataka's startup programmes. Talk to a CA about founder agreements, equity vesting and IP assignment early.

  **Scope the MVP ruthlessly.** Identify the **one workflow** that solves the core problem. Cut everything else: settings pages, complex roles, integrations nobody asked for. A good MVP is embarrassing in features and excellent at one job.

  **Website first, app later?** Most SaaS products start as a **web app**: faster to build, easier to update, no app store approvals. Read [website or app first?](/blog/website-or-app-first-for-startups)

  **Build in weeks, not months.** Timebox the first version. Use proven frameworks and managed services so engineering time goes into the product, not infrastructure.

  **Instrument everything.** Product analytics, error tracking and a simple way for users to send feedback from inside the app.

  For costs, see [MVP development cost in India](/blog/mvp-development-cost-india).

  ## Part 3: First paying users

  - **Founder-led sales.** Your first 10 customers usually come from your own outreach: LinkedIn, warm intros, and the people you interviewed
  - **Design partners.** Offer a few early companies a discount in exchange for weekly feedback
  - **Communities.** Bangalore's founder and industry meetups, Slack and Discord groups, and LinkedIn. Be useful, don't spam
  - **Content and SEO.** Write about the problem you solve. It compounds over months
  - **A credible marketing site**: clear value proposition, use cases, pricing (or "contact us"), security information and a demo booking flow
  - **Launch platforms** like Product Hunt for visibility, once the product is stable

  Charge from the start, even a small amount. Paying users give you honest feedback.

  ## Your 30-day kickstart plan

  - **Week 1:** problem interviews; landing page with waitlist live
  - **Week 2:** MVP scope frozen; outreach to design partners
  - **Week 3:** MVP build sprint; marketing site and tracking set up
  - **Week 4:** first users onboarded; feedback loop and weekly release rhythm

  ## Where a launch partner fits

  Technical founders often build a great product and a weak launch; non-technical founders often struggle to get the product built at all. Either way, the gap is the same: someone who can **build the MVP and launch it** with a marketing site, tracking and the first campaigns, without hiring a full team.

