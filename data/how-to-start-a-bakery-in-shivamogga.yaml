content: |
  Every family in Shivamogga celebrates birthdays, anniversaries, naming ceremonies and festivals, and most of those celebrations need a cake. That's why so many home bakers here are busy every weekend. A bakery can start in your kitchen with little investment and grow into a shop once orders are steady.

  ## Step 1: Home bakery or shop?

  **Home bakery** is the low-risk way to start. You take custom orders, bake at home and deliver or have customers pick up. You can test your menu and prices before signing a lease.

  **A shop or café-bakery** needs footfall: daily bread, puffs, cookies, snacks and a display of ready cakes. It needs more money, staff and a good location, but gives walk-in sales.

  Most people should start at home, build 6–12 months of orders and reviews, and then open a shop.

  ## Step 2: Choose your specialty

  - **Custom theme cakes** for birthdays and events
  - **Eggless cakes**: important for many families in Shivamogga
  - **Healthy bakes**: millet, jaggery, whole wheat, sugar-free
  - **Cookies, brownies and gift hampers** for festivals and corporate gifting
  - **Bread and daily items** (needs a shop and early mornings)

  ## Step 3: FSSAI and registration

  Every food business, including a home kitchen, needs **FSSAI registration** (small businesses) or a **licence** (larger turnover). Apply online on the FoSCoS portal. For a shop, add a **trade licence** from Shivamogga City Corporation, shop registration, and **GST** once over the threshold.

  Put your FSSAI number on your packaging, Instagram bio and website. Customers notice.

  ## Step 4: Equipment

  For a home bakery: a good OTG or convection oven, mixer, scale, moulds and turntables, piping tools, a fridge with space for cakes, and boxes. A shop adds a deck oven, display chillers and a work table.

  ## Step 5: Pricing

  Calculate the cost of every ingredient, box, gas, electricity and delivery for each item, then add your margin. Price cakes by weight plus design complexity (a fondant cake takes hours more than a cream cake). Always take a **50% advance** for custom orders.

  ## Step 6: Getting orders

  1. **Instagram** is your shop window: clear photos and Reels of every cake, with flavours and price ranges in highlights
  2. **WhatsApp Business** with a catalogue and quick replies for flavours, sizes and delivery areas
  3. **Google Business Profile** so "cake shop near me" and "custom cakes in Shivamogga" searches find you (you can hide your home address and show a service area)
  4. **Festival boxes** for Diwali, Christmas and Raksha Bandhan, and corporate gifting for offices
  5. **Tie-ups** with event planners, decorators and photographers
  6. **Small Instagram ads** around Valentine's Day, Christmas and New Year

  ## Step 7: Reviews and repeat orders

  Ask every customer to send a photo of the cake at the party and to leave a Google review. Save birthdays and anniversaries and send a reminder a week before next year. Repeat orders are your best growth.

