title: "How to Upgrade WordPress to PHP 8.3 or 8.4 Safely: A Step-by-Step Checklist"
seoTitle: "Upgrade WordPress to PHP 8.3 or 8.4 Safely (Checklist)"
metaDescription: "Upgrade WordPress from PHP 7.4, 8.1 or 8.2 to PHP 8.3 or 8.4 safely: backups, staging, compatibility checks, testing and rollback."
date: "2026-10-24"
author: "Vivek"
excerpt: "Upgrading PHP is the most important security step most WordPress sites can take this year, and the one owners fear most. Done in the right order, it's low-risk. Here's the checklist we use."
takeaways:
  - "Upgrade PHP on a staging copy first, never directly on a live site without a backup."
  - "Update WordPress core, plugins and themes before changing the PHP version, because newer releases support newer PHP."
  - "Plugins and themes not updated in over a year are the most common cause of errors after a PHP upgrade."
  - "Test lead forms, checkout, logins, the admin area and page builders after switching, and check the error log."
  - "If something breaks, switching back to the previous PHP version usually restores the site immediately."
