content: |
  A startup marketing plan doesn't need to be long. It needs to answer three questions: who are we trying to reach, where are they, and what will we do this month to reach them. Here's the six-month plan we use as a starting point with new founders in Bangalore and Shivamogga.

  ## Before you start: one page of basics

  Write down:

  - **Ideal customer:** who they are, what problem they have, where they look for solutions.
  - **Offer:** what you sell, at what price, and why someone should pick you.
  - **Goal for month six:** a number, such as 50 paying customers or ₹5L monthly revenue.
  - **Budget:** monthly marketing budget including ad spend.

  ## Month 1: Set up the foundations

  - Launch a focused website or landing page. See [website or app first](/blog/website-or-app-first-for-startups).
  - Install GA4, Meta Pixel and conversion tracking. [How to set up GA4 conversions](/blog/ga4-conversion-tracking-setup).
  - Create and verify your [Google Business Profile](/blog/google-business-profile-shivamogga-local-seo) if you serve local customers.
  - Set up Instagram, LinkedIn or both, depending on your audience.
  - Set up [WhatsApp Business](/blog/whatsapp-business-app-vs-api) with quick replies.
  - Add your business to [key listing sites](/blog/business-listing-sites-india).

  **Goal:** everything live, tracked and consistent.

  ## Month 2: Get the first customers by hand

  - Message your personal and professional network directly.
  - Ask early customers for referrals and [Google reviews](/blog/how-to-get-more-google-reviews).
  - Post 3–4 times a week on one platform using a [content framework](/blog/social-media-framework-for-new-business).
  - Publish your first two blog posts answering common customer questions.

  **Goal:** first 10 customers and honest feedback.

  ## Month 3: Run one paid test

  - Pick **one** ad channel: Google if people search for your service, Meta if they need to discover it. [Meta vs Google for startups](/blog/meta-ads-vs-google-ads-for-startups).
  - Set a fixed test budget, often ₹15,000–₹30,000 for the month.
  - Send ad traffic to a [landing page built for conversions](/blog/landing-page-for-ads-that-converts).
  - Follow up every lead within an hour. A [simple follow-up system](/blog/lead-follow-up-system-small-business) matters more than the ad.

  **Goal:** a real cost per enquiry and cost per customer.

  ## Month 4: Double down or change course

  - If the ad test produced customers profitably, increase budget gradually.
  - If not, change one thing: audience, offer, creative or landing page.
  - Review which posts brought DMs and enquiries, and make more like them.
  - Add two more SEO articles and one new service or location page.

  ## Month 5: Add a second channel

  - Add the second ad platform, or start retargeting website visitors.
  - Try one partnership: a complementary business, a community or a local event.
  - Collect testimonials and short video reviews.

  ## Month 6: Review and plan the next six months

  - Compare each channel's cost per customer.
  - Cut what isn't working.
  - Decide whether you need more budget, more content or an in-house hire. See [agency vs freelancer vs in-house](/blog/agency-vs-freelancer-vs-in-house-marketing).

  ## The five numbers to track every month

  | Metric | Why it matters |
  |---|---|
  | Enquiries | Calls, forms and WhatsApp chats from all channels |
  | Cost per enquiry | Ad spend divided by enquiries |
  | Conversion rate | Share of enquiries that become customers |
  | Customers | New paying customers this month |
  | Revenue per customer | Decides how much you can spend to win one |

