id: "php2shell-patch-vps-ubuntu-php-fpm"
title: "How to Patch PHP2Shell on a VPS: Ubuntu, Debian, RHEL and PHP-FPM Step by Step"
seoTitle: "Patch PHP2Shell on a VPS: Ubuntu, Debian & PHP-FPM Guide"
metaDescription: "Patch PHP2Shell on your VPS: update PHP on Ubuntu, Debian or RHEL, restart PHP-FPM and Apache, apply php.ini mitigations and verify."
date: "2026-10-24"
author: "Vivek"
excerpt: "If your website runs on a VPS from DigitalOcean, AWS, Azure, Hostinger VPS or similar, nobody is patching PHP2Shell for you. Here's how to update PHP, restart the right services and verify the fix."
takeaways:
  - "On a VPS or dedicated server you are responsible for updating PHP; hosts patch shared plans, not self-managed servers."
  - "Update PHP through your package source (distribution repositories, Ondřej Surý's PPA on Ubuntu, or Remi on RHEL-family systems) to a patched build."
  - "Restart every PHP process after updating, including PHP-FPM, Apache with mod_php, queue workers and long-running app servers."
  - "If you cannot patch at once, set session.upload_progress.enabled to 0 and an unoverridable memory_limit in php.ini or the FPM pool, then restart."
  - "Distribution packages may keep the old version number with the fix backported, so verify using the package version and vendor advisory."
