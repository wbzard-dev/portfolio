content: |
  "Where do I get money to start?" is the second question every founder asks, right after "Will this work?". In Shivamogga, the answer is rarely a venture capital fund. It's usually a mix of **savings, a bank loan backed by a government scheme, and early sales**.

  Here's a plain-language map of the options.

  *Important: scheme limits, subsidies and eligibility rules change. Treat this as a starting point, then check the official portal, your bank and the District Industries Centre (DIC) in Shivamogga before you apply.*

  ## First: what kind of business are you?

  | Business type | Typical funding route |
  |---|---|
  | Shop, café, salon, clinic, service business | Savings + bank loan (Mudra or regular MSME loan) |
  | Small manufacturing or food processing unit | PMEGP or MSME loan, plus state schemes |
  | Agri-processing, areca or spice products | MSME loans, agri-processing schemes, DIC guidance |
  | Tech product or app aiming for all of India | Bootstrapping, incubators, Startup India and state grants, then angels |

  ## Mudra loans (PMMY)

  The **Pradhan Mantri Mudra Yojana** provides collateral-free loans to micro and small businesses through banks, NBFCs and microfinance institutions. Loans are grouped into categories (Shishu, Kishore, Tarun and Tarun Plus) by loan size, from small amounts for very early businesses up to larger loans for established ones.

  **Good for:** shops, service businesses, small traders, home businesses scaling up.
  **How:** apply through your bank with a simple business plan and KYC.

  ## PMEGP

  The **Prime Minister's Employment Generation Programme** gives a **margin-money subsidy** on bank loans for new units in manufacturing and services. The subsidy percentage is higher for rural areas and for special categories such as women, SC/ST and ex-servicemen.

  **Good for:** first-time entrepreneurs starting a new manufacturing or service unit, including food processing and small workshops.
  **How:** apply online on the PMEGP portal. The District Industries Centre and KVIB in Shivamogga help with applications.

  ## Stand-Up India

  Supports **women and SC/ST entrepreneurs** with bank loans for greenfield (new) enterprises in manufacturing, services, trading or agri-allied activities.

  ## Startup India and the Seed Fund Scheme

  If you're building an innovative, scalable product, a private limited company or LLP can apply for **DPIIT startup recognition**. Benefits include tax and compliance relaxations and eligibility for the **Startup India Seed Fund Scheme**, which provides early-stage funding for proof of concept, prototypes and market entry **through approved incubators**.

  **Good for:** tech, product and innovation-led startups, not traditional shops or services.

  ## Karnataka state programmes

  Karnataka has one of India's most active startup ecosystems, and the state runs programmes such as **Elevate** grant funding for early-stage startups through Karnataka Innovation and Technology Society (KITS), along with incubation support. Check the Karnataka Startup Cell's official website for current calls and eligibility.

  For MSMEs, the **District Industries Centre in Shivamogga** is the best local starting point for state subsidies and schemes.

  ## Bootstrapping: still the most common route

  Most successful Shivamogga businesses started small and grew from revenue:

  - Start with the **smallest version** that can take money: a WhatsApp catalogue before a shop, a pilot batch before a factory
  - **Pre-sell** to early customers or take advance orders
  - Keep fixed costs low: rent, salaries and EMIs are what kill new businesses

  Read [how to validate your business idea in Shivamogga](/blog/validate-business-idea-shivamogga) before borrowing.

  ## What every lender or scheme will ask for

  - A **business plan** with costs, pricing and expected sales
  - **Registrations**: Udyam, GST if applicable, trade licence (see [how to start a business in Shivamogga](/blog/how-to-start-a-business-in-shivamogga))
  - **KYC and bank statements**
  - **Quotations** for machinery or equipment
  - Proof of **demand**: early orders, enquiries or a market study

  An online presence helps here too. A website and Google profile with real enquiries is strong evidence of demand.

  ## Launch with a plan

  Once funding is sorted, our [Startup Launch Package](/startup-launch-package) gets your website, Google profile, social media and first ads running, so the money you've raised starts bringing customers.
