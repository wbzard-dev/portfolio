content: |
  Bangalore runs on events: big weddings, tech company offsites and town halls, product launches, college fests and endless birthday parties. Event businesses can start with low capital, since you mostly coordinate vendors, but they live and die on **reliability and reputation**.

  ## Part 1: Shape the idea

  **Choose a niche.**

  - **Weddings**: high budgets, emotional clients, long planning cycles, seasonal peaks
  - **Corporate events**: offsites, conferences, team-building, launches. Repeat business and budgets, but demanding procurement processes
  - **Social events**: birthdays, baby showers, anniversaries. Smaller budgets, frequent, referral-driven
  - **Experiences**: themed parties, destination events, concerts and community events

  Starting with one niche helps your portfolio, pricing and marketing all point in the same direction.

  **Decide your model.** Full planning and execution, day-of coordination, décor-only, or a commission model with vendors. Many planners combine a planning fee with transparent vendor costs.

  ## Part 2: Execution

  **Vendor network.** Your real product. Build relationships with:

  - Venues and banquet halls in different areas and price ranges
  - Decorators, florists and lighting
  - Caterers and bakers
  - Photographers and videographers
  - Sound, DJs, emcees and entertainers
  - Transport and accommodation partners

  Do a small event with each new vendor before trusting them with a big one.

  **Business setup.** Register the business, get GST (corporate clients will need it), open a current account and use **written contracts** covering scope, deliverables, payment milestones, cancellation and force majeure.

  **Systems.** Event checklists, timelines, budget sheets and run-of-show documents. Professional planning documents impress clients and prevent mistakes.

  **Your first portfolio.** Plan events for friends, family or community groups at cost in exchange for professional photos, video and reviews. Document everything.

  ## Part 3: Getting clients

  **For weddings and social events:**

  - **Instagram**: Reels of setups, décor reveals, behind the scenes on event day
  - **A portfolio website** with event pages (theme, guest count, budget range, photos and a client quote)
  - **Wedding listing platforms** and **vendor referrals**: photographers and decorators refer planners they trust
  - **Google Business Profile** with event photos and reviews

  **For corporate events:**

  - **A professional website** with corporate case studies, services and an enquiry form. Procurement teams check websites
  - **LinkedIn**: posts about events delivered, outreach to HR, admin and marketing teams at companies in tech parks
  - **Google search ads** for searches like "corporate offsite planners Bangalore"
  - **Fast, professional proposals**: the first good proposal often wins

  ## Your 30-day kickstart plan

  - **Week 1:** niche, services and pricing model; vendor shortlist
  - **Week 2:** contracts and planning templates; first portfolio event planned
  - **Week 3:** website and Google profile live; Instagram or LinkedIn presence started
  - **Week 4:** vendor referral partnerships; first outreach campaign and ads

  ## Where a launch partner fits

  Event planners spend weekends on-site and weekdays with clients and vendors. Building a website, keeping Instagram active and running ads gets squeezed into whatever time is left.

