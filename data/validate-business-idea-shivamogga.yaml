content: |
  Every week someone in Shivamogga signs a shop lease, buys a lakh rupees of stock or pays for an app, and only then finds out whether people want what they're selling. It doesn't have to be that way. Most ideas can be tested in **two to four weeks for a few thousand rupees**.

  ## What "validated" actually means

  Your friends saying "great idea" is not validation. Neither is 200 likes on a post. An idea is validated when **strangers give you money, time or a firm commitment**:

  - Pre-orders or advance payments
  - Bookings for a service or a pilot
  - People filling in a form with their phone number and budget, and answering when you call
  - A waiting list that converts when you launch

  ## Step 1: Check whether people already search for it

  - Type your idea into Google ("cake delivery Shivamogga", "tuition for class 10 Shimoga") and look at the **autocomplete suggestions**, which come from real searches
  - Use **Google Keyword Planner** (free with a Google Ads account) to see rough monthly search volumes for Shivamogga and Karnataka
  - Search both **"Shivamogga" and "Shimoga"**, since people use both. See [why it matters for SEO](/blog/shimoga-vs-shivamogga-seo)

  If nobody searches for it, that doesn't kill the idea, but it means you'll need to create demand with social media and ads instead of capturing it.

  ## Step 2: Study competitors' reviews

  Open Google Maps and look at 5–10 competitors. Read their **3-star and 1-star reviews**. That's where customers tell you what's missing:

  - "Good food but delivery always late"
  - "Teachers are good but no weekend batch"
  - "Nice designs but no online ordering"

  Each complaint is a positioning opportunity.

  ## Step 3: Talk to 15–20 potential customers

  Not friends, but people who match your target customer. Ask about **the past, not the future**:

  - "How do you solve this problem today?"
  - "When did you last pay for something like this? How much?"
  - "What annoyed you about it?"

  Avoid "Would you buy this?". Almost everyone says yes to be polite.

  ## Step 4: Run a small, real test

  Pick the cheapest test that gets you **money or commitment**:

  | Idea type | Test |
  |---|---|
  | Food product, gifts, local produce | WhatsApp catalogue + pre-orders from 30–50 people |
  | Coaching, training, workshops | Landing page + a paid demo class or early-bird batch |
  | Service business | Landing page + Google search ads for a week, then count calls |
  | Café or restaurant | Pop-up stall, weekend event or home-kitchen delivery trial |
  | App or online platform | Landing page with a waitlist, then manually deliver the service before building software |

  A **landing page** is a single web page that explains the offer and asks people to enquire or pre-book. With a small Meta or Google ads budget, it tells you within days whether anyone cares. See our [Google Ads guide](/blog/google-ads-shivamogga-guide).

  ## Step 5: Decide your success number in advance

  Before the test, write down what counts as success. For example:

  - "At least 25 pre-orders in 14 days"
  - "At least 10 enquiries from ₹5,000 of ads"
  - "At least 8 students pay for the demo batch"

  If you hit it, invest the next step. If you don't, change the offer, the price or the audience and test again. That's far cheaper than closing a shop after six months.

  ## Building an app? Test without code first

  For app ideas, the cheapest validation is often doing the service **manually** with WhatsApp and spreadsheets for the first customers. Build software only once you know what people use. Our [website or app first?](/blog/website-or-app-first-for-startups) guide explains how to decide.

