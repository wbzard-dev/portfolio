content: |
  Walk down B.H. Road or Gandhi Bazaar and almost every shopkeeper has WhatsApp open on their phone. Their customers are on Instagram and WhatsApp too: India has about **481 million people reachable on Instagram** ([DataReportal, Digital 2026: India](https://datareportal.com/reports/digital-2026-india)).

  Yet most Shivamogga shops either don't post at all, or post randomly and give up. Here's a simple playbook that works without a big budget or a marketing team.

  ## Step 1: Set up your Instagram properly (one hour, once)

  - Switch to a **Business or Creator profile**.
  - **Name field:** your shop name plus what you sell, e.g. "Sri Lakshmi Silks · Sarees Shivamogga". The name field is searchable.
  - **Bio:** what you sell, where, and one reason to visit. Add a **WhatsApp link**.
  - **Location:** add your address so people can tap for directions.
  - **Highlights:** Prices/Menu · Reviews · New Arrivals · How to Reach.

  ## Step 2: Post 3 times a week, using a simple rhythm

  You don't need to post every day. You need to post **consistently**.

  | Day | Post type | Example |
  |---|---|---|
  | Monday | Reel | "3 sarees under ₹2,000 for Deepavali" |
  | Wednesday | Carousel or offer | "This week's fresh arrivals" with prices |
  | Saturday | Real people | A happy customer (with permission), your team, the shop in the morning |

  Stories in between can be quick and unpolished: a new stock arrival, a short "we're open till 9" note, a poll.

  ## Step 3: Reels ideas that work for local shops

  - **"Price reveal"**: show a product, ask viewers to guess the price, then reveal it.
  - **"Before / after"**: salons, tailors, interior work, car detailing.
  - **"A day at our shop"**: opening up, the first customer, packing orders.
  - **"Festival specials"**: Ugadi, Dasara, Deepavali, wedding season.
  - **"Local pride"**: tie your product to Shivamogga, the monsoon, Malnad culture.

  **Language tip:** test Kannada or bilingual captions and voiceovers. Local audiences often engage more with Kannada content.

  Film on your phone in good light, keep reels short, and put the key message as on-screen text, because many people watch without sound.

  ## Step 4: Make WhatsApp your sales counter

  Download **WhatsApp Business** (free) and set up:

  - **Catalogue:** your main products with photos and prices
  - **Greeting message:** "Namaskara! Thanks for messaging. Here's our catalogue…"
  - **Quick replies:** for price, location, delivery and timings
  - **Labels:** New enquiry, Paid, Delivered
  - **Broadcast lists:** send offers to customers who saved your number (with their permission)

  Reply fast. A customer who waits two hours often buys somewhere else.

  ## Step 5: Use a small ad budget to reach your neighbourhood

  Once your profile has a few good posts, a small **Meta ads** budget can multiply your reach:

  - Target a **radius of a few kilometres** around your shop, or the whole city
  - Use **click-to-WhatsApp** ads so interested people message you directly
  - Promote a clear offer: "Free alteration this week", "10% off for first visit"

  Start small, see which ad brings the most chats, and put more money behind that one. Our [Google and Meta Ads service for Shivamogga](/shivamogga/google-meta-ads) can set this up properly.

  ## Step 6: Check what's working, once a month

  In Instagram Insights, look at:

  - Which posts reached the most **non-followers** (that's discovery)
  - Which posts got **saves, shares and DMs** (that's interest)
  - How many **WhatsApp chats and visits** came from Instagram (ask customers!)

  Do more of the top three, drop the bottom three.

